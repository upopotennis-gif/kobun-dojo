<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渡邊梢太の古文実戦道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>

  :root{
    --ai:#2c3e66;
    --ai-deep:#1d2c4d;
    --yamabuki:#c98a1c;
    --yamabuki-deep:#a06d13;
    --wakatake:#3f8a63;
    --wakatake-bg:#e6f0e8;
    --kobai:#b8483f;
    --kobai-bg:#f6e6e2;
    --bg:#f4efe1;
    --surface:#fffdf8;
    --surface-2:#eae1c9;
    --ink:#2a251c;
    --ink-soft:#6d6553;
    --line:#d9cca7;
    --shadow:rgba(42,37,28,0.14);
    --focus:#8a5a1f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ai:#8fa3d6;
      --ai-deep:#c2cfec;
      --yamabuki:#e0ac47;
      --yamabuki-deep:#f0c877;
      --wakatake:#7fc39e;
      --wakatake-bg:#1c3329;
      --kobai:#e2938c;
      --kobai-bg:#3a2320;
      --bg:#141726;
      --surface:#1c2038;
      --surface-2:#262b4a;
      --ink:#ece5d3;
      --ink-soft:#a9a08b;
      --line:#38406a;
      --shadow:rgba(0,0,0,0.45);
      --focus:#e0ac47;
    }
  }
  :root[data-theme="dark"]{
    --ai:#8fa3d6;
    --ai-deep:#c2cfec;
    --yamabuki:#e0ac47;
    --yamabuki-deep:#f0c877;
    --wakatake:#7fc39e;
    --wakatake-bg:#1c3329;
    --kobai:#e2938c;
    --kobai-bg:#3a2320;
    --bg:#141726;
    --surface:#1c2038;
    --surface-2:#262b4a;
    --ink:#ece5d3;
    --ink-soft:#a9a08b;
    --line:#38406a;
    --shadow:rgba(0,0,0,0.45);
    --focus:#e0ac47;
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{
    max-width:680px;
    margin:0 auto;
    padding:28px 18px 60px;
    position:relative;
  }
  .stage::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
    background-size:16px 16px;
    opacity:.22;
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:0;
  }
  :root:not([data-theme="light"]) .stage::before{ mix-blend-mode:screen; opacity:.10; }
  :root[data-theme="dark"] .stage::before{ mix-blend-mode:screen; opacity:.10; }

  .stage > *{ position:relative; z-index:1; }

  .rod{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 auto;
  }
  .rod::before,.rod::after{
    content:'';
    flex:1;
    height:5px;
    border-radius:3px;
    background:var(--ai-deep);
  }
  .rod .knob{
    width:14px; height:14px; border-radius:50%;
    background:var(--yamabuki);
    box-shadow:0 0 0 2px var(--surface);
    flex:none;
  }

  header.masthead{ text-align:center; padding:6px 0 22px; }
  header.masthead .rod{ margin-bottom:16px; }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(1.6rem, 1.1rem + 3vw, 2.3rem);
    letter-spacing:.03em;
    margin:0 0 8px;
    text-wrap:balance;
  }
  header.masthead p{
    margin:0;
    color:var(--ink-soft);
    font-size:.92rem;
    line-height:1.75;
  }

  section{ display:block; }
  section[hidden]{ display:none !important; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:22px 20px;
    box-shadow:0 3px 14px var(--shadow);
  }
  .card + .card{ margin-top:16px; }

  .steps{
    list-style:none;
    margin:0 0 20px;
    padding:0;
    display:grid;
    gap:8px;
    font-size:.9rem;
    color:var(--ink-soft);
  }
  .steps li{ display:flex; gap:10px; align-items:baseline; }
  .steps .num{
    font-family:'Shippori Mincho',serif;
    color:var(--yamabuki-deep);
    font-weight:700;
    flex:none;
    width:1.4em;
  }

  label.field-label{
    display:block;
    font-weight:700;
    margin-bottom:4px;
    font-size:.95rem;
  }
  .field-hint{
    font-size:.8rem;
    color:var(--ink-soft);
    margin:0 0 10px;
  }

  .unit-group{ margin-bottom:18px; }
  .unit-group:last-child{ margin-bottom:0; }
  .unit-group h3{
    font-family:'Shippori Mincho',serif;
    font-size:.95rem;
    font-weight:700;
    color:var(--ai);
    margin:0 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    border:1.5px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    border-radius:999px;
    padding:8px 14px;
    font-size:.84rem;
    line-height:1.4;
    cursor:pointer;
    font-family:'Zen Maru Gothic',sans-serif;
    text-align:left;
  }
  .chip:hover{ border-color:var(--ai); }
  .chip.active{ background:var(--ai); color:var(--surface); border-color:var(--ai); font-weight:700; }

  .selected-unit-box{
    margin-top:18px;
    padding:12px 14px;
    background:var(--surface-2);
    border-radius:8px;
    font-size:.88rem;
  }
  .selected-unit-box strong{
    font-family:'Shippori Mincho',serif;
    color:var(--ai);
  }

  textarea:focus-visible, button:focus-visible, .choice:focus-visible, .chip:focus-visible, input:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:2px;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:20px;
  }
  button.btn{
    font-family:'Zen Maru Gothic',sans-serif;
    font-weight:700;
    font-size:1.02rem;
    padding:15px 18px;
    border-radius:10px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  @media (prefers-reduced-motion: reduce){ button.btn{ transition:none; } }
  button.btn:active{ transform:translateY(1px); }
  button.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .btn-primary{
    background:var(--yamabuki);
    color:#2a1c04;
    box-shadow:0 3px 0 var(--yamabuki-deep);
  }
  :root:not([data-theme="light"]) .btn-primary{ color:#241a02; }
  :root[data-theme="dark"] .btn-primary{ color:#241a02; }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.04); }
  .btn-secondary{
    background:transparent;
    color:var(--ai);
    border-color:var(--ai);
  }
  .btn-secondary:hover:not(:disabled){ background:var(--surface-2); }
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:none;
    text-decoration:underline;
    padding:8px;
    font-size:.9rem;
  }

  #error-banner[hidden]{ display:none !important; }
  #error-banner{
    background:var(--kobai-bg);
    border:1px solid var(--kobai);
    color:var(--kobai);
    border-radius:8px;
    padding:12px 14px;
    font-size:.88rem;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  #error-banner button{
    background:none; border:none; color:inherit; font-weight:700; cursor:pointer; font-size:1rem; line-height:1;
  }

  .quiz-progress{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
    font-family:'Shippori Mincho',serif;
  }
  .quiz-progress .count{ font-size:1.1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .quiz-progress .score{ font-size:.85rem; color:var(--ink-soft); font-family:'Zen Maru Gothic',sans-serif; }
  .quiz-unit{
    font-size:.8rem;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .passage-box{
    background:var(--surface-2);
    border-radius:8px;
    padding:14px 16px;
    margin:0 0 18px;
  }
  .passage-box .label{
    font-weight:700;
    color:var(--ai);
    display:block;
    margin-bottom:6px;
    font-size:.78rem;
    letter-spacing:.04em;
  }
  .passage-box p{
    font-family:'Shippori Mincho',serif;
    font-size:.98rem;
    line-height:1.9;
    margin:0;
    white-space:pre-wrap;
  }
  .dots{ display:flex; gap:5px; margin-bottom:18px; flex-wrap:wrap; }
  .dots span{ width:9px; height:9px; border-radius:50%; background:var(--line); }
  .dots span.done-correct{ background:var(--wakatake); }
  .dots span.done-wrong{ background:var(--kobai); }
  .dots span.current{ background:var(--yamabuki); }

  .question-text{
    font-family:'Shippori Mincho',serif;
    font-size:clamp(1.05rem, .9rem + 1vw, 1.3rem);
    line-height:1.85;
    margin:0 0 20px;
    text-wrap:balance;
  }

  .choices{ display:grid; gap:10px; }
  .choice{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    width:100%;
    background:var(--bg);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:1rem;
    line-height:1.6;
    color:var(--ink);
    cursor:pointer;
  }
  .choice:hover:not(:disabled){ border-color:var(--ai); }
  .choice .badge{
    flex:none;
    width:28px; height:28px;
    border-radius:50%;
    background:var(--surface-2);
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:.85rem;
    font-family:'Shippori Mincho',serif;
  }
  .choice:disabled{ cursor:default; }
  .choice.correct{ background:var(--wakatake-bg); border-color:var(--wakatake); }
  .choice.correct .badge{ background:var(--wakatake); color:#fff; }
  .choice.incorrect{ background:var(--kobai-bg); border-color:var(--kobai); }
  .choice.incorrect .badge{ background:var(--kobai); color:#fff; }

  .feedback{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }
  .feedback .verdict{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:1.15rem;
    margin:0 0 10px;
  }
  .feedback .verdict.correct{ color:var(--wakatake); }
  .feedback .verdict.incorrect{ color:var(--kobai); }
  .feedback .explanation{ font-size:.95rem; line-height:1.8; margin:0 0 12px; }
  .feedback .translation{
    background:var(--surface-2);
    border-radius:8px;
    padding:12px 14px;
    font-size:.9rem;
    line-height:1.8;
  }
  .feedback .translation .label{
    font-weight:700;
    color:var(--ai);
    display:block;
    margin-bottom:4px;
    font-size:.78rem;
    letter-spacing:.04em;
  }

  .result-head{ text-align:center; padding:8px 0 22px; }
  .stamp{
    width:118px; height:118px;
    margin:0 auto 16px;
    border-radius:50%;
    border:3px solid var(--kobai);
    box-shadow:inset 0 0 0 3px var(--surface), 0 3px 10px var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-5deg);
    color:var(--kobai);
    font-family:'Shippori Mincho',serif;
  }
  .stamp .frac{ font-size:1.7rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .stamp .of{ font-size:.7rem; margin-top:2px; }
  .result-message{ font-size:.98rem; line-height:1.8; color:var(--ink-soft); max-width:32em; margin:0 auto; }

  .guide-content{
    font-size:.98rem;
    line-height:1.95;
  }
  .guide-content h1,.guide-content h2,.guide-content h3{
    font-family:'Shippori Mincho',serif;
    margin:1.2em 0 .5em;
    line-height:1.5;
  }
  .guide-content h1{ font-size:1.25rem; }
  .guide-content h2{ font-size:1.12rem; }
  .guide-content h3{ font-size:1.02rem; }
  .guide-content p{ margin:0 0 .9em; }
  .guide-content ul,.guide-content ol{ margin:0 0 1em; padding-left:1.4em; }
  .guide-content li{ margin-bottom:.4em; }
  .guide-content strong{ color:var(--ai); }
  .guide-content code{ background:var(--surface-2); padding:.1em .3em; border-radius:4px; }
  .thinking{ color:var(--ink-soft); }

  footer{
    text-align:center;
    font-size:.75rem;
    color:var(--ink-soft);
    margin-top:34px;
    line-height:1.7;
  }


.mode-tabs{ display:flex; gap:8px; margin-bottom:20px; }
.mode-tab{
  flex:1;
  border:1.5px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  border-radius:10px;
  padding:14px 10px;
  font-family:'Zen Maru Gothic',sans-serif;
  font-weight:700;
  font-size:.92rem;
  text-align:center;
  cursor:pointer;
}
.mode-tab .sub{ display:block; font-weight:400; font-size:.72rem; color:var(--ink-soft); margin-top:4px; }
.mode-tab.active{ background:var(--ai); color:var(--surface); border-color:var(--ai); }
.mode-tab.active .sub{ color:var(--surface); opacity:.85; }

.diff-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:.78rem;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
  background:var(--surface-2);
  color:var(--ink-soft);
  margin-bottom:10px;
}
.diff-badge .stars{ color:var(--yamabuki-deep); letter-spacing:1px; }
:root:not([data-theme="light"]) .diff-badge .stars{ color:var(--yamabuki); }
:root[data-theme="dark"] .diff-badge .stars{ color:var(--yamabuki); }
.source-tag{ font-size:.76rem; color:var(--ink-soft); margin:6px 0 0; }
</style>
</head>
<body>
<div class="stage">

<header class="masthead">
  <div class="rod"><span class="knob"></span></div>
  <h1>渡邊梢太の古文実戦道場</h1>
  <p>大学入試レベルの助動詞演習。★1〜3の難易度混在で、実戦力を鍛えます。</p>
</header>

<div id="error-banner" hidden>
  <span id="error-text"></span>
  <button id="error-close" aria-label="閉じる">×</button>
</div>

<section id="view-setup">
  <div class="card">
    <label class="field-label">モードを選ぶ</label>
    <p class="field-hint">助動詞の意味そのものを問う「助動詞道場」と、文法知識を生かして現代語訳を選ぶ「現代語訳道場」があります。</p>
    <div class="mode-tabs" id="mode-tabs"></div>

    <label class="field-label">単元を選ぶ</label>
    <p class="field-hint">1回の演習は10問。プールからランダムに出題されるので、繰り返し取り組めます。</p>
    <div class="unit-group">
      <div class="chips" id="unit-chips"></div>
    </div>

    <div class="selected-unit-box" id="selected-box" hidden>
      <strong id="selected-unit-label"></strong>
      <div id="selected-unit-hint" style="margin-top:4px;color:var(--ink-soft);"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-start" disabled>演習をはじめる</button>
    </div>
  </div>
</section>

<section id="view-quiz" hidden>
  <div class="card">
    <div class="quiz-progress">
      <span class="count"><span id="q-current">1</span> / <span id="q-total">10</span></span>
      <span class="score">正解 <span id="q-score">0</span></span>
    </div>
    <p class="quiz-unit" id="q-unit-label"></p>
    <div class="dots" id="q-dots"></div>

    <p class="question-text" id="q-text"></p>
    <div class="choices" id="q-choices"></div>

    <div class="feedback" id="q-feedback" hidden>
      <p class="verdict" id="q-verdict"></p>
      <div class="diff-badge" id="q-diff-badge"></div>
      <p class="explanation" id="q-explanation"></p>
      <div class="translation">
        <span class="label">現代語訳</span>
        <span id="q-translation"></span>
      </div>
      <p class="source-tag" id="q-source"></p>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btn-next" hidden>次の問題へ</button>
      <button class="btn btn-ghost" id="btn-quit">中断してメニューへ戻る</button>
    </div>
  </div>
</section>

<section id="view-result" hidden>
  <div class="result-head">
    <div class="stamp"><span class="frac"><span id="r-score">0</span>/<span id="r-total">10</span></span><span class="of">correct</span></div>
    <p class="result-message" id="r-message"></p>
  </div>
  <div class="actions">
    <button class="btn btn-primary" id="btn-retry">同じ単元でもう一度</button>
    <button class="btn btn-secondary" id="btn-menu">メニューに戻る</button>
  </div>
</section>

<footer>
  渡邊梢太の古文実戦道場 &middot; 出典は公開されている古典作品、または新規作成のオリジナル文です。<br>
  設問・選択肢・解説はすべて書き下ろしです。
</footer>

</div>

<script>
(function(){
  "use strict";

  var MODES = [
    { id: "jodoushi", label: "助動詞道場", sub: "文法的意味を答える", quizKey: "jodoushiQuiz" },
    { id: "yaku", label: "現代語訳道場", sub: "現代語訳を選ぶ", quizKey: "yakuQuiz" }
  ];

  var UNITS = [
 {
  "id": "jodoushi-kiso",
  "label": "助動詞の性質と分類",
  "hint": "接続・活用・識別の基礎"
 },
 {
  "id": "jodoushi-jihatsu",
  "label": "自発・可能・受身・尊敬(る・らる)",
  "hint": "四つの意味を見分ける"
 },
 {
  "id": "jodoushi-shieki",
  "label": "使役・尊敬(す・さす・しむ)",
  "hint": "二重敬語との識別も"
 },
 {
  "id": "jodoushi-kako",
  "label": "過去・完了(き・けり・つ・ぬ・たり・り)",
  "hint": "直接体験と伝聞の違いなど"
 },
 {
  "id": "jodoushi-suiryo",
  "label": "推量(む・むず・らむ・けむ・らし・めり・なり・まし)",
  "hint": "多義語をまとめて攻略"
 },
 {
  "id": "jodoushi-uchikeshi",
  "label": "打消・打消推量(ず・じ・まじ)",
  "hint": "「まじ」の6つの意味に注意"
 },
 {
  "id": "jodoushi-ganbou",
  "label": "願望・比況(まほし・たし・ごとし)",
  "hint": "比況と例示の識別も"
 },
 {
  "id": "jodoushi-sougou",
  "label": "助動詞総合",
  "hint": "全種類を横断して実戦演習"
 }
];

  var POOLS = {
 "jodoushi-kiso": {
  "jodoushiQuiz": [
   {
    "question": "次の文の傍線部「ぬ」について、文法的説明として最も適当なものを選べ。\n\n　花咲きぬ。",
    "choices": [
     "完了の助動詞「ぬ」の終止形で、連用形に接続している",
     "打消の助動詞「ず」の連体形で、未然形に接続している",
     "ナ行変格活用動詞の活用語尾の一部である",
     "断定の助動詞「なり」が変化したものである"
    ],
    "correctIndex": 0,
    "explanation": "「咲き」はカ行四段動詞「咲く」の連用形。連用形に接続する「ぬ」は完了(強意)の助動詞で、文末にあるので終止形である。打消の助動詞「ず」の連体形も「ぬ」の形をとるが、「ず」は未然形に接続するため、連用形である「咲き」には接続できない。",
    "modernTranslation": "花が咲いた。",
    "difficulty": 1,
    "source": "オリジナル"
   },
   {
    "question": "次の文の傍線部「ず」について、文法的説明として最も適当なものを選べ。\n\n　今日は雨降らず。",
    "choices": [

    "explanation": "主語は「城」であり、意志や禁止の対象になり得ない。「べくもあらず」という強い否定を受けて、「一日で落ちることはまずあり得ないだろう」という強い否定的な推量(打消推量)を表す。",
    "modernTranslation": "この城が堅固であることは、簡単には攻め落とせそうにもなく、まして一日で落ちることはないだろう。",
    "difficulty": 3,
    "source": "オリジナル"
   },
   {

    "choices": [
     "都の風雅を見るに違いなくて。",
     "都の風雅を見たくて。",
     "都の風雅を見させたくて。",
     "都の風雅を見るようで。"
    ],
    "correctIndex": 1,
    "explanation": "「まほし」は未然形に接続し、話し手自身の「~したい」という願望を表す。「見まほしく」で「見たくて」の意になる。",
    "modernTranslation": "都の風雅な様子を見たくて、はるばると下ってきた。",
    "difficulty": 1,
    "source": "オリジナル"
   },
   {
    "question": "次の文の傍線部「帰りたく」「夢のごとく」を含む一文の現代語訳として最も適当なものを選べ。\n\n　かかる旅寝の夜半は、ふるさとの空恋しくて、はや帰りたく、夢のごとくいつしか明けぬ。",
    "choices": [
     "このような旅先で寝る夜は、故郷の空が恋しくて、早く帰るに違いなく、夢のようにいつのまにか夜が明けてしまった。",
     "このような旅先で寝る夜は、故郷の空が恋しくて、早く帰りたく、夢のようにいつのまにか夜が明けてしまった。",
     "このような旅先で寝る夜は、故郷の空が恋しくて、早く帰らせたく、夢と同じようにいつのまにか夜が明けてしまった。",
     "このような旅先で寝る夜は、故郷の空が恋しくて、早く帰るはずもなく、夢と比べていつのまにか夜が明けてしまった。"
    ],
    "correctIndex": 1,
    "explanation": "「帰りたく」は願望の助動詞「たし」の連用形で「帰りたい」の意。「夢のごとく」は比況の助動詞「ごとし」の連用形で「夢のように」の意。両方を正しく訳し分けているものを選ぶ。",
    "modernTranslation": "このような旅先で寝る夜は、故郷の空が恋しくて、早く帰りたく、夢のようにいつの間にか夜が明けてしまった。",
    "difficulty": 3,
    "source": "オリジナル"
   }
  ]
 }
};

  var DIFF_LABEL = { 1: "基礎", 2: "標準", 3: "難関" };
  var DIFF_STARS = { 1: "★☆☆", 2: "★★☆", 3: "★★★" };

  var state = {
    mode: "jodoushi",
    unit: null,
    quiz: [],
    index: 0,
    score: 0,
    answered: false
  };

  function $(id){ return document.getElementById(id); }

  function shuffleArray(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function shuffleChoices(q){
    var order = shuffleArray([0,1,2,3]);
    return {
      question: q.question,
      choices: order.map(function(i){ return q.choices[i]; }),
      correctIndex: order.indexOf(q.correctIndex),
      explanation: q.explanation || "",
      modernTranslation: q.modernTranslation || "",
      difficulty: q.difficulty || 2,
      source: q.source || ""
    };
  }

  function showError(msg){
    $("error-text").textContent = msg;
    $("error-banner").hidden = false;
  }
  $("error-close").addEventListener("click", function(){ $("error-banner").hidden = true; });

  function renderModeTabs(){
    var wrap = $("mode-tabs");
    wrap.innerHTML = "";
    MODES.forEach(function(m){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mode-tab" + (state.mode === m.id ? " active" : "");
      btn.innerHTML = m.label + '<span class="sub">' + m.sub + '</span>';
      btn.addEventListener("click", function(){
        state.mode = m.id;
        renderModeTabs();
      });
      wrap.appendChild(btn);
    });
  }

  function renderUnitChips(){
    var wrap = $("unit-chips");
    wrap.innerHTML = "";
    UNITS.forEach(function(u){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip" + (state.unit === u.id ? " active" : "");
      btn.textContent = u.label;
      btn.addEventListener("click", function(){
        state.unit = u.id;
        renderUnitChips();
        var box = $("selected-box");
        box.hidden = false;
        $("selected-unit-label").textContent = u.label;
        $("selected-unit-hint").textContent = u.hint || "";
        $("btn-start").disabled = false;
      });
      wrap.appendChild(btn);
    });
  }

  function currentModeObj(){
    var found = null;
    MODES.forEach(function(m){ if (m.id === state.mode) found = m; });
    return found;
  }

  function pickQuiz(unitId, modeId){
    var mode = currentModeObj();
    var pool = (POOLS[unitId] || {})[mode.quizKey] || [];
    if (pool.length === 0){
      showError("この単元の問題データが見つかりませんでした。");
      return [];
    }
    return shuffleArray(pool).slice(0, 10).map(shuffleChoices);
  }

  function startQuiz(){
    if (!state.unit){ return; }
    state.quiz = pickQuiz(state.unit, state.mode);
    if (state.quiz.length === 0){ return; }
    state.index = 0;
    state.score = 0;
    state.answered = false;
    $("view-setup").hidden = true;
    $("view-result").hidden = true;
    $("view-quiz").hidden = false;
    renderDots();
    renderQuestion();
  }

  function renderDots(){
    var wrap = $("q-dots");
    wrap.innerHTML = "";
    state.quiz.forEach(function(q, i){
      var dot = document.createElement("span");
      if (i < state.index){
        dot.className = q._wasCorrect ? "done-correct" : "done-wrong";
      } else if (i === state.index){
        dot.className = "current";
      }
      wrap.appendChild(dot);
    });
  }

  function unitLabel(id){
    var found = null;
    UNITS.forEach(function(u){ if (u.id === id) found = u; });
    return found ? found.label : "";
  }

  function renderQuestion(){
    state.answered = false;
    var q = state.quiz[state.index];
    $("q-current").textContent = String(state.index + 1);
    $("q-total").textContent = String(state.quiz.length);
    $("q-score").textContent = String(state.score);
    $("q-unit-label").textContent = currentModeObj().label + " / " + unitLabel(state.unit);
    $("q-text").textContent = q.question;

    var choicesWrap = $("q-choices");
    choicesWrap.innerHTML = "";
    var labels = ["A","B","C","D"];
    q.choices.forEach(function(choiceText, i){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      btn.innerHTML = '<span class="badge">' + labels[i] + '</span><span>' + escapeHtml(choiceText) + '</span>';
      btn.addEventListener("click", function(){ selectChoice(i); });
      choicesWrap.appendChild(btn);
    });

    $("q-feedback").hidden = true;
    $("btn-next").hidden = true;
    renderDots();
  }

  function escapeHtml(s){
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function selectChoice(i){
    if (state.answered) { return; }
    state.answered = true;
    var q = state.quiz[state.index];
    var correct = (i === q.correctIndex);
    q._wasCorrect = correct;
    if (correct) { state.score++; }

    var buttons = $("q-choices").querySelectorAll(".choice");
    buttons.forEach(function(btn, idx){
      btn.disabled = true;
      if (idx === q.correctIndex){ btn.classList.add("correct"); }
      else if (idx === i && !correct){ btn.classList.add("incorrect"); }
    });

    $("q-verdict").textContent = correct ? "正解！" : "不正解";
    $("q-verdict").className = "verdict " + (correct ? "correct" : "incorrect");
    var d = q.difficulty || 2;
    $("q-diff-badge").innerHTML = '<span class="stars">' + DIFF_STARS[d] + '</span><span>' + DIFF_LABEL[d] + 'レベル</span>';
    $("q-explanation").textContent = q.explanation;
    $("q-translation").textContent = q.modernTranslation;
    $("q-source").textContent = q.source ? ("出典: " + q.source) : "";
    $("q-feedback").hidden = false;
    $("btn-next").hidden = false;
    $("q-score").textContent = String(state.score);
    renderDots();
  }

  function nextQuestion(){
    state.index++;
    if (state.index >= state.quiz.length){
      renderResult();
    } else {
      renderQuestion();
    }
  }

  function renderResult(){
    $("view-quiz").hidden = true;
    $("view-result").hidden = false;
    $("r-score").textContent = String(state.score);
    $("r-total").textContent = String(state.quiz.length);
    var pct = state.score / state.quiz.length;
    var msg;
    if (pct >= 0.9) { msg = "見事です。この単元はほぼ完璧に理解できています。"; }
    else if (pct >= 0.7) { msg = "よくできました。間違えた問題の解説を読み返しておきましょう。"; }
    else if (pct >= 0.5) { msg = "基本は押さえられています。もう一度取り組んで定着させましょう。"; }
    else { msg = "焦らず、解説をじっくり読んでからもう一度挑戦してみましょう。"; }
    $("r-message").textContent = msg;
  }

  function backToSetup(){
    $("view-quiz").hidden = true;
    $("view-result").hidden = true;
    $("view-setup").hidden = false;
  }

  $("btn-start").addEventListener("click", startQuiz);
  $("btn-next").addEventListener("click", nextQuestion);
  $("btn-quit").addEventListener("click", backToSetup);
  $("btn-retry").addEventListener("click", startQuiz);
  $("btn-menu").addEventListener("click", backToSetup);

  renderModeTabs();
  renderUnitChips();
})();
</script>
</body>
</html>
