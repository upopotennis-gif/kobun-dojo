<title>渡邊梢太の古文文法道場</title>
<style>
  :root{
    --ai:#2c3e66;
    --ai-deep:#1d2c4d;
    --yamabuki:#c98a1c;
    --yamabuki-deep:#a06d13;
    --wakatake:#3f8a63;
    --wakatake-bg:#e6f0e8;
    --kobai:#b8483f;
    --kobai-bg:#f6e6e2;
    --bg:#f4efe1;
    --surface:#fffdf8;
    --surface-2:#eae1c9;
    --ink:#2a251c;
    --ink-soft:#6d6553;
    --line:#d9cca7;
    --shadow:rgba(42,37,28,0.14);
    --focus:#8a5a1f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ai:#8fa3d6;
      --ai-deep:#c2cfec;
      --yamabuki:#e0ac47;
      --yamabuki-deep:#f0c877;
      --wakatake:#7fc39e;
      --wakatake-bg:#1c3329;
      --kobai:#e2938c;
      --kobai-bg:#3a2320;
      --bg:#141726;
      --surface:#1c2038;
      --surface-2:#262b4a;
      --ink:#ece5d3;
      --ink-soft:#a9a08b;
      --line:#38406a;
      --shadow:rgba(0,0,0,0.45);
      --focus:#e0ac47;
    }
  }
  :root[data-theme="dark"]{
    --ai:#8fa3d6;
    --ai-deep:#c2cfec;
    --yamabuki:#e0ac47;
    --yamabuki-deep:#f0c877;
    --wakatake:#7fc39e;
    --wakatake-bg:#1c3329;
    --kobai:#e2938c;
    --kobai-bg:#3a2320;
    --bg:#141726;
    --surface:#1c2038;
    --surface-2:#262b4a;
    --ink:#ece5d3;
    --ink-soft:#a9a08b;
    --line:#38406a;
    --shadow:rgba(0,0,0,0.45);
    --focus:#e0ac47;
  }

  *{ box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{
    max-width:680px;
    margin:0 auto;
    padding:28px 18px 60px;
    position:relative;
  }
  .stage::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
    background-size:16px 16px;
    opacity:.22;
    mix-blend-mode:multiply;
    pointer-events:none;
    z-index:0;
  }
  :root:not([data-theme="light"]) .stage::before{ mix-blend-mode:screen; opacity:.10; }
  :root[data-theme="dark"] .stage::before{ mix-blend-mode:screen; opacity:.10; }

  .stage > *{ position:relative; z-index:1; }

  .rod{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 auto;
  }
  .rod::before,.rod::after{
    content:'';
    flex:1;
    height:5px;
    border-radius:3px;
    background:var(--ai-deep);
  }
  .rod .knob{
    width:14px; height:14px; border-radius:50%;
    background:var(--yamabuki);
    box-shadow:0 0 0 2px var(--surface);
    flex:none;
  }

  header.masthead{ text-align:center; padding:6px 0 22px; }
  header.masthead .rod{ margin-bottom:16px; }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:clamp(1.6rem, 1.1rem + 3vw, 2.3rem);
    letter-spacing:.03em;
    margin:0 0 8px;
    text-wrap:balance;
  }
  header.masthead p{
    margin:0;
    color:var(--ink-soft);
    font-size:.92rem;
    line-height:1.75;
  }

  section{ display:block; }
  section[hidden]{ display:none !important; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:22px 20px;
    box-shadow:0 3px 14px var(--shadow);
  }
  .card + .card{ margin-top:16px; }

  .steps{
    list-style:none;
    margin:0 0 20px;
    padding:0;
    display:grid;
    gap:8px;
    font-size:.9rem;
    color:var(--ink-soft);
  }
  .steps li{ display:flex; gap:10px; align-items:baseline; }
  .steps .num{
    font-family:'Shippori Mincho',serif;
    color:var(--yamabuki-deep);
    font-weight:700;
    flex:none;
    width:1.4em;
  }

  label.field-label{
    display:block;
    font-weight:700;
    margin-bottom:4px;
    font-size:.95rem;
  }
  .field-hint{
    font-size:.8rem;
    color:var(--ink-soft);
    margin:0 0 10px;
  }

  .unit-group{ margin-bottom:18px; }
  .unit-group:last-child{ margin-bottom:0; }
  .unit-group h3{
    font-family:'Shippori Mincho',serif;
    font-size:.95rem;
    font-weight:700;
    color:var(--ai);
    margin:0 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    border:1.5px solid var(--line);
    background:var(--bg);
    color:var(--ink);
    border-radius:999px;
    padding:8px 14px;
    font-size:.84rem;
    line-height:1.4;
    cursor:pointer;
    font-family:'Zen Maru Gothic',sans-serif;
    text-align:left;
  }
  .chip:hover{ border-color:var(--ai); }
  .chip.active{ background:var(--ai); color:var(--surface); border-color:var(--ai); font-weight:700; }

  .selected-unit-box{
    margin-top:18px;
    padding:12px 14px;
    background:var(--surface-2);
    border-radius:8px;
    font-size:.88rem;
  }
  .selected-unit-box strong{
    font-family:'Shippori Mincho',serif;
    color:var(--ai);
  }

  textarea:focus-visible, button:focus-visible, .choice:focus-visible, .chip:focus-visible, input:focus-visible{
    outline:3px solid var(--focus);
    outline-offset:2px;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:20px;
  }
  button.btn{
    font-family:'Zen Maru Gothic',sans-serif;
    font-weight:700;
    font-size:1.02rem;
    padding:15px 18px;
    border-radius:10px;
    border:1px solid transparent;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  @media (prefers-reduced-motion: reduce){ button.btn{ transition:none; } }
  button.btn:active{ transform:translateY(1px); }
  button.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
  .btn-primary{
    background:var(--yamabuki);
    color:#2a1c04;
    box-shadow:0 3px 0 var(--yamabuki-deep);
  }
  :root:not([data-theme="light"]) .btn-primary{ color:#241a02; }
  :root[data-theme="dark"] .btn-primary{ color:#241a02; }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.04); }
  .btn-secondary{
    background:transparent;
    color:var(--ai);
    border-color:var(--ai);
  }
  .btn-secondary:hover:not(:disabled){ background:var(--surface-2); }
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:none;
    text-decoration:underline;
    padding:8px;
    font-size:.9rem;
  }

  #error-banner[hidden]{ display:none !important; }
  #error-banner{
    background:var(--kobai-bg);
    border:1px solid var(--kobai);
    color:var(--kobai);
    border-radius:8px;
    padding:12px 14px;
    font-size:.88rem;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  #error-banner button{
    background:none; border:none; color:inherit; font-weight:700; cursor:pointer; font-size:1rem; line-height:1;
  }

  .quiz-progress{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:6px;
    font-family:'Shippori Mincho',serif;
  }
  .quiz-progress .count{ font-size:1.1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .quiz-progress .score{ font-size:.85rem; color:var(--ink-soft); font-family:'Zen Maru Gothic',sans-serif; }
  .quiz-unit{
    font-size:.8rem;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .passage-box{
    background:var(--surface-2);
    border-radius:8px;
    padding:14px 16px;
    margin:0 0 18px;
  }
  .passage-box .label{
    font-weight:700;
    color:var(--ai);
    display:block;
    margin-bottom:6px;
    font-size:.78rem;
    letter-spacing:.04em;
  }
  .passage-box p{
    font-family:'Shippori Mincho',serif;
    font-size:.98rem;
    line-height:1.9;
    margin:0;
    white-space:pre-wrap;
  }
  .dots{ display:flex; gap:5px; margin-bottom:18px; flex-wrap:wrap; }
  .dots span{ width:9px; height:9px; border-radius:50%; background:var(--line); }
  .dots span.done-correct{ background:var(--wakatake); }
  .dots span.done-wrong{ background:var(--kobai); }
  .dots span.current{ background:var(--yamabuki); }

  .question-text{
    font-family:'Shippori Mincho',serif;
    font-size:clamp(1.05rem, .9rem + 1vw, 1.3rem);
    line-height:1.85;
    margin:0 0 20px;
    text-wrap:balance;
  }

  .choices{ display:grid; gap:10px; }
  .choice{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    width:100%;
    background:var(--bg);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:1rem;
    line-height:1.6;
    color:var(--ink);
    cursor:pointer;
  }
  .choice:hover:not(:disabled){ border-color:var(--ai); }
  .choice .badge{
    flex:none;
    width:28px; height:28px;
    border-radius:50%;
    background:var(--surface-2);
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:.85rem;
    font-family:'Shippori Mincho',serif;
  }
  .choice:disabled{ cursor:default; }
  .choice.correct{ background:var(--wakatake-bg); border-color:var(--wakatake); }
  .choice.correct .badge{ background:var(--wakatake); color:#fff; }
  .choice.incorrect{ background:var(--kobai-bg); border-color:var(--kobai); }
  .choice.incorrect .badge{ background:var(--kobai); color:#fff; }

  .feedback{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }
  .feedback .verdict{
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:1.15rem;
    margin:0 0 10px;
  }
  .feedback .verdict.correct{ color:var(--wakatake); }
  .feedback .verdict.incorrect{ color:var(--kobai); }
  .feedback .explanation{ font-size:.95rem; line-height:1.8; margin:0 0 12px; }
  .feedback .translation{
    background:var(--surface-2);
    border-radius:8px;
    padding:12px 14px;
    font-size:.9rem;
    line-height:1.8;
  }
  .feedback .translation .label{
    font-weight:700;
    color:var(--ai);
    display:block;
    margin-bottom:4px;
    font-size:.78rem;
    letter-spacing:.04em;
  }

  .result-head{ text-align:center; padding:8px 0 22px; }
  .stamp{
    width:118px; height:118px;
    margin:0 auto 16px;
    border-radius:50%;
    border:3px solid var(--kobai);
    box-shadow:inset 0 0 0 3px var(--surface), 0 3px 10px var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-5deg);
    color:var(--kobai);
    font-family:'Shippori Mincho',serif;
  }
  .stamp .frac{ font-size:1.7rem; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .stamp .of{ font-size:.7rem; margin-top:2px; }
  .result-message{ font-size:.98rem; line-height:1.8; color:var(--ink-soft); max-width:32em; margin:0 auto; }

  .guide-content{
    font-size:.98rem;
    line-height:1.95;
  }
  .guide-content h1,.guide-content h2,.guide-content h3{
    font-family:'Shippori Mincho',serif;
    margin:1.2em 0 .5em;
    line-height:1.5;
  }
  .guide-content h1{ font-size:1.25rem; }
  .guide-content h2{ font-size:1.12rem; }
  .guide-content h3{ font-size:1.02rem; }
  .guide-content p{ margin:0 0 .9em; }
  .guide-content ul,.guide-content ol{ margin:0 0 1em; padding-left:1.4em; }
  .guide-content li{ margin-bottom:.4em; }
  .guide-content strong{ color:var(--ai); }
  .guide-content code{ background:var(--surface-2); padding:.1em .3em; border-radius:4px; }
  .thinking{ color:var(--ink-soft); }

  footer{
    text-align:center;
    font-size:.75rem;
    color:var(--ink-soft);
    margin-top:34px;
    line-height:1.7;
  }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">

<div class="stage">
  <header class="masthead">
    <div class="rod"><span class="knob"></span><span class="knob"></span></div>
    <h1>渡邊梢太の古文文法道場</h1>
    <p>「解析古典文法」の章立てに沿って単元を選ぶと、4択クイズと学習ガイドがすぐに始まります。アカウント登録は不要です。</p>
    <div class="rod" style="margin-top:16px"><span class="knob"></span><span class="knob"></span></div>
  </header>

  <div id="error-banner" hidden>
    <span id="error-text"></span>
    <button type="button" id="error-close" aria-label="閉じる">×</button>
  </div>

  <main id="app">

    <section id="view-setup">
      <div class="card">
        <ol class="steps">
          <li><span class="num">一</span>単元を選ぶ</li>
          <li><span class="num">二</span>「クイズを始める」を押して4択に挑戦</li>
        </ol>

        <div id="unit-groups"></div>

        <div class="selected-unit-box" id="selected-unit-box" hidden>
          選択中の単元: <strong id="selected-unit-label"></strong>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-primary" id="btn-make-quiz" disabled>クイズを始める</button>
          <button type="button" class="btn btn-secondary" id="btn-view-guide" disabled>学習ガイドを見る</button>
        </div>
      </div>
    </section>

    <section id="view-quiz" hidden>
      <div class="card">
        <div class="quiz-progress">
          <span class="count" id="quiz-count">問 1 / 10</span>
          <span class="score" id="quiz-score">正解 0</span>
        </div>
        <p class="quiz-unit" id="quiz-unit"></p>
        <div class="passage-box" id="quiz-passage" hidden>
          <span class="label">本文</span>
          <p id="quiz-passage-text"></p>
        </div>
        <div class="dots" id="quiz-dots"></div>
        <p class="question-text" id="quiz-question"></p>
        <div class="choices" id="quiz-choices"></div>

        <div class="feedback" id="quiz-feedback" hidden>
          <p class="verdict" id="feedback-verdict"></p>
          <p class="explanation" id="feedback-explanation"></p>
          <div class="translation" id="feedback-translation" hidden>
            <span class="label">現代語訳</span>
            <span id="feedback-translation-text"></span>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-primary" id="btn-next-question" hidden>次の問題へ</button>
        </div>
      </div>
    </section>

    <section id="view-result" hidden>
      <div class="card">
        <div class="result-head">
          <div class="stamp"><span class="frac" id="result-frac">0/10</span><span class="of">正解</span></div>
          <p class="result-message" id="result-message"></p>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="btn-retry-quiz">同じ問題にもう一度挑戦</button>
          <button type="button" class="btn btn-secondary" id="btn-new-quiz">違う10問に挑戦する</button>
          <button type="button" class="btn btn-secondary" id="btn-guide-from-result">学習ガイドを見る</button>
          <button type="button" class="btn btn-ghost" id="btn-change-unit">別の単元を選ぶ</button>
        </div>
      </div>
    </section>

    <section id="view-guide" hidden>
      <div class="card">
        <div class="guide-content" id="guide-content"></div>
        <div class="actions">
          <button type="button" class="btn btn-secondary" id="btn-guide-back">単元選択に戻る</button>
        </div>
      </div>
    </section>

  </main>

  <footer>渡邊梢太の古文文法道場 — 「解析古典文法 四訂版」の章立てを参考にした単元構成です。<br>説明文・例文・問題はすべて独自に作成しており、同書の本文は使用していません。ページを開くだけで、アカウント登録なしで使えます。</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
(function(){
  "use strict";

  var UNITS = [
    { chapter: "章1 古典文法入門", items: [
      { id:"kana", label:"歴史的仮名遣い", hint:"歴史的仮名遣いの読み方の原則(語中語尾のハ行がワ行音になる、など)と現代仮名遣いへの直し方" },
      { id:"tango-tan-i", label:"言葉の単位(文・文節・単語)", hint:"文章・文・文節・単語の区切り方、文節相互の関係の識別" },
      { id:"hinshi", label:"品詞の種類", hint:"自立語と付属語の品詞分類、活用する品詞としない品詞の見分け方" },
      { id:"katsuyo-kiso", label:"活用の基礎(活用形・語幹)", hint:"活用形6種類(未然形・連用形・終止形・連体形・已然形・命令形)の名称と、語幹・活用語尾の考え方" }
    ]},
    { chapter: "章2 用言(動詞・形容詞・形容動詞)", items: [
      { id:"doushi-yodan-nidan", label:"四段・上二段・下二段", hint:"四段活用・上二段活用・下二段活用の見分け方と活用表(未然形の音による識別、現代語との対応)" },
      { id:"doushi-ichidan", label:"上一段・下一段", hint:"上一段活用・下一段活用の見分け方と活用表(語幹と語尾の区別がつきにくい語の覚え方)" },
      { id:"doushi-henkaku", label:"動詞の変格活用(カ変・サ変・ナ変・ラ変)", hint:"カ行変格活用(来)・サ行変格活用(す)・ナ行変格活用(死ぬ・往ぬ)・ラ行変格活用(あり・をり等)の活用" },
      { id:"doushi-sougou", label:"動詞の活用の種類(総合)", hint:"四段・上一段・上二段・下一段・下二段・カ変・サ変・ナ変・ラ変のすべての活用の種類を横断して識別する総合問題" },
      { id:"doushi-onbin", label:"動詞の音便・補助動詞", hint:"動詞のイ音便・ウ音便・撥音便・促音便、補助動詞、自動詞と他動詞の違い" },
      { id:"keiyoushi", label:"形容詞の活用(ク活用・シク活用)", hint:"ク活用とシク活用の違いと見分け方" },
      { id:"keiyoudoushi", label:"形容動詞の活用(ナリ活用・タリ活用)", hint:"ナリ活用とタリ活用の違いと見分け方" }
    ]},
    { chapter:"章3 助動詞", items:[
      { id:"jodoushi-kiso", label:"助動詞の性質と分類", hint:"助動詞の意味による分類と接続による分類の全体像" },
      { id:"jodoushi-jihatsu", label:"自発・可能・受身・尊敬(る・らる)", hint:"「る」「らる」がもつ4つの意味の識別方法" },
      { id:"jodoushi-shieki", label:"使役・尊敬(す・さす・しむ)", hint:"「す」「さす」「しむ」の意味と接続、二重尊敬との関係" },
      { id:"jodoushi-kako", label:"過去・完了(き・けり・つ・ぬ・たり・り)", hint:"「き」と「けり」の違い、「つ」「ぬ」「たり」「り」の完了・強意の識別" },
      { id:"jodoushi-suiryo", label:"推量(む・むず・らむ・けむ・らし・めり・なり・まし)", hint:"推量系助動詞それぞれの意味の識別と接続の違い" },
      { id:"jodoushi-uchikeshi", label:"打消・打消推量(ず・じ・まじ)", hint:"「ず」「じ」「まじ」の活用と意味の識別" },
      { id:"jodoushi-ganbou", label:"願望・比況(まほし・たし・ごとし)", hint:"願望の助動詞と比況の助動詞の識別" }
    ]},

である。", "modernTranslation": "氷の刃のようだ。"}, {"question": "「まほし」が用いられた文章の時代的特徴として正しいものはどれか。", "choices": ["奈良時代から平安中期の作品(万葉集や竹取物語など)に多く用いられる", "江戸時代の文章にのみ用いられる", "鎌倉時代以降にしか現れない", "現代語と全く同じ用法で使われる"], "correctIndex": 0, "explanation": "「まほし」は奈良時代から平安中期の作品に多く見られる願望の助動詞である。", "modernTranslation": ""}, {"question": "「たし」が用いられた文章の時代的特徴として正しいものはどれか。", "choices": ["平安時代後期以降の作品に多く用いられ、現代語の「〜たい」に直接つながる", "万葉集にのみ用いられる", "「まほし」より古い時代の語である", "比況の意味しか持たない"], "correctIndex": 0, "explanation": "「たし」は平安後期以降に多く用いられ、現代語の「〜たい」に直接つながる語である。", "modernTranslation": ""}, {"question": "「まほし」の語の活用の性質として正しいものはどれか。", "choices": ["願望の意を表し、形容詞シク活用に近い活用をする", "動詞「まふ」の未然形である", "断定の助動詞「なり」の変化形である", "完了の助動詞である"], "correctIndex": 0, "explanation": "「まほし」は願望を表す助動詞で、形容詞のシク活用に準じた活用をする。", "modernTranslation": ""}, {"question": "「見たくもなし。」における「たく」の説明として正しいものはどれか。", "choices": ["願望の助動詞「たし」の連用形", "打消の助動詞「ず」の連用形", "過去の助動詞「き」の連体形", "断定の助動詞「なり」の連用形"], "correctIndex": 0, "explanation": "「たく」は願望の助動詞「たし」の連用形で、下に「なし」が続いている。", "modernTranslation": "見たくもない。"}, {"question": "「ごとし」と似た意味を持つ語で、格助詞的な要素に助動詞的要素が加わってできたと考えられる語はどれか。", "choices": ["ごとし", "べし", "まし", "なり"], "correctIndex": 0, "explanation": "「ごとし」は比況を表す助動詞そのものである。", "modernTranslation": ""}, {"question": "「わが心の鏡のごとくならば」の「ごとく」の下に続く「なら」の説明として正しいものはどれか。", "choices": ["断定の助動詞「なり」の未然形で、接続助詞「ば」に接続している", "伝聞推定の助動詞である", "過去の助動詞である", "使役の助動詞である"], "correctIndex": 0, "explanation": "「なら」は断定の助動詞「なり」の未然形で、仮定の接続助詞「ば」に接続している。", "modernTranslation": "私の心が鏡のようであるならば。"}, {"question": "「見まほしけれど、かなはず。」の文構造の説明として正しいものはどれか。", "choices": ["「まほしけれ」は願望の助動詞「まほし」の已然形で、逆接の接続助詞「ど」に接続している", "「まほしけれ」は打消推量の助動詞である", "「まほしけれ」は完了の意味を持つ", "「まほしけれ」は体言に接続している"], "correctIndex": 0, "explanation": "已然形「まほしけれ」に逆接の接続助詞「ど」が続く形である。", "modernTranslation": "見たいけれど、かなわない。"}, {"question": "願望の助動詞「まほし」「たし」の識別で注意すべき点として正しいものはどれか。", "choices": ["どちらも自己の希望を表す点で共通するが、接続の違い(未然形/連用形)で判別する", "「まほし」は他者の願望専用である", "「たし」は打消の意味を含む", "両者は全く別の意味を持つ"], "correctIndex": 0, "explanation": "意味は同じ自己の希望だが、接続の違いによって区別する。", "modernTranslation": ""}, {"question": "比況の助動詞「ごとし」が終止形・連体形以外の活用形をあまり持たない理由として最も適切な説明はどれか。", "choices": ["「ごとし」は主に「〜のようだ」「〜のような」という言い切り・連体修飾の用法で使われることが多く、他の活用形の使用例が少ないため", "全く活用しない語だから", "助詞だから", "体言だから"], "correctIndex": 0, "explanation": "「ごとし」は実際の文章では主に終止形・連体形で使われる用例が多い。", "modernTranslation": ""}, {"question": "次のうち、願望を表す助動詞として正しい組み合わせはどれか。", "choices": ["まほし・たし", "ごとし・なり", "じ・まじ", "らむ・けむ"], "correctIndex": 0, "explanation": "願望を表す助動詞は「まほし」「たし」である。", "modernTranslation": ""}, {"question": "「命あらば、また見まほし。」の全体の意味として最も適切なものはどれか。", "choices": ["命があったら、また見たい(という願望)", "命があったら、また見られるだろう(という推量)", "命がないので、見られない(という断定)", "命があるはずがない(という打消)"], "correctIndex": 0, "explanation": "「まほし」は願望の助動詞なので、「見たい」という自己の希望を表す。", "modernTranslation": "命があったなら、また見たい。"}], "joshi-kiso": [{"question": "助詞の文法的性質として正しいものはどれか。", "choices": ["自立語で活用する", "自立語で活用しない", "付属語で活用する", "付属語で活用しない"], "correctIndex": 3, "explanation": "助詞は単独で文節を作れない付属語であり、かつ活用しない語である。①②は自立語である点が誤り、③は活用する点が誤り(活用する付属語は助動詞)。", "modernTranslation": ""}, {"question": "学校文法(橋本文法)において、助詞は一般に何種類に分類されるか。", "choices": ["4種類", "5種類", "6種類", "7種類"], "correctIndex": 2, "explanation": "格助詞・接続助詞・係助詞・副助詞・終助詞・間投助詞の6種類に分類するのが標準的な学校文法の立場である。", "modernTranslation": ""}, {"question": "主に体言に付いて、その語と他の語との意味関係(格)を示す助詞を何というか。", "choices": ["接続助詞", "格助詞", "係助詞", "副助詞"], "correctIndex": 1, "explanation": "格助詞は体言(または体言に準ずる語)に付いて、その語が文中でどのような資格(主語・連用修飾語など)を持つかを示す。「が」「の」「を」「に」などが代表例。", "modernTranslation": ""}, {"question": "用言や助動詞など活用語に付いて、前後の文節や文をつなぐ働きをする助詞を何というか。", "choices": ["格助詞", "接続助詞", "副助詞", "間投助詞"], "correctIndex": 1, "explanation": "接続助詞は活用語に付いて前後をつなぎ、順接・逆接などの論理関係を示す。「ば」「ど」「て」などが代表例。", "modernTranslation": ""}, {"question": "「ぞ・なむ・や・か・こそ」のように、文末の活用形に影響を与えて意味を強めたりする助詞を何というか。", "choices": ["副助詞", "係助詞", "終助詞", "格助詞"], "correctIndex": 1, "explanation": "これらは係助詞であり、文末を通常とは異なる活用形(連体形・已然形)で結ばせる「係り結びの法則」を引き起こす点が最大の特徴である。", "modernTranslation": ""}, {"question": "種々の語に付いて意味を添え、下にある用言を修飾する働きをする助詞を何というか。", "choices": ["副助詞", "終助詞", "係助詞", "格助詞"], "correctIndex": 0, "explanation": "副助詞は「だに」「さへ」「のみ」「ばかり」などのように、いろいろな語に付いて類推・限定・添加などの意味を添え、下の用言に係っていく。", "modernTranslation": ""}, {"question": "文末(または句の切れ目)に付いて、話し手の願望・禁止・詠嘆などの気持ちを表す助詞を何というか。", "choices": ["終助詞", "間投助詞", "係助詞", "接続助詞"], "correctIndex": 0, "explanation": "終助詞は文末に付いて話し手の心情を表す。禁止の「な」、自己の願望の「ばや」、詠嘆の「かな」などが代表例。", "modernTranslation": ""}, {"question": "文中や文末に用いられ、語調を整えたり呼びかけ・詠嘆の意を添えたりする助詞を何というか。", "choices": ["間投助詞", "副助詞", "接続助詞", "格助詞"], "correctIndex": 0, "explanation": "間投助詞は「を」「や」「よ」などで、呼びかけや詠嘆、語調の調整のために文中・文末に用いられる。", "modernTranslation": ""}, {"question": "次のうち、助詞の6分類に含まれないものはどれか。", "choices": ["副助詞", "間投助詞", "連体助詞", "係助詞"], "correctIndex": 2, "explanation": "学校文法の6分類は格助詞・接続助詞・係助詞・副助詞・終助詞・間投助詞であり、「連体助詞」という分類は存在しない。格助詞「の」「が」に連体格の用法があるが、それを独立の分類名とすることはない。", "modernTranslation": ""}, {"question": "「祇園精舎の鐘の声」(平家物語「祇園精舎」)の傍線部「鐘の声」における「の」が担っている、上の体言が下の体言を修飾する用法は何助詞のものか。", "choices": ["副助詞", "格助詞", "接続助詞", "終助詞"], "correctIndex": 1, "explanation": "「の」は格助詞であり、「鐘の声」のように上の体言「鐘」が下の体言「声」を修飾する「連体格」の用法である。", "modernTranslation": "祇園精舎の鐘の音(声)"}, {"question": "助詞は単独で文節を構成できるか。", "choices": ["できる", "できない", "体言に付くときのみできる", "終助詞のみできる"], "correctIndex": 1, "explanation": "助詞は付属語であるため、単独では文節を作れず、必ず直前の自立語などとともに一文節を構成する。", "modernTranslation": ""}, {"question": "次のうち格助詞に分類されるものはどれか。", "choices": ["だに", "より", "こそ", "な"], "correctIndex": 1, "explanation": "「より」は起点や比較の基準などを表す格助詞である。「だに」は副助詞、「こそ」は係助詞、「な」は終助詞(禁止)。", "modernTranslation": ""}, {"question": "次のうち接続助詞に分類されるものはどれか。", "choices": ["を(動作の対象を示す)", "つつ", "のみ", "かし"], "correctIndex": 1, "explanation": "「つつ」は動作の反復や同時進行を表す接続助詞である。他は、対象を示す格助詞の「を」、限定の副助詞「のみ」、念押しの終助詞「かし」。", "modernTranslation": ""}, {"question": "次のうち係助詞に分類されるものはどれか。", "choices": ["して", "ばかり", "なむ", "とも"], "correctIndex": 2, "explanation": "「なむ」は係助詞であり、係り結びの法則によって文末を連体形で結ぶ。「して」は格助詞・接続助詞、「ばかり」は副助詞、「とも」は接続助詞である。", "modernTranslation": ""}, {"question": "次のうち副助詞に分類されるものはどれか。", "choices": ["すら", "ぞ", "にて", "ど"], "correctIndex": 0, "explanation": "「すら」は類推(〜さえ)を表す副助詞である。「ぞ」は係助詞、「にて」は格助詞、「ど」は接続助詞。", "modernTranslation": ""}, {"question": "次のうち終助詞に分類されるものはどれか。", "choices": ["が", "し", "もがな", "へ"], "correctIndex": 2, "explanation": "「もがな」は願望を表す終助詞である。「が」は格助詞・接続助詞、「し」は副助詞、「へ」は方向を表す格助詞。", "modernTranslation": ""}, {"question": "助詞は活用の有無で見た場合、次のどれに分類されるか。", "choices": ["活用する付属語", "活用しない付属語", "活用する自立語", "活用しない自立語"], "correctIndex": 1, "explanation": "助詞は活用しない付属語である。活用する付属語は助動詞であり、助詞と混同しないよう注意する。", "modernTranslation": ""}, {"question": "「冬はいかなる所にも住まる。」(徒然草「家の作りやうは」)の「は」「も」は、6分類のうちどれに属するか。", "choices": ["格助詞", "係助詞", "副助詞", "接続助詞"], "correctIndex": 1, "explanation": "「は」「も」は係助詞に分類される。「冬は」の「は」は主題を示し、「所にも」の「も」は格助詞「に」に付いた係助詞である。係り結びの法則によって文末の活用形を変えるのは「ぞ・なむ・や・か・こそ」であり、「は・も」は通常どおり終止形で結ぶ点に注意する。", "modernTranslation": "冬はどんな場所にでも住むことができる。"}, {"question": "格助詞と、副助詞・係助詞・終助詞との接続の傾向の違いとして最も適切なものはどれか。", "choices": ["格助詞は主に体言に付くが、副助詞・係助詞・終助詞は体言以外の種々の語にも付きやすい", "格助詞は体言以外にしか付かない", "副助詞・係助詞・終助詞は体言にしか付かない", "接続の傾向に違いはない"], "correctIndex": 0, "explanation": "格助詞は主に体言(またはそれに準ずる語)に付くのに対し、副助詞・係助詞・終助詞は用言や副詞など種々の語にも付くことができ、接続がより自由である。", "modernTranslation": ""}, {"question": "「聞きしにも過ぎて、尊くこそおはしけれ。」(徒然草「仁和寺にある法師」)の「こそ」は6分類のうちどれに属するか。", "choices": ["副助詞", "係助詞", "終助詞", "格助詞"], "correctIndex": 1, "explanation": "「こそ」は係助詞であり、係り結びの法則により文末を已然形「おはしけれ」で結んでいる。", "modernTranslation": "聞いていた以上に、尊くいらっしゃった。"}, {"question": "助詞の分類のうち、「順接」「逆接」といった前後の論理関係を示すことに特化しているのはどれか。", "choices": ["格助詞", "接続助詞", "副助詞", "間投助詞"], "correctIndex": 1, "explanation": "接続助詞は「ば(順接)」「ど(逆接)」のように、前後の文節・文の論理関係を示すことに特化した助詞である。", "modernTranslation": ""}, {"question": "「この花を折りてまうで来たるなり。」(竹取物語「蓬莱の玉の枝」)の「花を」の「を」の分類として正しいものはどれか。", "choices": ["副助詞", "格助詞", "接続助詞", "終助詞"], "correctIndex": 1, "explanation": "この「を」は動作の対象を示しており、格助詞の用法である。", "modernTranslation": "この花を折って持って参ったのである。"}, {"question": "助詞と助動詞の違いについて正しいものはどれか。", "choices": ["助詞は活用するが助動詞は活用しない", "助詞は活用しないが助動詞は活用する", "両方とも活用する", "両方とも活用しない"], "correctIndex": 1, "explanation": "助動詞は活用する付属語であり、助詞は活用しない付属語である。この活用の有無が両者を区別する基本的な指標となる。", "modernTranslation": ""}, {"question": "次のうち、体言の代用(準体法)としての用法を持つ格助詞はどれか。", "choices": ["の", "ぞ", "だに", "かな"], "correctIndex": 0, "explanation": "格助詞「の」には「〜のもの」という意味で体言の代わりをする準体法(体言の代用)の用法がある。「ぞ」は係助詞、「だに」は副助詞、「かな」は終助詞である。", "modernTranslation": ""}, {"question": "「うつくしきもの、瓜にかきたる児の顔。」(枕草子)の「の」の用法として最も適切なのはどれか。", "choices": ["主格", "連体格", "同格", "体言の代用"], "correctIndex": 1, "explanation": "「児の顔」は「児」が「顔」を修飾しており、連体格の用法である。", "modernTranslation": "かわいらしいもの。瓜に描いた幼児の顔。"}, {"question": "助詞の6分類のうち、文末の活用形を規則的に変化させる「係り結びの法則」に直接関わるのはどれか。", "choices": ["格助詞", "係助詞", "副助詞", "間投助詞"], "correctIndex": 1, "explanation": "係助詞のうち「ぞ・なむ・や・か・こそ」が係り結びの法則を引き起こす。「は・も」は係助詞ではあるが、この法則による結びの変化は起こさない。", "modernTranslation": ""}, {"question": "間投助詞の説明として最も適切なものはどれか。", "choices": ["文末にのみ用いられ願望を表す", "文中・文末で語調を整えたり詠嘆を添えたりする", "体言にのみ付き主格を表す", "已然形にのみ付く"], "correctIndex": 1, "explanation": "間投助詞は文中・文末に用いられ、呼びかけ・詠嘆・語調の調整などの働きをする(例:「を」「や」「よ」)。", "modernTranslation": ""}, {"question": "係助詞と間投助詞に共通する点として最も適切なものはどれか。", "choices": ["どちらも体言にしか付かない", "どちらも語句を強調したり語調を整えたりする働きを持つ", "どちらも已然形接続である", "どちらも禁止の意味を表す"], "correctIndex": 1, "explanation": "係助詞・間投助詞はともに、語句を強調したり語調を整えたりする働きを持つ。ただし文末の活用形を規則的に変える係り結びの法則を伴うのは係助詞のみである。", "modernTranslation": ""}, {"question": "次の助詞のうち、格助詞としても接続助詞としても用いられるものはどれか。", "choices": ["が", "だに", "こそ", "な"], "correctIndex": 0, "explanation": "「が」は体言に付いて主格・連体格を示す格助詞の用法と、活用語の連体形に付いて文をつなぐ接続助詞の用法の両方を持つ。", "modernTranslation": ""}, {"question": "助詞の意味・用法を正しく識別するために最も重要な視点はどれか。", "choices": ["助詞の読み方の美しさ", "直前の語の品詞・活用形と文脈", "助詞の文字数", "漢字表記かどうか"], "correctIndex": 1, "explanation": "同じ助詞でも直前の語の品詞・活用形(接続)や前後の文脈によって意味・用法・分類が変わるため、それらを踏まえて識別することが重要である。", "modernTranslation": ""}], "joshi-kaku": [{"question": "「誰が言ふことぞ。」の「が」の用法として最も適切なものはどれか。", "choices": ["連体格", "主格", "同格", "体言の代用"], "correctIndex": 1, "explanation": "「誰が言ふ」は「誰が言う」という意味で、「が」は動作の主体を示す主格の用法。", "modernTranslation": "誰が言うことか。"}, {"question": "「わが庵は都のたつみしかぞ住む」の「わが」の「が」の用法として最も適切なものはどれか。", "choices": ["主格", "連体格", "同格", "体言の代用"], "correctIndex": 1, "explanation": "「わが庵」は「私の庵」の意で、「が」は下の体言「庵」を修飾する連体格の用法。", "modernTranslation": "私の庵は都の東南にあり、このように(心のどかに)住んでいる。"}, {"question": "「夕日のさして山の端いと近うなりたるに」(枕草子「春はあけぼの」)の「夕日の」の「の」の用法として最も適切なものはどれか。", "choices": ["主格", "連体格", "同格", "体言の代用"], "correctIndex": 0, "explanation": "「夕日のさして」は「夕日が差して」の意で、「の」は動作の主体を示す主格の用法(「が」に置き換えられる)。", "modernTranslation": "夕日が差して山の端にとても近くなっているときに"}, {"question": "「沙羅双樹の花の色、盛者必衰の理をあらはす。」(平家物語「祇園精舎」)の「花の色」の「の」の用法として最も適切なものはどれか。", "choices": ["主格", "連体格", "同格", "体言の代用"], "correctIndex": 1, "explanation": "「花の色」は「花」が「色」を修飾しており、連体格の用法である。", "modernTranslation": "沙羅双樹の花の色は、勢いの盛んな者も必ず衰えるという道理を表している。"}, {"question": "「白き鳥の、嘴と脚と赤き、川の辺にゐて魚を食ふ」の「白き鳥の」の「の」の用法として最も適切なものはどれか。", "choices": ["主格", "連体格", "同格", "体言の代用"], "correctIndex": 2, "explanation": "「白き鳥の、嘴と脚と赤き」は「白い鳥で、嘴と脚が赤い(鳥)」という意味で、上下が同じものを指して並べる同格の用法。「〜で」と訳す。", "modernTranslation": "白い鳥で、嘴と脚が赤いものが、川のほとりにいて魚を食べる。"}, {"question": "「赤きが大きなる」のように「の」「が」が「〜のもの」の意味で体言の代わりをする用法を何というか。", "choices": ["主格", "連体格", "同格", "体言の代用(準体法)"], "correctIndex": 3, "explanation": "この場合の「が」は下に体言を省略し、「赤きもの」の意味を表す体言の代用(準体法)の用法である。", "modernTranslation": "赤いもので大きなもの"}, {"question": "「家の作りやうは、夏をむねとすべし。」(徒然草)の「夏を」の「を」の用法として最も適切なものはどれか。", "choices": ["動作の対象", "動作の起点", "経過する場所", "使役の相手"], "correctIndex": 0, "explanation": "「夏をむねとす」の「を」は「旨とする」対象を示す、対象を表す基本的な用法。", "modernTranslation": "家の作り方は、夏を中心に考えるべきである。"}, {"question": "「住み慣れし宿を出でて」の「を」の用法として最も適切なものはどれか。", "choices": ["動作の対象", "動作の起点", "経過する場所", "比較の基準"], "correctIndex": 1, "explanation": "「宿を出づ」は「宿から出る」の意で、この「を」は動作の起点(出発点)を表す。", "modernTranslation": "住み慣れた家を出て"}, {"question": "「山を越えて都へ上る。」の「を」の用法として最も適切なものはどれか。", "choices": ["動作の対象", "動作の起点", "経過する場所", "変化の結果"], "correctIndex": 2, "explanation": "「山を越ゆ」の「を」は、動作が行われる経過点・通過点を表す用法。", "modernTranslation": "山を越えて都へ上る。"}, {"question": "「向かひのつらに立てり。」(宇治拾遺物語「絵仏師良秀」)の「つらに」の「に」の用法として最も適切なものはどれか。", "choices": ["場所", "時間", "変化の結果", "使役の相手"], "correctIndex": 0, "explanation": "「つらに立てり」の「に」は動作・存在の行われる場所を示す。", "modernTranslation": "(良秀は自分の家の)向かい側に立っていた。"}, {"question": "「我、朝ごと夕ごとに見る竹の中におはするにて知りぬ。」(竹取物語「かぐや姫誕生の場面」)の「夕ごとに」の「に」の用法として最も適切なものはどれか。", "choices": ["場所", "時間", "原因・理由", "比較の基準"], "correctIndex": 1, "explanation": "「朝ごと夕ごとに見る」の「に」は動作が行われる時を示す用法。", "modernTranslation": "私が毎朝毎夕見ている竹の中にいらっしゃるので、わかった。"}, {"question": "「さて、かたへの人にあひて」(徒然草「仁和寺にある法師」)の「人に」の「に」の用法として最も適切なものはどれか。", "choices": ["場所", "動作の相手・対象", "原因・理由", "変化の結果"], "correctIndex": 1, "explanation": "「人にあひて」の「に」は動作が向けられる相手を示す用法。", "modernTranslation": "そうして、そばにいる人に会って"}, {"question": "「雨に濡れて心細し。」の「に」の用法として最も適切なものはどれか。", "choices": ["場所", "時間", "原因・理由", "比較の基準"], "correctIndex": 2, "explanation": "「雨に濡れて」の「に」は、心細く思う原因・理由を示す用法。", "modernTranslation": "雨に濡れて心細い。"}, {"question": "「露は消えて霜となりぬ。」の「と」の用法と対応する「に」の用法として、次のうち「〜になる」という変化の結果を表すものはどれか。", "choices": ["「花に酔ふ」の「に」", "「霜になりぬ」の「に」", "「都に住む」の「に」", "「夕方に来る」の「に」"], "correctIndex": 1, "explanation": "「霜になる」のように、変化の結果できた状態を示す「に」の用法。「都に住む」は場所、「夕方に来る」は時間、「花に酔ふ」は原因・対象に近い用法である。", "modernTranslation": "露は消えて霜になった。"}, {"question": "「たけき者も遂にはほろびぬ、偏に風の前の塵に同じ。」(平家物語「祇園精舎」)の「塵に同じ」の「に」の用法として最も適切なものはどれか。", "choices": ["場所", "比較の基準", "使役の相手", "変化の結果"], "correctIndex": 1, "explanation": "「塵に同じ」の「に」は比較の基準を示す用法で、「塵と同じだ」の意味になる。", "modernTranslation": "猛々しい者も最後には滅んでしまう、ひとえに風の前の塵と同じである。"}, {"question": "「人に泣かす。」のように、使役の相手を示す「に」の用法はどれに分類されるか。", "choices": ["場所", "使役・受身の相手", "起点", "手段"], "correctIndex": 1, "explanation": "使役の助動詞「す・さす」などとともに用いられ、「〜に…させる」の「〜に」にあたる相手を示す「に」の用法。", "modernTranslation": "人を泣かせる。"}, {"question": "「逃げ出でて大路へ出でにけり。」(宇治拾遺物語「絵仏師良秀」)の「大路へ」の「へ」の用法として最も適切なものはどれか。", "choices": ["場所(存在)", "方向", "起点", "対象"], "correctIndex": 1, "explanation": "「へ」は移動の方向を示す格助詞で、現代語の「〜へ」とほぼ同じ用法である。", "modernTranslation": "逃げ出して大通りへ出てしまった。"}, {"question": "「友と語らふ。」の「と」の用法として最も適切なものはどれか。", "choices": ["共同動作の相手", "引用", "比較", "変化の結果"], "correctIndex": 0, "explanation": "「友と語らふ」の「と」は、ともに動作を行う相手を示す用法。", "modernTranslation": "友人と語り合う。"}, {"question": "「名をば、さぬきの造となむいひける。」(竹取物語「かぐや姫誕生の場面」)の「造と」の「と」の用法として最も適切なものはどれか。", "choices": ["共同動作の相手", "引用", "比較", "起点"], "correctIndex": 1, "explanation": "名称をそのまま受けて示す引用の「と」の用法で、「さぬきの造と(いう名で)言った」の意になる。", "modernTranslation": "名前を、さぬきの造といった。"}, {"question": "「氷は水と等し。」の「と」の用法として最も適切なものはどれか。", "choices": ["共同動作の相手", "引用", "比較の基準", "変化の結果"], "correctIndex": 2, "explanation": "「水と等し」の「と」は比較の基準を示す用法で、「〜と同じだ」の「〜と」にあたる。", "modernTranslation": "氷は水と同じだ。"}, {"question": "「露と消えぬ。」の「と」の用法として最も適切なものはどれか。", "choices": ["共同動作の相手", "引用", "比較の基準", "変化の結果"], "correctIndex": 3, "explanation": "「露と消ゆ」の「と」は、変化した結果の状態を示す用法で、「〜として」「〜になって」に近い意味を表す。", "modernTranslation": "露となって消えてしまった。"}, {"question": "「家の隣より火出で来て」(宇治拾遺物語「絵仏師良秀」)の「隣より」の「より」の用法として最も適切なものはどれか。", "choices": ["起点", "比較の基準", "手段・経由", "即時"], "correctIndex": 0, "explanation": "「隣より火出で来て」の「より」は動作の起点(〜から)を示す用法。", "modernTranslation": "家の隣から火が出てきて"}, {"question": "「遣戸は蔀の間よりも明し。」(徒然草「家の作りやうは」)の「間よりも」の「より」の用法として最も適切なものはどれか。", "choices": ["起点", "比較の基準", "手段・経由", "即時"], "correctIndex": 1, "explanation": "「間よりも明し」の「より」は比較の基準を示し、「蔀の間よりも明るい」の意味になる。", "modernTranslation": "遣戸は蔀の間よりも明るい。"}, {"question": "「山より行く道」の「より」の用法として最も適切なものはどれか。", "choices": ["起点", "比較の基準", "経由(手段)", "即時"], "correctIndex": 2, "explanation": "「山より行く」の「より」は動作が経由する場所・手段を示す用法で、「〜を通って」の意味に近い。", "modernTranslation": "山を通って行く道"}, {"question": "「弓を引くより、はや矢は放たれぬ。」のように、「〜と同時に」「〜するやいなや」の意味を表す「より」の用法を何というか。", "choices": ["起点", "比較の基準", "経由", "即時(即座)"], "correctIndex": 3, "explanation": "「引くより」は「引くとすぐに」の意で、動作の直後に次の動作が起こることを示す即時の用法。", "modernTranslation": "弓を引くとすぐに、もう矢は放たれてしまった。"}, {"question": "「あづま路の道の果てよりも、なほ奥つ方に生ひ出でたる人」(更級日記)の「果てよりも」の「より」の用法として最も適切なものはどれか。", "choices": ["起点", "比較の基準", "経由", "即時"], "correctIndex": 0, "explanation": "「道の果てより」は「道の果てから」の意で、出発点・起点を表す「より」の用法。「も」は係助詞。", "modernTranslation": "東国へ続く道の果てよりも、さらに奥のほうで生まれ育った人(が)"}, {"question": "「高館の下にて大河に落ち入る。」(奥の細道「夏草」)の「下にて」の「にて」の用法として最も適切なものはどれか。", "choices": ["場所", "手段", "原因・理由", "資格"], "correctIndex": 0, "explanation": "「下にて大河に落ち入る」の「にて」は動作の行われる場所を示す用法で、現代語の「〜で」にあたる。", "modernTranslation": "高館のふもとで(衣川は)大河に流れ込む。"}, {"question": "「筆にて書く。」の「にて」の用法として最も適切なものはどれか。", "choices": ["場所", "手段・道具", "原因・理由", "資格"], "correctIndex": 1, "explanation": "「筆にて書く」の「にて」は動作に用いる道具・手段を示す用法。", "modernTranslation": "筆で書く。"}, {"question": "「我、朝ごと夕ごとに見る竹の中におはするにて知りぬ。」(竹取物語「かぐや姫誕生の場面」)の「おはするにて」の「にて」の用法として最も適切なものはどれか。", "choices": ["場所", "手段", "原因・理由", "資格"], "correctIndex": 2, "explanation": "「おはするにて知りぬ」の「にて」は、そこにいらっしゃることを理由として知ったという、原因・理由を示す用法。", "modernTranslation": "私が毎朝毎夕見ている竹の中にいらっしゃるので、(私の子になるべき人だと)わかった。"}, {"question": "「男してことづてさせたり。」の「して」の用法として最も適切なものはどれか。", "choices": ["場所", "使役の相手・手段(〜を使って・〜に命じて)", "起点", "比較"], "correctIndex": 1, "explanation": "「して」は格助詞で、使役の対象や手段(〜を使って、〜に頼んで)を示す用法を持つ。「男してことづてさす」は「男に命じて伝言させる」の意。", "modernTranslation": "男に頼んで伝言させた。"}], "joshi-setsuzoku": [{"question": "接続助詞「ば」が未然形に接続するとき表す意味として最も適切なものはどれか。", "choices": ["順接仮定条件(もし〜ならば)", "順接確定条件(〜ので)", "逆接確定条件(〜けれども)", "逆接仮定条件(たとえ〜としても)"], "correctIndex": 0, "explanation": "「ば」は未然形に接続すると「もし〜ならば」という順接仮定条件を表す。已然形に接続する場合は確定条件になる点との違いに注意する。", "modernTranslation": ""}, {"question": "「命長ければ辱多し。」(徒然草)の「長ければ」の「ば」が表す意味として最も適切なものはどれか。", "choices": ["順接仮定条件", "順接確定条件(原因・理由)", "逆接確定条件", "逆接仮定条件"], "correctIndex": 1, "explanation": "「長けれ」は形容詞已然形で、已然形+「ば」は原因・理由を表す順接確定条件(〜ので)となる。", "modernTranslation": "命が長いと(長生きすると)恥をかくことが多い。"}, {"question": "「目を見開いたれば、風少し吹き弱り、扇も射よげにぞなつたりける。」(平家物語「扇の的」)のように、已然形+「ば」がある動作をしたところ偶然別のことが起こったことを示す用法を何というか。", "choices": ["順接仮定条件", "偶然条件", "恒常条件", "逆接確定条件"], "correctIndex": 1, "explanation": "已然形+「ば」には、ある動作をしたところ、たまたま別の事態に出会ったことを示す偶然条件(〜すると)の用法がある。ここでは「目を見開いたところ、風が弱まった」という意味になる。", "modernTranslation": "目を見開くと、風が少し弱まり、扇も射やすい具合になった。"}, {"question": "「花咲けば、鳥来鳴く。」のように、已然形+「ば」がいつも変わらず成り立つ事柄を表す用法を何というか。", "choices": ["順接仮定条件", "偶然条件", "恒常条件", "逆接確定条件"], "correctIndex": 2, "explanation": "已然形+「ば」には、「〜すると必ず」「〜するといつも」という恒常条件を表す用法もある。", "modernTranslation": "花が咲くと、いつも鳥がやって来て鳴く。"}, {"question": "接続助詞「とも」が表す意味として最も適切なものはどれか。", "choices": ["順接仮定条件", "逆接仮定条件(たとえ〜としても)", "逆接確定条件", "単純接続"], "correctIndex": 1, "explanation": "「とも」は活用語の終止形に接続し、「たとえ〜としても」という逆接の仮定条件を表す。", "modernTranslation": ""}, {"question": "「あり」のようなラ変動詞に「とも」が接続する場合、接続する活用形として正しいものはどれか。", "choices": ["未然形", "連用形", "終止形", "連体形"], "correctIndex": 3, "explanation": "「とも」は原則として終止形接続だが、ラ変型活用語(ラ変動詞、形容詞・形容動詞のカリ活用、打消の助動詞「ず」のカリ活用など)には連体形に接続する(終止形と連体形が同形でない活用型のため)。", "modernTranslation": ""}, {"question": "接続助詞「ど」が接続する活用形と表す意味の組み合わせとして正しいものはどれか。", "choices": ["未然形接続・順接仮定条件", "已然形接続・逆接確定条件", "終止形接続・逆接仮定条件", "連用形接続・単純接続"], "correctIndex": 1, "explanation": "「ど」は已然形に接続し、「〜けれども」という逆接確定条件を表す。", "modernTranslation": ""}, {"question": "「ども」と「ど」の違いとして最も適切なものはどれか。", "choices": ["「ども」は順接、「ど」は逆接である", "意味・接続(已然形)は同じで、「ども」の方がやや語調を強める", "「ども」は未然形接続である", "「ども」は終助詞である"], "correctIndex": 1, "explanation": "「ど」「ども」はどちらも已然形に接続し逆接確定条件を表す接続助詞で、意味は同じ。「ども」の方が丁寧・強めの語感を持つとされる。", "modernTranslation": ""}, {"question": "接続助詞「て」が接続する活用形として正しいものはどれか。", "choices": ["未然形", "連用形", "終止形", "已然形"], "correctIndex": 1, "explanation": "「て」は連用形に接続し、前後の動作・状態を単純につなぐ(単純接続)働きをする。", "modernTranslation": ""}, {"question": "「男してことづてさす」の「して」とは異なり、接続助詞として用いられる「して」の意味として最も適切なものはどれか。", "choices": ["「て」とほぼ同じ単純接続", "逆接確定条件", "願望", "禁止"], "correctIndex": 0, "explanation": "接続助詞の「して」は連用形に接続し、「て」とほぼ同じ意味(単純接続)を表す、やや強めた言い方である。格助詞の「して」(手段・使役の相手)とは区別する必要がある。", "modernTranslation": ""}, {"question": "「竹を取りつつ、よろづのことに使ひけり。」(竹取物語)の「つつ」が表す意味として最も適切なものはどれか。", "choices": ["動作の反復", "逆接確定条件", "願望", "打消接続"], "correctIndex": 0, "explanation": "「取りつつ」は「取っては、また取っては」というように、同じ動作を繰り返す反復の意味を表す。", "modernTranslation": "竹を取っては(いろいろな器物に使い)、さまざまなことに使っていた。"}, {"question": "「涙を流しつつ、歩みゆく。」の「つつ」が表す意味として最も適切なものはどれか。", "choices": ["動作の反復", "動作の同時進行(〜しながら)", "逆接", "願望"], "correctIndex": 1, "explanation": "この「つつ」は「涙を流す」と「歩む」という二つの動作が同時に行われていることを示す同時進行の用法。", "modernTranslation": "涙を流しながら、歩いて行く。"}, {"question": "「思ひつつ寝ればや人の見えつらむ」(小野小町)の和歌のように、「つつ」が文末近くに用いられて、動作・状態の継続に詠嘆・余情をこめる用法を特に何と呼ぶことがあるか。", "choices": ["つつ止め", "係り結び", "音便", "係助詞化"], "correctIndex": 0, "explanation": "和歌などの文末近くで「つつ」を用いて、継続する動作・心情に余情をこめる用法を「つつ止め」と呼ぶことがある。", "modernTranslation": "あの人のことを思いながら寝たので、あの人が(夢に)見えたのだろうか。"}, {"question": "接続助詞「ながら」の意味として当てはまらないものはどれか。", "choices": ["動作の並行(〜しながら)", "状態の継続(そのまま)", "逆接(〜けれども)", "願望(〜てほしい)"], "correctIndex": 3, "explanation": "「ながら」には動作の並行・状態の継続・逆接の意味はあるが、願望の意味はない。願望は「ばや」「もがな」などの終助詞が表す。", "modernTranslation": ""}, {"question": "「住み馴れしながらの姿にて」のように、「ながら」が「そのままの状態で」の意味を表す用法を何というか。", "choices": ["動作の並行", "状態の継続", "逆接", "順接仮定条件"], "correctIndex": 1, "explanation": "この「ながら」はもとの状態がそのまま変わらず続いていることを示す状態の継続の用法。", "modernTranslation": "住み慣れていたままの姿で"}, {"question": "「口には言はねども、心には思ひながら、あへて出でず。」の「思ひながら」の「ながら」が表す意味として最も適切なものはどれか。", "choices": ["動作の並行", "状態の継続", "逆接(〜けれども・〜のに)", "順接確定条件"], "correctIndex": 2, "explanation": "「思ひながら」は「思っているけれども」という逆接の意味を表しており、後半の内容と対立する。", "modernTranslation": "口には出さないけれども、心では思っているのに、あえて口には出さない。"}, {"question": "接続助詞「で」の成り立ちと意味として最も適切なものはどれか。", "choices": ["連用形+打消「ず」が変化したもので、「〜て」の意味", "未然形に接続し、打消を伴う「〜ないで」の意味", "已然形に接続し、「〜けれども」の意味", "終止形に接続し、「たとえ〜でも」の意味"], "correctIndex": 1, "explanation": "「で」は打消の助動詞「ず」の連用形の古い形「に」を含む語が変化してできたもので、未然形に接続し「〜ないで」という打消接続の意味を表す。", "modernTranslation": ""}, {"question": "「母に知らせで、京へ上りぬ。」の「知らせで」の意味として最も適切なものはどれか。", "choices": ["母に知らせて", "母に知らせないで", "母に知らせたので", "母に知らせるけれども"], "correctIndex": 1, "explanation": "「知らせで」は「知らせ(未然形)+で」で、「知らせないで」という打消接続の意味になる。", "modernTranslation": "母に知らせないで、京へ上った。"}, {"question": "接続助詞として用いられる「が」の接続として正しいものはどれか。", "choices": ["未然形", "連用形", "終止形", "連体形"], "correctIndex": 3, "explanation": "接続助詞の「が」「に」「を」はいずれも活用語の連体形に接続する。これは、もともと体言(に準ずる語=連体形)に付く格助詞の用法から発達したためである。", "modernTranslation": ""}, {"question": "「年十六、七ばかりなるが、薄化粧して、かねぐろなり。」(平家物語「敦盛の最期」)の「なるが」の「が」の意味として最も適切なものはどれか。", "choices": ["順接確定条件", "単純接続(〜で・〜が)", "願望", "禁止"], "correctIndex": 1, "explanation": "この「が」は連体形「なる」に接続し、前後をゆるやかにつなぐ接続助詞(単純接続)で、「十六、七歳くらいであって」という意味になる。", "modernTranslation": "年は十六、七歳くらいであって、薄化粧をして、お歯黒をつけている。"}, {"question": "接続助詞として用いられる「に」「を」の接続として正しいものはどれか。", "choices": ["未然形", "連用形", "終止形", "連体形"], "correctIndex": 3, "explanation": "接続助詞「に」「を」も「が」と同様に、活用語の連体形に接続するのが原則である。", "modernTranslation": ""}, {"question": "「それも知らず、ただ逃げ出でたるをことにして」(宇治拾遺物語「絵仏師良秀」)の「出でたるを」の「を」の用法として最も適切なものはどれか。", "choices": ["格助詞(対象)", "接続助詞(単純接続)", "副助詞", "終助詞"], "correctIndex": 1, "explanation": "「逃げ出でたる」という連体形の下に付き、前後をつなぐ接続助詞の用法。体言に直接付く格助詞の「を」とは区別する。", "modernTranslation": "それにも気づかず、ただ逃げ出したことだけを大事にして"}, {"question": "接続助詞「が」と格助詞「が」を識別する際に、最も注目すべき点はどれか。", "choices": ["直前の語が体言か活用語の連体形か", "文の長さ", "係り結びの有無", "漢字表記かどうか"], "correctIndex": 0, "explanation": "格助詞の「が」は体言に付いて主格・連体格を示すのに対し、接続助詞の「が」は活用語の連体形に付いて文をつなぐ。直前の語の品詞・活用形を確認することが識別の鍵となる。", "modernTranslation": ""}, {"question": "格助詞の「して」と接続助詞の「して」を区別する視点として最も適切なものはどれか。", "choices": ["直前が体言(手段・使役の相手)か活用語の連用形(単純接続)か", "文末にあるかどうか", "已然形かどうか", "係り結びの有無"], "correctIndex": 0, "explanation": "格助詞の「して」は体言に付いて手段や使役の相手を示すのに対し、接続助詞の「して」は活用語の連用形に付いて「て」に近い単純接続を表す。", "modernTranslation": ""}, {"question": "已然形に接続して逆接確定条件を表す接続助詞の組み合わせとして正しいものはどれか。", "choices": ["ば・とも", "ど・ども", "て・つつ", "が・を"], "correctIndex": 1, "explanation": "已然形に接続し「〜けれども」という逆接確定条件を表すのは「ど」「ども」である。「ば」は未然形・已然形の両方に接続し意味が異なり、「とも」は終止形(ラ変型は連体形)接続で逆接仮定、「て」「つつ」は連用形接続。", "modernTranslation": ""}, {"question": "次のうち、意味が「単純接続(そして・〜て)」に最も近い接続助詞はどれか。", "choices": ["ど", "とも", "て", "ばや"], "correctIndex": 2, "explanation": "「て」は前後の事柄を単純に、時間的な前後関係としてつなぐ接続助詞である。「ど」は逆接、「とも」は逆接仮定、「ばや」は終助詞(願望)。", "modernTranslation": ""}, {"question": "接続助詞「とも」と「ど・ども」の違いとして正しいものはどれか。", "choices": ["「とも」は逆接の仮定条件、「ど・ども」は逆接の確定条件である", "「とも」は順接、「ど・ども」は逆接である", "「とも」は已然形接続、「ど・ども」は終止形接続である", "意味・用法に違いはない"], "correctIndex": 0, "explanation": "「とも」は「たとえ〜としても」という、まだ起こっていない事柄を仮定する逆接仮定条件を表す。一方「ど・ども」は已然形に接続し、すでに成立している事実に対する逆接確定条件(〜けれども)を表す。", "modernTranslation": ""}, {"question": "「よし降るとも、出でて行かむ。」の「とも」の意味として最も適切なものはどれか。", "choices": ["たとえ降っても", "降るので", "降るけれども", "降るならば"], "correctIndex": 0, "explanation": "「降るとも」は「たとえ雨が降っても」という逆接仮定条件を表す。", "modernTranslation": "たとえ雨が降っても、出かけて行こう。"}, {"question": "「花見にとて出でしが、雨に降られぬ。」の「が」の用法として最も適切なものはどれか。", "choices": ["格助詞(主格)", "接続助詞(単純接続・逆接)", "副助詞", "終助詞"], "co されるか。", "choices": ["人代名詞と指示代名詞", "自称と他称", "近称と遠称", "普通名詞と固有名詞"], "correctIndex": 0, "explanation": "代名詞は人を指す「人代名詞」と、事物・場所・方向を指す「指示代名詞」に大別される。", "modernTranslation": ""}, {"question": "人代名詞はさらに数種類に分けられるが、次のうち人代名詞の分類に当たらないものはどれか。", "choices": ["自称", "対称", "他称", "近称"], "correctIndex": 3, "explanation": "人代名詞は話し手を指す自称、相手を指す対称、それ以外の第三者を指す他称、不特定の人を指す不定称に分かれる。近称は指示代名詞の分類である。", "modernTranslation": ""}, {"question": "次のうち自称(話し手自身を指す)代名詞でないものはどれか。", "choices": ["われ", "まろ", "おのれ", "なんぢ"], "correctIndex": 3, "explanation": "「なんぢ」は相手を指す対称代名詞。「われ」「まろ」「おのれ」は文脈により自称として用いられる。", "modernTranslation": ""}, {"question": "「なんぢ」「そなた」「おまへ」に共通する人代名詞の分類は何か。", "choices": ["自称", "対称", "他称", "不定称"], "correctIndex": 1, "explanation": "いずれも話し相手を指す対称代名詞である。", "modernTranslation": ""}, {"question": "「かれ」が人代名詞として使われる場合、どの分類に属するか。", "choices": ["自称", "対称", "他称", "不定称"], "correctIndex": 2, "explanation": "「かれ」は話し手・聞き手以外の第三者を指す他称代名詞。現代語の「彼」のもとになった語。", "modernTranslation": ""}, {"question": "「たれ」「いづれ」に共通する人代名詞の分類は何か。", "choices": ["自称", "対称", "他称", "不定称"], "correctIndex": 3, "explanation": "特定の人物を指さず、不明・未定の対象を指す代名詞を不定称という。「たれ」は疑問・不特定の人を表す。", "modernTranslation": ""}, {"question": "指示代名詞のうち、話し手に近い事物・場所を指すものを何というか。", "choices": ["近称", "中称", "遠称", "不定称"], "correctIndex": 0, "explanation": "話し手に近いものを指すのが近称(これ・ここ・こなた等)である。", "modernTranslation": ""}, {"question": "指示代名詞「それ」「そこ」「そなた」はどの分類に属するか。", "choices": ["近称", "中称", "遠称", "不定称"], "correctIndex": 1, "explanation": "聞き手に近い、または話題の中心となるものを指すのが中称である。", "modernTranslation": ""}, {"question": "指示代名詞「かれ」「かしこ」「あなた」に共通する分類は何か。", "choices": ["近称", "中称", "遠称", "不定称"], "correctIndex": 2, "explanation": "話し手からも聞き手からも離れたものを指すのが遠称である。なお「かれ」は文脈によって人代名詞(他称)にも指示代名詞(遠称)にもなりうる。", "modernTranslation": ""}, {"question": "指示代名詞「いづれ」「いづこ」「いづら」に共通する分類は何か。", "choices": ["近称", "中称", "遠称", "不定称"], "correctIndex": 3, "explanation": "場所・方向・事物が特定できない場合に用いる不定称の指示代名詞である。", "modernTranslation": ""}, {"question": "竹取物語(蓬莱の玉の枝)「金・銀・瑠璃色の水、山より流れいでたり。それには、色々の玉の橋渡せり」の「それ」が属する分類はどれか。", "choices": ["近称", "中称", "遠称", "不定称"], "correctIndex": 1, "explanation": "「それ」は直前に述べられた「金・銀・瑠璃色の水」を受けて指しており、中称にあたる。", "modernTranslation": "金・銀・瑠璃色の水が、山から流れ出ている。その水の上には、色とりどりの宝石の橋が架け渡されている。"}, {"question": "宇治拾遺物語(絵仏師良秀)「それも知らず、ただ逃げ出でたるをことにして、向かひのつらに立てり」の「こと」の品詞・用法は何か。", "choices": ["普通名詞(実質的な意味を持つ)", "形式名詞", "代名詞", "数詞"], "correctIndex": 1, "explanation": "ここでの「こと」は「逃げ出したこと」という動作を抽象的に名詞化して受ける形式的な働きをしており、形式名詞用法である。「つら」は「面・方向」という実質的な意味を保つ普通名詞。", "modernTranslation": "それにも気づかず、ただ逃げ出したことだけを気にかけて、(家の)向かい側に立っていた。"}, {"question": "伊勢物語「昔、男ありけり。その男、身をえうなきものに思ひなして」の「その」が指す語の品詞は何か。", "choices": ["動詞", "形容詞", "名詞(体言)", "副詞"], "correctIndex": 2, "explanation": "「その」が受けているのは前出の「男」という名詞(体言)である。", "modernTranslation": "昔、男がいた。その男は、我が身を役に立たないものだと思いこんで。"}, {"question": "枕草子「春はあけぼの。やうやう白くなりゆく山ぎは」の「山ぎは」の名詞の種類はどれか。", "choices": ["固有名詞", "普通名詞", "数詞", "形式名詞"], "correctIndex": 1, "explanation": "「山ぎは」は特定の山を指す固有名詞ではなく、山と空の境目一般を表す普通名詞である。", "modernTranslation": "春は明け方(が良い)。だんだん白くなっていく山際の空が。"}, {"question": "徒然草「つれづれなるままに、日暮らし、硯にむかひて」の「日暮らし」の品詞として正しいものはどれか。", "choices": ["名詞(副詞的に用いられている)", "動詞", "形容詞", "助動詞"], "correctIndex": 0, "explanation": "「日暮らし」は本来「一日中」の意の名詞だが、ここでは連用修飾語として副詞的に機能している。体言が副詞的に用いられる例である。", "modernTranslation": "することもなく所在ないのにまかせて、一日中、硯に向かって。"}, {"question": "「翁ら」のように人代名詞・名詞に付いて用いられる「ら」の文法的働きは何か。", "choices": ["尊敬の意を添える接尾語", "複数(または漠然とした集団)を表す接尾語", "代名詞そのもの", "格助詞"], "correctIndex": 1, "explanation": "「ら」は人代名詞や名詞に付いて複数や漠然とした集団を表す接尾語であり、代名詞そのものではない。", "modernTranslation": ""}, {"question": "更級日記の作者が自分自身を指すときに用いる語として適切なものはどれか。", "choices": ["なんぢ", "かれ", "みづから・わが身", "いづれ"], "correctIndex": 2, "explanation": "「みづから」「わが身」は自分自身を指す表現で自称にあたる。「なんぢ」は対称、「かれ」は他称、「いづれ」は不定称の語である。", "modernTranslation": ""}, {"question": "「おのれ」という代名詞の説明として最も適切なものはどれか。", "choices": ["常に自称としてのみ用いられる", "常に対称としてのみ用いられる", "文脈により自称にも対称にもなりうる", "指示代名詞専用の語である"], "correctIndex": 2, "explanation": "「おのれ」は本来「自分自身」を指す再帰的な語で、文脈により自称(われ)・対称(相手を卑しめて呼ぶ)の両方の用法がある紛らわしい代名詞である。", "modernTranslation": ""}, {"question": "「わらは」が指す人代名詞の
