ぬるを見て」の「ぬる」の識別として正しいものはどれか。", "choices": ["打消の助動詞「ず」の連体形", "完了の助動詞「ぬ」の連体形", "ナ変動詞の活用語尾", "断定の助動詞の一部"], "correctIndex": 1, "explanation": "「散り」という連用形に接続しており、完了の助動詞「ぬ」の連体形である。打消の「ぬ」は未然形接続である点で区別する。", "modernTranslation": "花が散ってしまったのを見て。"}, {"question": "宇治拾遺物語(絵仏師良秀)「衣着ぬ妻子なども、さながら内に在りけり」の「ぬ」の識別として正しいものはどれか。", "choices": ["打消の助動詞「ず」の連体形", "完了の助動詞「ぬ」の終止形", "完了の助動詞「ぬ」の連体形", "ナ変動詞の一部"], "correctIndex": 0, "explanation": "未然形「着」に接続しており、打消の助動詞「ず」の連体形「ぬ」である。「衣を着ていない妻子」の意で、体言「妻子」を修飾する連体形の用法。", "modernTranslation": "着物も着ていない妻子なども、そのまま(家の)中にいた。"}, {"question": "徒然草(仁和寺にある法師)「年ごろ思ひつること、果たしはべりぬ」の文末の「ぬ」の識別として正しいものはどれか。", "choices": ["打消の助動詞「ず」の連体形(結びの用法)", "完了の助動詞「ぬ」の終止形", "打消の助動詞「ず」の已然形", "ナ変動詞の語尾"], "correctIndex": 1, "explanation": "連用形「はべり」に接続し文末で終止形として用いられており、完了の助動詞「ぬ」の終止形である。打消「ず」の連体形「ぬ」と混同しないよう、直前の活用形(未然形か連用形か)で判別する。", "modernTranslation": "長年思っていたことを、成し遂げました。"}, {"question": "「ぬ」の識別方法として最も重要な着眼点はどれか。", "choices": ["直前の語が体言か用言かのみで判断する", "直前の語の活用形が未然形か連用形かによって、打消(未然形接続)か完了(連用形接続)かを判断する", "文末にあるかどうかだけで判断する", "敬語動詞の有無で判断する"], "correctIndex": 1, "explanation": "「ぬ」の識別は接続(直前が未然形か連用形か)を確認するのが最も確実な方法である。", "modernTranslation": ""}, {"question": "平家物語(敦盛の最期)「熊谷、扇をあげて招きければ、招かれて取つて返す」の「招かれて」の「れ」の識別として正しいものはどれか。", "choices": ["受身の助動詞「る」の連用形", "尊敬の助動詞「る」の連用形", "存続の助動詞「り」の一部", "動詞の活用語尾"], "correctIndex": 0, "explanation": "「招く」という四段動詞の未然形に接続し、「(熊谷に)招かれて」と、敦盛が熊谷から動作を受ける受身の意を表す助動詞「る」の連用形である。", "modernTranslation": "熊谷が扇をあげて招いたところ、(敦盛は)招かれて引き返す。"}, {"question": "平家物語(祇園精舎)「おごれる人も久しからず」の「おごれる」の「る」の識別として正しいものはどれか。", "choices": ["過去の助動詞「けり」の連体形", "存続の助動詞「り」の連体形", "受身の助動詞「る」の連体形", "動詞の活用語尾"], "correctIndex": 1, "explanation": "「おごれ」は四段動詞「おごる」の已然形であり、それに接続する「る」は存続・完了の助動詞「り」の連体形である。已然形(エ段)接続が「り」の目印である。", "modernTranslation": "おごり高ぶった人も長くは続かない。"}, {"question": "「あこがれ出でて、この世をも見捨てらるる心地す」の「らるる」の識別として正しいものはどれか。", "choices": ["自発の助動詞「らる」の連体形", "完了の助動詞の一部", "尊敬の助動詞の一部で意味は自発ではない", "動詞の活用語尾"], "correctIndex": 0, "explanation": "「見捨て」(下二段動詞未然形)に接続し、「自然と~してしまう」という自発の意を表す助動詞「らる」の連体形である。", "modernTranslation": "心がさまよい出て、この世をも自然と見捨ててしまうような気持ちがする。"}, {"question": "「花散る里」の「散る」の「る」の識別として正しいものはどれか。", "choices": ["受身の助動詞「る」", "存続の助動詞「り」", "ラ行四段動詞「散る」の活用語尾の一部(助動詞ではない)", "完了の助動詞"], "correctIndex": 2, "explanation": "「散る」はそれ自体でラ行四段活用の動詞であり、「る」は語幹に続く活用語尾の一部であって、独立した助動詞ではない。助動詞の「る」と動詞語尾の「る」を混同しないよう注意する。", "modernTranslation": "花が散る里。"}, {"question": "「明日ありと思ふ心のあだ桜夜半に嵐の吹かぬものかは」に含まれる「ぬ」の識別として最も適切なものはどれか。", "choices": ["打消の助動詞「ず」の連体形(反語の「かは」と呼応)", "完了の助動詞「ぬ」の終止形", "ナ変動詞の一部", "断定の助動詞の一部"], "correctIndex": 0, "explanation": "未然形「吹か」に接続し、係助詞「かは」の反語表現と結びついて連体形「ぬ」で結ばれている。", "modernTranslation": "明日もあると頼りにする桜の花よ、夜中に嵐が吹かないなどということがあろうか(いや、吹くかもしれない)。"}, {"question": "伊勢物語「昔、男ありけり。京にありわびて、あづまに行きけるに」の「行きけるに」の「に」の識別として正しいものはどれか。", "choices": ["格助詞「に」", "完了の助動詞「ぬ」の連用形", "断定の助動詞「なり」の連用形", "接続助詞「に」"], "correctIndex": 3, "explanation": "連体形「ける」に接続し、「~ところ、~ので」といった意味で前後の文をつなぐ接続助詞の用法である。", "modernTranslation": "昔、男がいた。京にいることがつらくなって、東国に行ったところ。"}, {"question": "体言に接続し、下に「あり」を伴う「にあり」の形の「に」の識別として正しいものはどれか。", "choices": ["格助詞", "断定の助動詞「なり」の連用形", "完了の助動詞「ぬ」の連用形", "接続助詞"], "correctIndex": 1, "explanation": "体言に接続し、下に「あり」を伴う「にあり」の形は断定の助動詞「なり」の連用形「に」+ラ変動詞「あり」の典型的なパターンである。", "modernTranslation": ""}, {"question": "徒然草(仁和寺にある法師)「極楽寺・高良などを拝みて、かばかりと心得て帰りにけり」の「に」の識別として正しいものはどれか。", "choices": ["格助詞", "断定の助動詞「なり」の連用形", "完了の助動詞「ぬ」の連用形", "接続助詞"], "correctIndex": 2, "explanation": "連用形「帰り」に接続し、下に「けり」を伴う「にけり」の形は完了の助動詞「ぬ」の連用形の典型パターンである。", "modernTranslation": "極楽寺・高良などを拝んで、これだけのものと思い込んで帰ってしまった。"}, {"question": "徒然草「仁和寺にある法師、年寄るまで石清水を拝まざりければ」の「仁和寺にある」の「に」の識別として正しいものはどれか。", "choices": ["格助詞(場所・方向を示す)", "断定の助動詞の連用形", "完了の助動詞の連用形", "接続助詞"], "correctIndex": 0, "explanation": "体言「仁和寺」に直接付いて存在する場所を表しており、格助詞の用法である。「ある」は存在を表す動詞そのものであり、断定の助動詞「なり」の連用形「に」+「あり」(である)の構造とは異なる点に注意する。", "modernTranslation": "仁和寺にいた法師が、年をとるまで石清水八幡宮を参拝したことがなかったので。"}, {"question": "「げに、をかしきことなり」の「げに」の「に」の識別として正しいものはどれか。", "choices": ["格助詞", "断定の助動詞の連用形", "完了の助動詞の連用形", "副詞「げに」の一部であり助詞・助動詞ではない"], "correctIndex": 3, "explanation": "「げに」は一語の副詞(「本当に、いかにも」の意)であり、「に」を助詞・助動詞として分解することはできない。「に」の識別問題では、まず一語の副詞・動詞の一部でないかを確認する必要がある。", "modernTranslation": "本当に、趣のあることである。"}, {"question": "「に」の識別で最も基本となる手順として正しいものはどれか。", "choices": ["まず一語の副詞・動詞の一部でないか確認し、次に接続(体言か連用形か連体形か)と下に続く語(あり・けり等)を確認して格助詞・断定・完了・接続助詞・ナ変語尾を判別する", "常に断定の助動詞として訳せばよい", "「に」は常に格助詞である", "文末にあるかどうかだけで判断する"], "correctIndex": 0, "explanation": "「に」の識別は複数の可能性があるため、まず一語化した副詞等でないかを確かめ、そのうえで接続や下接語を手がかりに判別するのが確実な方法である。", "modernTranslation": ""}, {"question": "平家物語(祇園精舎)「清盛公と申しし人のありさま、伝へ承るこそ、心も詞も及ばれね」の「及ばれね」の「ね」の識別として正しいものはどれか。", "choices": ["打消の助動詞「ず」の已然形", "完了の助動詞「ぬ」の命令形", "願望の終助詞", "動詞の活用語尾"], "correctIndex": 0, "explanation": "未然形「及ばれ」に接続し、係助詞「こそ」の結び(已然形)として文末に用いられている、打消の助動詞「ず」の已然形「ね」である。", "modernTranslation": "清盛公と申した人の有様を、人から伝え聞くにつけても、心にも言葉にも表現し尽くすことができない。"}, {"question": "「はや帰りね」の「ね」の識別として正しいものはどれか。", "choices": ["打消の助動詞「ず」の已然形", "完了の助動詞「ぬ」の命令形", "願望の終助詞", "ナ変動詞の一部"], "correctIndex": 1, "explanation": "連用形「帰り」に接続しており、命令の意を添える完了の助動詞「ぬ」の命令形「ね」である。「早く帰ってしまえ」という強い命令を表す。", "modernTranslation": "早く帰ってしまいなさい。"}, {"question": "「ね」の識別で押さえるべき接続の違いとして正しいものはどれか。", "choices": ["未然形に接続すれば打消の助動詞「ず」の已然形、連用形に接続すれば完了の助動詞「ぬ」の命令形である", "未然形に接続すれば完了、連用形に接続すれば打消である", "常に打消の意味になる", "常に命令の意味になる"], "correctIndex": 0, "explanation": "「ね」の識別も「ぬ」と同様、直前が未然形か連用形かによって打消(已然形)か完了(命令形)かを判別する。", "modernTranslation": ""}, {"question": "紛らわしい語(なり・なむ・ぬ・る・に・ねなど)を識別する際に、最も基本かつ共通する重要な手がかりは何か。", "choices": ["語の見た目の音だけで判断する", "直前の語の活用形(未然形・連用形・終止形・連体形・已然形のいずれか)と、下に続く語を確認すること", "現代語の意味に引きずられて判断すること", "文の長さで判断すること"], "correctIndex": 1, "explanation": "助動詞の識別は接続(上に来る活用形)と、下接する語を確認することが最も基本的かつ確実な方法であり、これは「なり」「なむ」「ぬ」「る」「に」「ね」のいずれの識別にも共通する原則である。", "modernTranslation": ""}]};
  // __STUDY_GUIDES_PLACEHOLDER__
  var STUDY_GUIDES = {"kana": "## この単元の要点\n歴史的仮名遣いとは、平安時代語の発音にもとづいて定着した仮名の表記法で、古典作品の原文はこの表記で書かれている。現代仮名遣いとの間には規則的なズレがあり、代表的なものが「ハ行転呼音」である。語の最初(語頭)以外に現れるハ行音「はひふへほ」は、平安時代にはすでにワ行音に近く発音されており、現代仮名遣いでもワ行音「わいうえお」に直して書く。また、ワ行の「ゐ・ゑ・を」はそれぞれ「い・え・お」に、「ぢ・づ」は原則として「じ・ず」に、合拗音「くわ・ぐわ」は「か・が」に直す。さらに、母音が連続する語では長音化が起こり、「au」はオ段長音、「iu」はユ段長音、「eu」はオ段の拗長音に変化する。ただし助詞の「は・へ・を」は例外として現代仮名遣いでもそのまま表記する。\n\n## 具体例\n- 「思ふ」→「思う」(語中のハ行音「ふ」→「う」)\n- 「あはれ」→「あわれ」(語中のハ行音「は」→「わ」)\n- 「ゐる」→「いる」、「こゑ」→「こえ」\n- 「けふ(今日)」→「きょう」(母音連続eu→オ段長音)\n- 「やうやう」→「ようよう」(母音連続au→オ段長音)\n- 「よろづ」→「よろず」\n\n## 識別・見分け方のポイント\nまず語のどこにハ行音があるかを確認し、語頭なら変化なし、語中・語尾ならワ行音に直す。次にワ行の仮名「ゐ・ゑ・を」やダ行の濁音「ぢ・づ」がないかを確認する。最後に、母音が連続する箇所がないかを探し、長音化のパターン(au→ō、iu→yū、eu→yō)にあてはめる。助詞の「は・へ・を」は変化させない例外である点を必ず覚えておく。\n\n## よくある間違い・注意点\n語頭のハ行音まで「わ・い・う・え・お」に直してしまう誤りが多い。「花」を「あな」のように変えてはいけない。また、動詞「おはす」の「は」のように、助詞ではなく語中のハ行音である場合はきちんとワ行音に直す必要があり、助詞の例外規定と混同しないよう注意する。長音化の変化(au・iu・euの区別)も間違えやすいので、代表的な語を覚えておくとよい。", "tango-tan-i": "## この単元の要点\n言葉は大きい単位から「文章(段落)→文→文節→単語」という階層をなしている。文章はいくつかの文のまとまりであり、文は「。」で終わる一続きの内容である。文節は、文を発音上不自然にならない程度にできるだけ短く区切った単位で、間に「ネ」や「サ」を入れて確かめることができる。単語は文法上それ以上分けられない最小の単位で、自立語と付属語からなる。文節どうしの関係には、主語・述語の関係、修飾・被修飾の関係、並立の関係、補助の関係、接続の関係、独立の関係があり、二つ以上の文節がまとまって一つの文節と同じ働きをするものを連文節という。\n\n## 具体例\n「花ぞ咲きにける」は文節では「花ぞ/咲きにける」の二文節、単語では「花/ぞ/咲き/に/ける」の五単語に分かれる。「久方の光のどけき春の日に」は「久方の/光のどけき/春の/日に」の四文節に分かれる。「あはれ、いみじきわざかな」の「あはれ」は他の文節と直接結びつかない独立の関係にある。\n\n## 識別・見分け方のポイント\n文節の区切りは「ネ」「サ」を挟んで発音の切れ目を確かめるのが基本である。単語まで分ける場合は、自立語(名詞・動詞など)と付属語(助詞・助動詞)の境目を意識し、一つの自立語に対して付属語がいくつ付いているかを数える。文節相互の関係を判断する際は、まず「何が」「どうする」を探して主語・述語を確定し、次に他の文節が何を詳しく説明しているかを見て修飾・被修飾の関係を判断するとよい。\n\n## よくある間違い・注意点\n文節を単語と同じ細かさまで分けてしまう誤りが多い。文節はあくまで発音上のまとまりであり、自立語+付属語をひとまとまりとして扱う点に注意する。また、連文節全体で主語や修飾語の働きをしている場合、その一部分だけを取り出して文節相互の関係を答えてしまう誤りにも気をつけたい。", "hinshi": "## この単元の要点\n単語はまず「自立語」と「付属語」に大別される。自立語は単独で文節を作ることができる語で、付属語は単独では文節を作れず、常に自立語に付いて用いられる語である。学校文法(橋本文法)では、自立語を活用の有無と文中の働きによって、動詞・形容詞・形容動詞(活用する自立語=用言)、名詞(活用しない自立語=体言)、副詞・連体詞・接続詞・感動詞(活用しない自立語)に分け、付属語を助動詞(活用する)と助詞(活用しない)に分ける。これで合計10品詞となる。用言は単独で述語になることができ、体言は単独で主語になることができる点も重要である。\n\n## 具体例\n「咲く」は動詞、「美し」は形容詞、「あはれなり」は形容動詞で、いずれも活用する自立語(用言)である。「花」「山」「都」は活用しない自立語(体言)である。「いと」は用言を修飾する副詞、「あらゆる」は体言を修飾する連体詞、「されど」は接続詞、「あはれ」は感動詞である。「けり」「らむ」「べし」などは活用する付属語(助動詞)、「ぞ」「こそ」「て」「ば」などは活用しない付属語(助詞)である。\n\n## 識別・見分け方のポイント\nまずその語が単独で文節を作れるか(自立語か付属語か)を確認する。次に活用するかどうかを調べる。活用する自立語なら用言(動詞・形容詞・形容動詞のどれか)、活用しない自立語なら体言か副詞・連体詞・接続詞・感動詞のいずれかを、文中の働き(何を修飾するか、独立しているかなど)から判断する。付属語であれば、活用の有無で助動詞と助詞を区別する。\n\n## よくある間違い・注意点\n形容動詞を形容詞と混同したり、副詞と連体詞の区別(用言を修飾するか体言を修飾するか)を誤ったりすることが多い。また、助動詞は活用するが助詞は活用しないという基本の違いを忘れ、係助詞「ぞ・なむ・こそ」などを助動詞と誤認する例もあるので注意したい。", "katsuyo-kiso": "## この単元の要点\n活用とは、用言(動詞・形容詞・形容動詞)や助動詞が、文中での働きに応じて語形を変化させることをいう。活用する語は、変化しない部分である「語幹」と、変化する部分である「活用語尾」からなる。文語文法(古典文法)では活用形を未然形・連用形・終止形・連体形・已然形・命令形の6種類に分ける。未然形はまだ実現していないことを表し打消「ず」や推量「む」に続き、連用形は用言や「けり」「たり」「て」などに続き、終止形は言い切りの形、連体形は体言に連なる形、已然形はすでにそうなっていることを表し「ば」「ど・ども」に続き、命令形は命令を表して言い切る。係助詞「ぞ・なむ・や・か」は文末を連体形で結び、「こそ」は已然形で結ぶ(係り結びの法則)。\n\n## 具体例\n四段活用動詞「咲く」は、未然形「咲か」・連用形「咲き」・終止形「咲く」・連体形「咲く」・已然形「咲け」・命令形「咲け」と活用する。「花咲かば」は未然形+「ば」で仮定条件、「花咲けば」は已然形+「ば」で確定条件を表す。「花ぞ咲きける」は係助詞「ぞ」があるため文末が連体形「ける」となり、「花こそ咲きけれ」は「こそ」により已然形「けれ」で結ばれる。\n\n## 識別・見分け方のポイント\n活用形を見分ける最も確実な方法は、その語の直後にどのような語が続いているか(接続)を確認することである。「ず・む」に続けば未然形、「けり・たり・て」に続けば連用形、句点で言い切っていれば終止形、体言に続けば連体形、「ば・ど・ども」に続けば已然形の可能性が高い。文中に係助詞があれば、文末の活用形が連体形・已然形のどちらで結ばれるかも合わせて確認する。\n\n## よくある間違い・注意点\n四段活用のように終止形と連体形が同じ形になる活用の種類では、接続だけでは見た目が区別できないことがあるため、後に続く語や文脈から判断する必要がある。また、已然形を「仮定形」と混同したり、命令形と已然形を取り違えたりする誤りが多いので、それぞれの用法(已然形は確定条件、命令形は命令の言い切り)を正確に覚えておくことが大切である。", "doushi-yodan-nidan": "## この単元の要点\n文語の動詞は、活用語尾がどの段(ア・イ・ウ・エ・オ)にわたるかによって種類が分かれる。四段活用は未然形(ア段)・連用形(イ段)・終止形(ウ段)・連体形(ウ段)・已然形(エ段)・命令形(エ段)と、ア段からエ段までの四つの段を用いて活用する。一方、上二段活用はイ段とウ段の二つの段、下二段活用はエ段とウ段の二つの段だけを用いて活用するため「二段活用」と呼ばれる。上二段は未然形・連用形がイ段、終止形・連体形・已然形はウ段(連体形は+る、已然形は+れ)、命令形はイ段+よ。下二段は未然形・連用形がエ段、それ以降はウ段(同様に+る・+れ)、命令形はエ段+よとなる。\n\n## 具体例\n・四段「書く」書か・書き・書く・書く・書け・書け\n・上二段「起く」起き・起き・起く・起くる・起くれ・起きよ\n・下二段「受く」受け・受け・受く・受くる・受くれ・受けよ\n「翁、夜更けて目を覚まし、褥より起きて外を見る」のような文では、「起きて」の「起き」が上二段活用の連用形にあたる。\n\n## 識別・見分け方のポイント\n未然形に「ず」を付けて、その直前の音がどの段になるかを確認するのが基本。ア段になれば四段、イ段になれば上二段、エ段になれば下二段。終止形はいずれもウ段になるため、終止形だけでは判別できない点に注意する。\n\n## よくある間違い・注意点\n見分けるときに終止形だけを見てしまい、区別がつかなくなるという誤りが多い。終止形は四段・上二段・下二段のいずれもウ段になり見分けがつかないため、必ず未然形に「ず」を付けて確認する習慣をつけること。また、上二段・下二段は現代語ではそれぞれ上一段・下一段に変化しているため、現代語の感覚(例:起きる、受ける)に引きずられて活用語尾を「イ段のみ」「エ段のみ」と誤解しないよう注意する。已然形と命令形がどちらもエ段+れ・エ段+よの同じ形になる二段活用の特徴も、四段活用の已然形(エ段のみ)・命令形(エ段のみ)と比べて整理しておくとよい。教科書や問題集で活用表を書くときは、まず未然形の一音を確定し、そこから段の並びを機械的に導き出す練習を繰り返すことが定着への近道である。", "doushi-ichidan": "## この単元の要点\n上一段活用は、活用語尾がすべてイ段の音のまま変化しない活用である(未然形・連用形はイ段のみ、終止形・連体形はイ段+る、已然形はイ段+れ、命令形はイ段+よ)。属する動詞は「見る」「着る」「似る」「干る」「居る」「率る」「射る」「鋳る」など数語程度と極めて少なく、語幹と語尾の区別がつきにくい語が多いため、個別に暗記する必要がある。伝統的な語呂合わせ「ひいきにみゐる」(干る・射る〈鋳る〉・着る・似る・見る・居る〈率る〉)を使うと覚えやすい。下一段活用は、活用語尾がすべてエ段のまま変化しない活用で、文語ではただ一語「蹴る」のみがこれに属する(蹴・蹴・ける・ける・けれ・けよ)。\n\n## 具体例\n・上一段「見る」み・み・みる・みる・みれ・みよ\n・下一段「蹴る」け・け・ける・ける・けれ・けよ\n「鏡を見れば、我が姿の変はれるを知る」の「見れ」は上一段活用の已然形である。\n\n## 識別・見分け方のポイント\n未然形+「ず」でイ段になる語のうち、上一段活用の暗記語(ひいきにみゐる等)に当てはまればその動詞は上一段活用、当てはまらなければ上二段活用と判断する。同様にエ段になる語のうち「蹴る」であれば下一段活用、それ以外はすべて下二段活用である。上一段・下一段は「一つの段だけ」で活用が完結する点が、二つの段にわたる上二段・下二段との決定的な違いである。\n\n## よくある間違い・注意点\n上一段活用の動詞は語数が少ないため、逆に見落として上二段活用と誤認しやすい。「ひいきにみゐる」などの語呂合わせを確実に覚えておくこと。また、下一段活用は「蹴る」一語のみという点を忘れ、他のエ段の動詞まで下一段だと誤解しないように注意する。なお、現代語の命令形「見ろ」「蹴ろ」は口語の形であり、文語の命令形は「見よ」「蹴よ」のように「よ」を伴う点も混同しやすい。さらに、上一段活用の動詞には「顧みる」「試みる」のように、上一段動詞に接頭語や別の語が付いてできた複合動詞も多く存在する。これらも語幹部分にとらわれず、末尾が「見る」型の活用をすることを確認すれば同じように上一段活用と判断できる。活用表を覚える際は、必ず語頭から順に音を並べて書き出し、他の活用の種類と混同しないように整理しておくことが大切である。", "doushi-henkaku": "## この単元の要点\n変格活用とは、四段・上一段・上二段・下一段・下二段という規則的な活用のパターンに当てはまらない、少数の特殊な動詞のグループである。カ行変格活用(カ変)は「来」一語(複合語を含む)のみで、こ・き・く・くる・くれ・こと活用する。サ行変格活用(サ変)は「す」「おはす」、および漢語に「す」が付いた複合動詞(学問す、対面す等)で、せ・し・す・する・すれ・せよと活用する。ナ行変格活用(ナ変)は「死ぬ」「往ぬ(去ぬ)」の二語のみで、な・に・ぬ・ぬる・ぬれ・ねと活用する。ラ行変格活用(ラ変)は「あり」「をり」「はべり」「いまそかり」の四語で、ら・り・り・る・れ・れと活用する。ラ変は終止形が本来のウ段ではなくイ段の「り」になる点が最大の特徴である。\n\n## 具体例\n「今は昔、竹取の翁といふ者ありけり」の「あり」はラ変の連用形。「秋も来ぬる心地こそすれ」の「来」はカ変の連用形に完了「ぬ」の連体形が付いた形。\n\n## 識別・見分け方のポイント\n変格活用は語数がきわめて限られているため、未然形+「ず」による判別法よりも、該当する語(来・す・死ぬ/往ぬ・あり/をり/はべり/いまそかり)そのものを個別に暗記しておくのが確実である。特にラ変は終止形が「り」というイ段になる点で他のすべての活用と異なるため、意識して覚えておく。\n\n## よくある間違い・注意点\nナ変の終止形「ぬ」は打消の助動詞「ず」の連体形「ぬ」と形が同じため混同しやすい。直前の語の接続や文脈で判別すること。またラ変の連用形「り」を、完了・存続の助動詞「り」と混同しないよう注意する。サ変は「す」だけでなく漢語+「す」の複合動詞が非常に多いため、見慣れない語でも「〜す」で終わればサ変を疑うとよい。カ変の「来」は「く・こ・き」のように読みが一定せず漢字だけでは活用形が判断しにくいので、送り仮名や前後の語との接続関係から読みを特定する練習をしておくこと。変格活用は種類ごとの語数が少ない分、一つ一つの活用表を正確に暗唱できるようにしておくことが、他の識別問題を解く上での土台にもなる。", "doushi-sougou": "## この単元の要点\n文語の動詞の活用は、四段・上一段・上二段・下一段・下二段・カ行変格・サ行変格・ナ行変格・ラ行変格の九種類に分類される。これらを横断して見分ける基本手順は、まず変格活用に属する語(来・す・死ぬ/往ぬ・あり/をり/はべり/いまそかり、および「す」を含む複合動詞)かどうかを確認し、当てはまらなければ未然形に「ず」を付けてその直前の音の段を確認する。ア段なら四段、イ段なら上一段(暗記語のみ)か上二段、エ段なら下一段(「蹴る」のみ)か下二段と判断する。\n\n## 具体例\n「書く」は四段、「見る」は上一段、「起く」は上二段、「蹴る」は下一段、「受く」は下二段、「来」はカ変、「す」はサ変、「死ぬ」はナ変、「あり」はラ変というように、それぞれ異なる活用の型を持つ。\n\n## 識別・見分け方のポイント\n判別の優先順位は「(1)変格活用の暗記語に当てはまるか→(2)未然形+ずの段を確認→(3)イ段・エ段の場合は上一段・下一段の暗記語に当てはまるかを確認」という順番で進めると迷いが少ない。終止形はいずれもウ段(ラ変のみ例外的にイ段)になるため、終止形だけでは判別できない。\n\n## よくある間違い・注意点\n一つの判別法(例えば未然形+ず)だけに頼り、変格活用や上一段・下一段の暗記語を確認し忘れるミスが多い。特にラ変は未然形が「ら」とア段になるため四段活用と混同しやすいが、終止形が「り」というイ段になる点で見分けられる。九種類すべてを一度に覚えようとせず、まず変格活用と一段活用の少数語を確実に覚え、それ以外を四段・上二段・下二段のいずれかとして判断する練習を重ねるとよい。総合問題では一文の中に複数の活用の種類が混在することが多いので、一語ずつ丁寧に未然形を確認し、思い込みで判断しない姿勢が高得点につながる。演習を重ねるうちに、代表的な語(書く・見る・起く・蹴る・受く・来・す・死ぬ・あり)を見た瞬間に活用の種類が浮かぶようになることを目標にするとよい。", "doushi-onbin": "## この単元の要点\n音便とは、発音の便宜(言いやすさ)のために本来の音が変化する現象で、活用語の連用形に「て」「たり」などが続くときに多く起こる。動詞の音便には、(1)イ音便(き・ぎ→い、例:書きて→書いて)、(2)ウ音便(く・ひ・び→う、例:給ひて→給うて)、(3)撥音便(り・に・び→ん、例:死にて→死んで)、(4)促音便(ち・り・き→っ、例:取りて→取って)の四種類がある。撥音便の後の「て」は「で」と濁音化することが多い。また、補助動詞とは「あり」「はべり」「給ふ」のように、本来の実質的な意味が薄れ、上の語に丁寧・尊敬などの意味を添える動詞のことをいう。自動詞と他動詞は、動作の対象を表す「〜を」を伴うかどうかで見分ける。\n\n## 具体例\n「泳ぎて」→イ音便「泳いで」、「思ひて」→ウ音便「思うて」、「呼びて」→撥音便「呼んで」、「立ちて」→促音便「立って」。「書きてはべり」の「はべり」は丁寧の意を添える補助動詞である。\n\n## 識別・見分け方のポイント\n音便形に出会ったら、まず元の形(基本形)に戻して考えると文法的な分析がしやすい。補助動詞かどうかは、その動詞が実質的な意味(存在する、いる等)を保っているか、意味が薄れて上の語に意味を添えるだけになっているかで判断する。自動詞・他動詞は「〜を」の有無を手がかりにする。\n\n## よくある間違い・注意点\n音便が起こっても品詞や活用形自体は変わらないという点を見落とし、別の語だと誤解してしまうことが多い。撥音便で「ん」が表記上省略される(無表記になる)場合もあるため注意が必要である。また、補助動詞は本動詞と形が同じであるため、文脈の中で実質的な意味を持つかどうかを丁寧に確認することが大切である。自動詞・他動詞についても、現代語の感覚だけで判断せず、必ず本文中に「〜を」が現れているかどうかを確かめる習慣をつけたい。音便・補助動詞・自他の区別はいずれも読解の中で総合的に問われることが多いため、単独の知識としてではなく、文脈と結びつけて理解しておくことが実戦的な力につながる。", "keiyoushi": "## この単元の要点\n文語の形容詞は、活用の型によってク活用とシク活用の二種類に分けられる。いずれも終止形は「〜し」で終わるが、連用形にしたときの形が異なる。ク活用は連用形が「〜く」(例:高し→高く)、シク活用は連用形が「〜しく」(例:美し→美しく)となる。それぞれ本活用のほかに、下に助動詞が続くときに用いる補助活用(カリ活用)を持ち、未然形「〜から/〜しから」、連用形「〜かり/〜しかり」、連体形「〜かる/〜しかる」、命令形「〜かれ/〜しかれ」という、ラ変に似た活用をする。已然形は本活用の「〜けれ/〜しけれ」が用いられる。\n\n## 具体例\nク活用「高し」高く・高く・高し・高き・高けれ、シク活用「美し」美しく・美しく・美し・美しき・美しけれ。「白き鳥」の「白き」は連体形、「別れの悲しければ」の「悲しけれ」は已然形である。\n\n## 識別・見分け方のポイント\n終止形だけではク活用かシク活用か判別できないため、連用形にして「〜く」か「〜しく」かを確認するのが最も確実な方法である。一般的な傾向として、シク活用には喜怒哀楽などの感情・情緒を表す語が多いといわれるが、これはあくまで参考程度にとどめ、連用形での確認を基本とすること。\n\n## よくある間違い・注意点\n補助活用(カリ活用)は下に助動詞が続くときにしか用いられない点を忘れ、文末にカリ活用の終止形を使ってしまうという誤りに注意する(カリ活用に終止形は基本的に存在しない)。また、形容詞の語幹がそのまま感動を表す用法(「あな、うれし」)があることも押さえておきたい。ク活用・シク活用のどちらであっても、活用のパターン(未然・連用・終止・連体・已然・命令)自体は同じ骨組みを持っているので、まず一語(例えば「高し」)の活用を完全に覚え、それを基準にして他の形容詞にも当てはめていくと効率よく学習を進められる。已然形+ばの確定条件の用法は読解でも頻出するので、あわせて確認しておくとよい。", "keiyoudoushi": "## この単元の要点\n文語の形容動詞は、ナリ活用とタリ活用の二種類に分けられる。ナリ活用は終止形が「〜なり」(例:静かなり)、タリ活用は終止形が「〜たり」(例:堂々たり)となる。ナリ活用は断定の助動詞「なり」と、タリ活用は「体言+格助詞と+あり」に由来する語と同じ活用パターンを持ち、未然形「なら/たら」、連用形「に・なり/と・たり」、終止形「なり/たり」、連体形「なる/たる」、已然形「なれ/たれ」、命令形「なれ/たれ」と活用する。已然形と命令形は同じ形になる。\n\n## 具体例\nナリ活用「あはれなり」あはれなら・あはれに(なり)・あはれなり・あはれなる・あはれなれ・あはれなれ。タリ活用「堂々たり」堂々たら・堂々と(たり)・堂々たり・堂々たる・堂々たれ・堂々たれ。「静かなる所」の「静かなる」は連体形、「堂々と陣を構へたり」の「堂々と」は連用形である。\n\n## 識別・見分け方のポイント\n終止形が「〜なり」で終わればナリ活用、「〜たり」で終わればタリ活用とそのまま判別できる。ナリ活用は和語を語幹とし和文(仮名文)に広く使われるのに対し、タリ活用は漢語(特に畳語)を語幹とし、主に漢文訓読調の文章や軍記物語に多く用いられるという使用場面の違いも押さえておくとよい。\n\n## よくある間違い・注意点\n形容詞(ク活用・シク活用、終止形が「〜し」)と形容動詞(ナリ活用・タリ活用、終止形が「〜なり・〜たり」)を混同しないこと。また、連用形に二つの形(に/なり、と/たり)があることを忘れ、一方の形だけで覚えてしまう誤りに注意する。「〜に」「〜と」は下に用言が続くとき、「〜なり」「〜たり」は下に「けり」などの助動詞が続くときに使われることが多い。さらに、断定の助動詞「なり」の連体形「なる」や已然形「なれ」と、形容動詞の活用語尾としての「なる」「なれ」を混同しやすいため、直前が体言(断定の助動詞)か、形容動詞の語幹の一部(形容動詞)かを見極める練習も重要である。", "jodoushi-kiso": "## この単元の要点\n助動詞は、単独では文節を作れない付属語でありながら、活用する点で助詞と区別される。用言や体言、他の助動詞に付いて、様々な意味を添える働きを持つ。助動詞を整理する視点は大きく2つある。1つは意味による分類(受身・尊敬・自発・可能、使役、過去、完了、推量、打消、打消推量、願望、比況、断定、伝聞推定など)、もう1つは接続による分類(その助動詞が直前の語のどの活用形に付くか)である。この2つの視点を組み合わせて覚えることが、以降の単元を学ぶ土台になる。\n\n## 具体例\n「花咲きぬべし。」という文には、完了の助動詞「ぬ」(連用形接続)と推量の助動詞「べし」(終止形接続)が使われている。「男、女に会はれず。」では、受身・可能などを表す「る」(未然形接続)と打消の「ず」(未然形接続)が使われている。このように一文に複数の助動詞が重なることも多く、それぞれの接続と意味を順序立てて確認する必要がある。\n\n## 識別・見分け方のポイント\nまず直前の語の活用形を確認し、未然形・連用形・終止形・連体形・已然形・体言のどれに接続しているかを見極める。次に、その接続のパターンから助動詞の候補を絞り込み、文脈の意味と照らし合わせて特定する。特にラ変型活用語(あり・をり・侍りなど)には、終止形接続の助動詞が例外的に連体形で接続する点に注意する。\n\n## よくある間違い・注意点\n「なり」「たり」のように同じ形でも接続によって意味(断定/伝聞推定、断定/完了)が異なる助動詞があるので、接続を必ず確認する習慣をつける。また、助動詞は必ず未然形に接続すると誤解しがちだが、実際には多様な接続パターンがある。さらに、助動詞は1つの語が複数の意味を兼ねることが多いため、「接続を確認する→候補を絞る→文脈で意味を決める」という手順を毎回丁寧に踏むことが、以降の各単元(自発・可能・受身・尊敬、使役・尊敬、過去・完了、推量、打消、願望・比況)を理解するための基礎体力になる。最初の段階で接続と意味の一覧をあいまいなまま進めると、後の単元でつまずきやすいので注意したい。", "jodoushi-jihatsu": "## この単元の要点\n「る」「らる」は、自発・可能・受身・尊敬という4つの意味を持つ助動詞である。接続は、四段・ナ変・ラ変動詞の未然形(ア段の音)には「る」、それ以外の動詞(上一段・下一段・上二段・下二段・カ変・サ変)の未然形には「らる」が付く。活用は下二段型(れ・れ・る・るる・るれ・れよ)。1つの形が4つの意味を持ちうるため、機械的に決めることができず、文脈から判断する力が求められる。\n\n## 具体例\n「もの思はるる夕暮れ」は、心情動詞「もの思ふ」に付いており、自然と物思いをしてしまうという自発の意味。「弓を引くに、え射られず。」は下に打消「ず」を伴い、「射ることができない」という可能の意味。「人にあざけられたまふ。」は「人に」という動作主が示され受身。「中納言、常に思し出でらる。」は主語が高貴な人物で、「お思い出しになる」という尊敬の意味になる。\n\n## 識別・見分け方のポイント\n自発は心情・知覚を表す動詞(思ふ・偲ぶ・泣くなど)に付きやすい。可能は下に打消を伴うことが多い。受身は「〜に」で動作主が示されることが多い。尊敬は主語が高貴な人物で、「たまふ」など他の尊敬語と重ねて用いられることも多い。この4点を手がかりに、主語・動作主・下に続く語を順に確認するとよい。\n\n## よくある間違い・注意点\n尊敬の「る・らる」を単独で使う場合は比較的軽い敬意にとどまるため、最高敬語(二重尊敬)と混同しないこと。また、可能の用法は肯定形でも稀に使われるため、打消がないからといって即座に可能を除外しないよう注意する。さらに、同じ「る・らる」でも文脈が変われば意味も変わるため、1つの文だけで機械的に暗記するのではなく、複数の例文にあたって「主語は誰か」「動作主は示されているか」「打消を伴うか」を確認する練習を重ねることが、識別力を高める近道である。特に入試問題では、あえて紛らわしい文脈が選ばれることが多い点にも留意したい。", "jodoushi-shieki": "## この単元の要点\n「す」「さす」「しむ」は使役と尊敬の意味を持つ助動詞である。接続は、四段・ナ変・ラ変動詞の未然形には「す」、それ以外の動詞の未然形には「さす」、動詞の種類を問わずすべての未然形に付くのが「しむ」で、主に漢文訓読調の文章に用いられる。活用は「る・らる」と同じ下二段型である。\n\n## 具体例\n「乳母、幼き君に薬を飲ませけり。」は「幼き君に」という使役の対象が明示されており使役。「帝、笛を吹かせたまふ。」は主語が帝で、「たまふ」という尊敬語と重なっており、二重尊敬(最高敬語)と解釈するのが自然である。「命じて弓を引かせしむ。」のように「しむ」は漢文訓読調の文章に多く見られる。\n\n## 識別・見分け方のポイント\n使役か尊敬かは、まず「〜させる対象」が文中に明示されているかを確認する。対象が明示されていれば使役の可能性が高い。次に、下に「たまふ」「おはします」などの尊敬の補助動詞が続く場合は、二重尊敬(最高敬語)として天皇・皇后など最高位の人物に用いられていないかを確認する。二重尊敬は特に地の文で主語の身分が非常に高い場合に使われる。\n\n## よくある間違い・注意点\n「す・さす・しむ」を単独で尊敬として使う場合は軽い敬意にとどまり、二重尊敬とは区別される。また、「せ」「させ」は未然形と連用形が同形になるため、下に続く語(打消の「ず」なら未然形、過去の「き」なら連用形など)で活用形を判断する必要がある。加えて、使役と尊敬は一見似た形で現れるため、主語が誰か、使役の対象が明示されているか、下に尊敬語が続くかという3点を必ずセットで確認する習慣をつけるとよい。特に「せたまふ」「させたまふ」の形は、使役なのか二重尊敬なのか文脈判断が必要になる頻出のポイントである。なお「しむ」は動詞の活用の種類を問わず未然形に接続する点で「す・さす」と区別され、和文よりも漢文訓読調の文章や歴史物語・軍記物語で目にする機会が多いことも覚えておくとよい。", "jodoushi-kako": "## この単元の要点\n過去を表す助動詞には「き」と「けり」があり、完了(強意)を表す助動詞には「つ」「ぬ」「たり」「り」がある。「き」は連用形接続で特殊な活用(せ・○・き・し・しか・○)を持ち、自分が直接体験した過去を表す。「けり」はラ変型活用で連用形接続、伝聞による過去、または詠嘆(気づき)を表す。「つ」は下二段型、「ぬ」はナ変型でともに連用形接続、完了のほか下に推量を伴うと強意(確述)になる。「たり」(完了)は連用形接続、「り」はサ変動詞の未然形・四段動詞の已然形に接続する特殊な接続を持ち、ともに完了・存続を表す。\n\n## 具体例\n「今は昔、竹取の翁といふ者ありけり。」は物語の語り出しに典型的な伝聞過去の「けり」。「あはれ、をかしかりけり。」は感動語とともに使われ、詠嘆の「けり」。「われ、その事を見き。」は一人称が自ら体験した過去を述べる「き」の典型例。「花散りぬべし。」の「ぬ」は下に「べし」を伴い、「きっと散るだろう」という強意になる。「山の頂に着きたり。」「花は咲けり。」はそれぞれ完了・存続を表す。\n\n## 識別・見分け方のポイント\n「き」と「けり」は、体験した本人が語っているか(き)、伝え聞いた話や気づきを語っているか(けり)で見分ける。「つ・ぬ」は下に推量の助動詞を伴うかどうかで、完了か強意かを判断する。「り」の接続は「サ未四已」と語呂で覚えると整理しやすい。\n\n## よくある間違い・注意点\n接続助詞「て」と完了の助動詞「つ」の連用形は形が似ているが別の語なので、活用の有無で区別する。また、完了の「たり」と断定の「たり」は同じ形でも接続(連用形/体言)が異なるため要注意である。「き」の已然形「しか」は係助詞「こそ」を受けた係り結びでよく現れるので、「こそ〜しか。」の形を見たら過去の助動詞の已然形であると即座に判断できるようにしておきたい。過去・完了の助動詞は種類が多いため、まず接続で候補を絞り、次に文脈で細かい意味を確定するという二段階の手順を徹底することが得点力につながる。", "jodoushi-suiryo": "## この単元の要点\n推量系の助動詞は数が多く、接続と意味の対応を整理することが重要である。「む」「むず」は未然形接続で、推量・意志・勧誘・仮定・婉曲など多様な意味を持ち、主語の人称(一人称→意志、二人称→勧誘・適当、三人称→推量)や連体形の用法(仮定・婉曲)で判断する。「らむ」は終止形接続(ラ変型は連体形)で現在推量、「けむ」は連用形接続で過去推量を表す。「らし」は終止形接続で根拠のある推量、「めり」は終止形接続で視覚的推定、「なり」は終止形接続で聴覚的な伝聞推定を表す(体言・連体形接続の断定の「なり」と混同しないこと)。「まし」は未然形接続で、事実に反する仮定を述べる反実仮想を代表的な意味とする。\n\n## 具体例\n「今頃、都では花が盛りならむ。」は現在推量の「らむ」。「昔、いかなる人か、かかる歌をよみけむ。」は過去推量の「けむ」。「鳥の声すなり。」は聴覚に基づく伝聞推定の「なり」。「命あらば、また会はましものを。」は反実仮想の「まし」で、実際には会えていないことを示唆する。\n\n## 識別・見分け方のポイント\n接続をまず確認し(未然形なら「む・むず・まし」、終止形なら「らむ・らし・めり・なり」)、次に意味を文脈から絞り込む。「らむ」と「けむ」は時制(現在か過去か)で区別し、「めり」と「なり」は根拠が視覚か聴覚かで区別する。断定の「なり」と伝聞推定の「なり」は接続(体言・連体形か、終止形か)で判別する。\n\n## よくある間違い・注意点\n「まし」の反実仮想は「〜ましかば(せば)…まし」という呼応表現を伴うことが多いので、この形をセットで覚える。ラ変型活用語の場合、終止形接続の助動詞がすべて連体形接続になる点も見落としやすいので注意する。推量系の助動詞は種類が多く似た訳になりやすいため、それぞれの助動詞が持つ「根拠の種類」(視覚か聴覚か、根拠の有無)や「時制」(現在か過去か)という切り口で整理し直すと、単なる丸暗記よりも記憶に定着しやすい。特に「む」は最も意味の幅が広い助動詞なので、人称や連体形・仮定条件の有無を必ず確認する癖をつけたい。", "jodoushi-uchikeshi": "## この単元の要点\n打消・打消推量を表す助動詞には「ず」「じ」「まじ」がある。「ず」は未然形接続で、「ざら・ざり・○・ざる・ざれ・ざれ」の系列と「○・ず・ず・ぬ・ね・○」の系列を持つ特殊な活用をし、単純な打消(〜ない)を表す。「じ」は未然形接続でほとんど活用しない語に近く、推量・意志の「む」を打ち消した意味、すなわち打消推量・打消意志を表す。「まじ」は終止形接続(ラ変型は連体形)でシク活用型の活用をし、当然・推量・意志・可能などを表す「べし」を打ち消した意味、すなわち打消当然・打消推量・打消意志・不可能推量など幅広い意味を持つ。\n\n## 具体例\n「われ、二度とかかる過ちはせじ。」は打消意志の「じ」。「明日は雨降らじ。」は打消推量の「じ」。「かかることは、あるまじきことなり。」は打消当然の「まじ」。「え〜ず」の形は不可能を強く表す代表的な言い回しである。\n\n## 識別・見分け方のポイント\n「じ」は「む」の打消、「まじ」は「べし」の打消と対応づけて整理すると理解しやすい。「じ」は一人称の打消意志・打消推量に使われることが多いのに対し、「まじ」は当然・不可能推量など意味の幅が広い点で区別する。「ず」の活用は2系列あるので、下に続く語によってどちらの系列が使われているかを確認する。\n\n## よくある間違い・注意点\n「まじ」は終止形接続だが、ラ変型活用語(あり・をりなど)には連体形に接続する点を見落としやすい。また、「じ」は活用形がほとんど変化しないため、文中での働き(終止か連体か)を文脈で判断する必要がある。「ず」の2系列の活用(ざら系列とず系列)は、下に続く語によって使い分けられる決まりがあるので、単語だけでなく実際の文例の中でどちらの系列が使われているかを確認する練習を積むとよい。打消の助動詞は肯定の助動詞(む・べしなど)と対応させて覚えると、意味の広がりを理解しやすくなる。", "jodoushi-ganbou": "## この単元の要点\n願望を表す助動詞には「まほし」「たし」があり、比況を表す助動詞には「ごとし」がある。「まほし」は未然形接続でシク活用型、奈良時代から平安中期の作品に多く用いられる自己の希望(〜たい)を表す。「たし」は連用形接続でク活用型、平安後期以降に多く用いられ、現代語の「〜たい」に直接つながる。両者とも意味は同じ「自己の希望」だが、接続と使用時代が異なる点で区別する。他者の願望を表すには「まほしがる」「たがる」のように接尾語「がる」を付けた形を用いる。「ごとし」は体言や活用語の連体形、格助詞「が」「の」に接続し、比況(〜のようだ)を表す。\n\n## 具体例\n「都へ帰らまほし。」「水を飲みたし。」はそれぞれ願望を表す。「月のごとく光る玉あり。」「花のごとし。」は比況を表し、体言に格助詞「の」が付いた形に「ごとし」が接続する典型的な形である。\n\n## 識別・見分け方のポイント\n「まほし」と「たし」は接続(未然形か連用形か)で判別できる。「ごとし」は体言・連体形に接続する点で、他の未然形接続・連用形接続の助動詞と混同しないようにする。「ごとし」は主に終止形・連体形で使われ、他の活用形の使用例は少ない。\n\n## よくある間違い・注意点\n「まほし」を他者の願望に使ってしまう誤りに注意し、他者の願望には「まほしがる」を使う。また、「ごとし」に接続する「の」「が」は主格を表す用法と混同しないよう、比況の文脈であることを確認する。「まほし」と「たし」は意味だけを見ると区別がつかないため、必ず直前の語の活用形(未然形か連用形か)を確認して判別する習慣をつけたい。「ごとし」は連用形「ごとく」、連体形「ごとき」の形でもよく出題されるので、体言や連体形に格助詞「の」「が」を介して接続する典型パターンをあわせて覚えておくとよい。願望と比況は意味の系統が全く異なるにもかかわらず1つの単元でまとめて扱われることが多いため、まず「まほし・たし=願望」「ごとし=比況」という大枠を確実に区別してから、それぞれの接続の細部を確認していく学習順序が効果的である。", "joshi-kiso": "## この単元の要点\n助詞は自立語ではなく、単独では文節を作れない付属語であり、しかも活用しない語である。この「付属語・活用なし」という性質は、活用する付属語である助動詞との重要な区別点になる。\n学校文法(橋本文法)では、助詞を働きの違いから次の6種類に分類する。\n- 格助詞:主に体言に付き、その語と他の語との関係(主格・連体格・対象など)を示す。「が・の・を・に・へ・と・より・から・にて・して」\n- 接続助詞:活用語に付き、前後をつなぐ。「ば・とも・ど・ども・て・つつ・ながら・で」など\n- 係助詞:文中の語を強めたり、文末の活用形を変えたりする。「は・も・ぞ・なむ・や・か・こそ」\n- 副助詞:種々の語に付いて意味を添える。「だに・すら・さへ・のみ・ばかり・まで・など・し」\n- 終助詞:文末に付いて心情を表す。「な・そ・ばや・にしがな・もがな・かな・かし」など\n- 間投助詞:語調を整えたり詠嘆を添えたりする。「を・や・よ」\n\n## 具体例\n「花の咲きたるを見れば、鳥ぞ鳴きける。」という文には複数の助詞が含まれる。「の」は体言的な働きをする「咲きたる」に付く格助詞(主格)、「を」は対象を示す格助詞、「ば」は已然形に付く接続助詞、「ぞ」は係助詞で文末「ける」を連体形にしている。このように一つの文の中にも複数の分類の助詞が混在する。\n\n## 識別・見分け方のポイント\n1. まず、その語の直前が体言か活用語か、活用語ならどの活用形かを確認する。\n2. 同じ形の助詞でも分類によって接続や意味が変わる(例:「が」は格助詞にも接続助詞にもなる)。\n3. 文末の活用形が変化していれば、係助詞による係り結びを疑う。\n4. 意味を添えるだけで文をつながない語(だに・のみ・ばかりなど)は副助詞、文をつなぐ働きがあれば接続助詞と判断する。\n\n## よくある間違い・注意点\n「は・も」を係り結びの法則が必ず起こる助詞だと誤解しやすいが、実際に文末の活用形を変えるのは「ぞ・なむ・や・か・こそ」だけである。また、格助詞の「の」「が」は連体格の用法があるために独立の「連体助詞」という分類があると誤解しないよう注意したい。分類名を覚えるだけでなく、実際の例文の中でどの語がどの助詞に当たるかを確認する練習を重ねることが大切である。", "joshi-kaku": "## この単元の要点\n格助詞は主に体言(または体言に準ずる語)に付いて、その語が文中でどのような資格・関係を持つかを示す助詞である。代表的なものに「が・の・を・に・へ・と・より・から・にて・して」がある。\n- が・の:主格(〜が)、連体格(〜の)のほか、「の」には同格(〜で)や体言の代用(〜のもの)の用法もある。\n- を:動作の対象、動作の起点、経過する場所を表す。\n- に:場所・時間・動作の相手・原因理由・比較の基準・変化の結果・使役の相手など多様な意味を持つ。\n- へ:移動の方向を表す。\n- と:共同動作の相手・引用・比較の基準・変化の結果を表す。\n- より・から:動作の起点、比較の基準、経由、即時(〜するとすぐに)を表す。\n- にて:場所・手段・原因・資格などを表す。\n- して:手段や使役の相手を表す(接続助詞の「して」とは別の用法)。\n\n## 具体例\n竹取物語の「竹の中より見つけたり」の「より」は起点(〜から)を表す。更級日記の「あづま路の道の果てよりも」の「より」も同じく起点を表す。「氷は水より出でて水より寒し」という言い方をすれば、後の「より」は比較の基準を表す。同じ「より」でも文脈によって意味が変わることがわかる。\n\n## 識別・見分け方のポイント\n1. 「が・の」は、直後にどんな語が続くか(主語になる語か、修飾される体言か)で主格・連体格を見分ける。\n2. 「に」は特に多義なので、場所・時・相手・原因・比較・変化の結果のどれに当たるか、文脈から判断する。\n3. 「より・から」は起点が基本だが、比較や即時の意味になる場合もあるため、前後の語(「なり」「寒し」など比較表現、あるいは即座に次の動作が続くか)に注目する。\n4. 「にて」は場所・手段・原因・資格のどれになるかを、直前の体言の性質(場所を示す語か、道具を示す語かなど)から判断する。\n\n## よくある間違い・注意点\n「が」「の」は現代語の主格・連体格の感覚だけでは説明しきれない同格・体言の代用の用法があるため、現代語に引きずられて誤読しないよう注意する。また格助詞の「して」と、接続助詞の「して」(「て」とほぼ同義)を混同しやすいので、体言に付くか活用語の連用形に付くかで区別する。", "joshi-setsuzoku": "## この単元の要点\n接続助詞は活用語(動詞・形容詞・形容動詞・助動詞)に付いて、前後の文節や文をつなぐ助詞である。同じ助詞でも接続する活用形によって意味が変わるものが多く、接続形の把握が最重要のポイントになる。\n- ば:未然形+ば=順接仮定条件(もし〜ならば)。已然形+ば=順接確定条件(原因理由・偶然条件・恒常条件)。\n- とも:終止形(ラ変型は連体形)+とも=逆接仮定条件(たとえ〜としても)。\n- ど・ども:已然形+ど(ども)=逆接確定条件(〜けれども)。\n- て・して:連用形に接続し、単純接続(そして)を表す。\n- つつ:連用形に接続し、反復・同時進行、和歌などでは詠嘆を込めた継続(つつ止め)を表す。\n- ながら:動作の並行・状態の継続・逆接の意味を持つ。\n- で:未然形に接続し、打消を伴う「〜ないで」を表す。\n- が・に・を:接続助詞として用いられる場合はいずれも連体形に接続し、単純接続や逆接を表す。\n\n## 具体例\n竹取物語の「竹を取りつつ、よろづのことに使ひけり」の「つつ」は動作の反復を表す。徒然草の「命長ければ辱多し」の「ば」は已然形に付いて原因理由(〜ので)を表す順接確定条件である。「花は咲きたるが、風いたく吹く」の「が」は活用語の連体形に付いて逆接の単純接続(〜けれど)を表している。\n\n## 識別・見分け方のポイント\n1. まず直前の語の活用形を確認する。「ば」は未然形か已然形かで意味が正反対に近いほど変わる。\n2. 「とも」は終止形接続が原則だが、ラ変型の活用語には連体形が来る点に注意する。\n3. 「が・に・を」が接続助詞として使われているときは、直前が体言ではなく活用語の連体形になっている。格助詞の同じ語と混同しないよう、直前の語の品詞を確認する。\n4. 「ながら」は動作の並行・状態の継続・逆接のどれになるか、前後の文脈的なつながり(対立しているかどうか)で判断する。\n\n## よくある間違い・注意点\n「ば」を見た瞬間に「もし〜ならば」と訳してしまう誤りが多いが、已然形に接続している場合は「〜ので」「〜すると」という確定条件になるため、必ず直前の活用形を確認する必要がある。また、格助詞の「が・に・を」と接続助詞の「が・に・を」を混同しやすいが、体言に付くか活用語の連体形に付くかで判別できる。", "joshi-kakari": "## この単元の要点\n係助詞は文中の語に付いて意味を強めたり、文末の活用形に影響を与えたりする助詞である。特に「ぞ・なむ・や・か・こそ」は、文末の活用語を通常とは異なる活用形で結ばせる「係り結びの法則」を引き起こす点が最大の特徴である。\n- ぞ・なむ:強意を表し、文末を連体形で結ぶ。\n- や・か:疑問または反語を表し、文末を連体形で結ぶ。\n- こそ:強意を表し、文末を已然形で結ぶ(この点だけ他と異なる)。\n- は・も:主題の提示・区別(は)、並列・添加(も)を表すが、係り結びによる結びの変化は起こさない。\n\n## 具体例\n竹取物語の「名をば、讃岐造となむいひける」は、係助詞「なむ」があるために文末が終止形「けり」ではなく連体形「ける」になっている。徒然草の「花は盛りに、月は隈なきをのみ見るものかは」の「かは」は係助詞「か」に「は」が付いた形で、「見るものだろうか、いや見るものではない」という反語の意味を表す。また「雨こそ降れ、風は吹かず」のように、已然形の結びのあとに読点を挟んでさらに文が続く場合は、係り結びの「流れ(消滅)」が起こり、「雨は降るけれども」という逆接の意味が生まれる。\n\n## 識別・見分け方のポイント\n1. 文中に「ぞ・なむ・や・か・こそ」があれば、文末の活用形を確認する。連体形なら「ぞ・なむ・や・か」、已然形なら「こそ」に対応している。\n2. 「や・か」は疑問か反語かを、文脈(答えを求めているか、それとも強い否定を込めているか)から判断する。\n3. 已然形で結ばれたあとにも文が続いている場合は、係り結びの流れ(逆接のニュアンス)を疑う。\n4. 「は・も」は係助詞ではあるが、係り結びの法則の対象外である点を混同しないようにする。\n\n## よくある間違い・注意点\n「こそ」の結びを連体形にしてしまう誤りが非常に多いので、「こそ→已然形」は特に意識して覚える必要がある。また、接続助詞「ど・ども」による已然形(文中でそのまま文が続く)と、係助詞「こそ」の已然形の結び(基本的に文末、または流れの場合に限り文が続く)を混同しないよう、係助詞の有無を必ず確認する。", "joshi-fuku": "## この単元の要点\n副助詞は種々の語に付いて意味を添え、下にある用言を修飾する助詞である。文をつなぐ働きはなく、この点で接続助詞と区別される。\n- だに:類推(軽いものを示し重いものを類推させる、〜さえ)。仮定・願望表現とともに用いられると最小限の希望(せめて〜だけでも)を表す。\n- すら:類推(〜さえ)のみを表す。\n- さへ:添加(そのうえ〜までも)を表す。\n- のみ:限定(〜だけ)、または強意を表す。\n- ばかり:程度(〜くらい)、限定(〜だけ)、およその分量を表す。\n- まで:程度・限度(〜まで)、添加(〜までも)を表す。\n- など:例示(〜など)、婉曲(ぼかす)を表す。\n- し:強意を表し、特に訳さないことが多い。\n\n## 具体例\n「風の音にだに驚かるる秋の夕暮れ」の「だに」は、風の音というささやかなものにさえ驚くのだから、他の事柄にはなおさら驚くだろうと類推させる用法である。「雨降るに、風さへ吹きたり」の「さへ」は、雨が降っている状況にさらに風が加わったことを示す添加の用法。「三寸ばかりなる人」の「ばかり」はおよその大きさ・分量を示す用法である。\n\n## 識別・見分け方のポイント\n1. 「だに」は、仮定・願望の表現(「ば」「まし」など)と結び付いているかどうかで、類推(〜さえ)か最小限の希望(せめて〜だけでも)かを見分ける。\n2. 「のみ」「ばかり」はどちらも限定の意味を持つが、「ばかり」にはさらに程度・分量の意味がある点に注意する。\n3. 「さへ」「まで」はどちらも添加の意味を持ちうるが、「まで」には本来の限度・程度の意味もある。\n4. 「など」は例示か婉曲かを、具体的な事物を並べているか、内容をぼかして表現しているかで判断する。\n\n## よくある間違い・注意点\n「さへ」を現代語の「さえ」と同じ意味(類推)だと誤解しやすいが、古文の「さへ」は基本的に添加(そのうえ〜までも)の意味であり、類推の意味を持つのは「だに」「すら」である。この現代語との意味のずれは頻出の注意点なので、必ず区別して覚えておきたい。", "joshi-shuu": "## この単元の要点\n終助詞は文末(または句の切れ目)に付いて、話し手の禁止・願望・詠嘆・念押しなどの心情を表す助詞である。\n- な(単独):禁止(〜するな)。終止形(ラ変型は連体形)に接続。\n- な…そ:連用形を挟む呼応表現で、穏やかな禁止を表す。\n- ばや:未然形に接続し、自己の願望(〜したい)を表す。\n- にしがな・てしがな:連用形に接続し、自己の願望(〜てしまいたいものだ)を表す。\n- もが・もがな:願望(〜があればなあ、〜であればなあ)を表す。\n- かな:体言・連体形に接続し、詠嘆(〜だなあ)を表す。\n- かし:念押し(〜よ、〜ね)を表す。\n- や・か(終助詞用法):呼びかけ・軽い疑問・詠嘆を表す。\n\n## 具体例\n「な行きそ」は「行くな」という禁止を、「花見にゆかばや」は「花見に行きたい」という自己の願望を、「命長くもがな」は「長生きしたいものだなあ」という願望を、「あはれなるかな」は「しみじみと趣深いことだなあ」という詠嘆を表す。「これは秘密なるぞかし」は「これは秘密であるよ」と、係助詞「ぞ」の強意にさらに念押しの「かし」が加わった表現である。\n\n## 識別・見分け方のポイント\n1. 「な」は接続によって意味を見分ける。単独で終止形(ラ変型は連体形)に付けば禁止、「な…そ」の形で連用形を挟めば穏やかな禁止、活用語の終止形に付いて詠嘆を表すこともある。\n2. 願望を表す終助詞は「ばや(自己の願望・未然形接続)」「にしがな・てしがな(自己の願望・連用形接続、完了のニュアンスを伴う)」「もが・もがな(他に対する願望)」の三系統を、接続と意味の違いで区別する。\n3. 「かな」は詠嘆、「かし」は念押しと、似た響きだが意味が異なるので混同しないようにする。\n\n## よくある間違い・注意点\n禁止の「な」と詠嘆の「な」を同じ語だと思い込みやすいが、接続する活用形が異なる(禁止は終止形、詠嘆は終止形接続でも文脈上の働きが異なる)ため、文脈と前後の語で慎重に判断する必要がある。また「ばや」を反語や疑問と誤読しないよう、「〜したい」という自己の願望を表す語だと正しく覚えておくことが大切である。", "keigo-kiso": "## この単元の要点\n古典文法における敬語は、敬意を向ける相手によって「尊敬語」「謙譲語」「丁寧語」の三種類に分かれる。尊敬語は動作をする人物(動作主)を高める敬語、謙譲語は動作を受ける人物を高めるために動作主がへりくだる敬語、丁寧語は聞き手・読み手に対して丁寧な気持ちを表す敬語である。敬語を読み解くうえで最も大切なのは、常に「誰から誰への敬意か」を意識することである。地の文では作者(語り手)から登場人物への敬意、会話文では話し手から聞き手や話題の人物への敬意を表すのが原則であり、この区別が人物関係や身分の高低を読み取る手がかりになる。\n\n## 具体例\nたとえば「中納言、御前に参りたまふ。」という文では、「参り」は謙譲語で参上する先(御前)への敬意を、「たまふ」は尊敬語で動作主である中納言への敬意を表しており、一文の中で敬意の方向が異なる二つの敬語が同時に使われている。また、動詞にただ意味を添えるだけの「補助動詞」としての用法にも注意したい。「語りたまふ」の「たまふ」は「お与えになる」という本来の意味を失い、「語る」という動作に尊敬の意を添えるだけの補助動詞になっている。\n\n## 識別・見分け方のポイント\nまず、その敬語がどの人物の、どんな動作・状態に付いているかを確認する。次に、その語が尊敬語・謙譲語・丁寧語のどれに分類されるかを判断し、敬意がどちらの方向を向いているかを考える。本動詞か補助動詞かも、意味が動詞本来の意味を保っているか、単に敬意を添えるだけになっているかで見分けられる。\n\n## よくある間違い・注意点\n「敬語=尊敬語」と誤解し、謙譲語や丁寧語まで動作主への敬意だと思い込んでしまう誤りが多い。謙譲語は動作主自身ではなく、動作を受ける相手を高める点、丁寧語は動作の当事者ではなく聞き手・読み手を高める点を混同しないようにしたい。また、一文中に複数の敬語がある場合、それぞれの敬意の方向を個別に考える必要がある。", "keigo-sonkei": "## この単元の要点\n尊敬語は、動作をする人物(動作主)への敬意を表す敬語である。代表的な尊敬の動詞には「たまふ」(お与えになる/お~になる)、「おはす・おはします」(いらっしゃる)、「のたまふ・のたまはす」(おっしゃる)、「おぼす・おぼしめす」(お思いになる)、「ご覧ず」(ご覧になる)、「めす」(お呼びになる・召し上がる・お召しになるなど)、「大殿籠る」(お休みになる)、「しろしめす」(お治めになる・ご存じである)などがある。これらは本動詞として単独で使われるほか、動詞の連用形に付いて「~なさる」の意を添える補助動詞としても使われる。\n\n## 具体例\n「殿、御簾の内より出でたまふ。」では、「出でたまふ」の「たまふ」は「出づ」という動作に尊敬の意を添える補助動詞であり、殿という動作主への敬意を表す。また「帝、歌をよませたまふ。」のように、尊敬の助動詞「す・さす・しむ」が「たまふ」などの尊敬語と重なると、より敬意の高い二重敬語(最高敬語)になることがある。\n\n## 識別・見分け方のポイント\n「たまふ」は四段活用であれば尊敬語、下二段活用であれば謙譲語という活用の種類による判別が重要である。また、同じ意味を持つ語同士でも「のたまふ」より「のたまはす」、「おぼす」より「おぼしめす」の方が敬意が高いというように、敬意の程度に差がある点も押さえておきたい。\n\n## よくある間違い・注意点\n「めす」は「呼ぶ」の尊敬語という意味だけでなく、「食ふ・飲む」「着る」「乗る」など様々な動作の尊敬語として使われるため、文脈から対象となる動作を判断する必要がある。また、尊敬語だからといって必ずしも身分の高い人物の動作にのみ使われるとは限らず、自敬敬語という特殊な用法があることも忘れないようにしたい。", "keigo-kenjou": "## この単元の要点\n謙譲語は、動作をする人物(動作主)がへりくだることで、動作を受ける相手への敬意を表す敬語である。代表的な謙譲の動詞には「たてまつる」(差し上げる)、「まゐる」(参上する・差し上げる)、「まうす」(申し上げる)、「うけたまはる」(お聞きする・謹んでお受けする)、「たまはる」(いただく)、「つかうまつる」(お仕えする・して差し上げる)、「まゐらす」「聞こゆ・聞こえさす」(差し上げる・申し上げる)などがある。これらも本動詞のほか、動詞の連用形に付いて「~し申し上げる」の意を添える補助動詞として使われる。\n\n## 具体例\n「翁、竹の中より見つけたてまつりて、うつくしみて養ふ。」では、「見つけたてまつる」の「たてまつる」は謙譲の補助動詞で、動作主である翁がへりくだることで、見つけられた対象(かぐや姫)への敬意を表している。また「奏す」「啓す」のように、それぞれ天皇・上皇、中宮・皇太子にしか使えない絶対敬語も謙譲語の中に含まれる。\n\n## 識別・見分け方のポイント\n謙譲語は、動作を受ける相手が誰であるかに注目することが重要である。動詞の直前・直後に「御前に」「宮に」などの相手を示す語があれば、その相手への敬意を表していると判断できる。「まゐる」は謙譲語が基本だが、飲食や着用の動作と結び付くと「召し上がる・お召しになる」という尊敬語に転じる例外があるので注意する。\n\n## よくある間違い・注意点\n謙譲語を「動作主を高める敬語」と誤解してしまう間違いが非常に多いが、謙譲語はあくまで動作主がへりくだることで相手を高める敬語である。また「たまはる」(いただく、謙譲語)と「たまふ」(お与えになる、尊敬語)のように、形の似た語を混同しないよう、意味と敬語の種類をセットで覚えることが大切である。", "keigo-teinei": "## この単元の要点\n丁寧語は、話や文章の聞き手・読み手に対して丁寧な気持ちを表す敬語で、現代語の「です・ます」に近い働きをする。代表的な語は「はべり」と「さぶらふ(さうらふ)」で、ともにもとは「貴人のそばにお仕えする」という意味の謙譲語だったが、平安時代以降、丁寧語(あります・~です・~ます)としての用法が広まった。「はべり」はラ行変格活用、「さぶらふ」はハ行四段活用である。\n\n## 具体例\n「今、庭に花咲きはべり。」の「はべり」は丁寧の補助動詞で、聞き手への丁寧な気持ちを添えている。一方「かの大納言、御前にさぶらふ。」のように「御前に」という奉仕の対象・場所が明示されている場合は、謙譲語(お仕えする)としての用法である。同じ語が文脈によって謙譲語にも丁寧語にもなる点が丁寧語学習の大きな特徴である。\n\n## 識別・見分け方のポイント\n「はべり」「さぶらふ」が謙譲語か丁寧語かを見分けるには、具体的な奉仕の対象・場所が示されているかどうかに注目するとよい。奉仕の相手が明示されていれば謙譲語、単に存在・状態を丁寧に述べているだけであれば丁寧語と判断できる。枕草子のような読み手に語りかける文体の作品には丁寧語が多く見られる。\n\n## よくある間違い・注意点\n丁寧語は動作主や動作の受け手ではなく、聞き手・読み手そのものへの敬意を表す点を忘れないようにしたい。尊敬語・謙譲語と違って敬意の対象が「話の外」にいる聞き手・読み手である点が最大の特徴であり、混同しやすいので注意が必要である。また中世以降「さうらふ」が武家の書簡や軍記物語の会話文で多用されるようになった歴史的変化も押さえておきたい。", "keigo-magirawashii": "## この単元の要点\n敬語の中には、複数の敬語が組み合わさって最高位の人物に対する特に高い敬意を表す「二重敬語(最高敬語)」、特定の身分の人物にしか使われない「絶対敬語」、話し手が自分自身の動作に尊敬語を用いる「自敬敬語」など、識別に注意が必要な紛らわしい用法がある。二重敬語の代表例は「せたまふ」「させたまふ」「のたまはす」「仰せらる」など、絶対敬語の代表例は天皇・上皇に対する「奏す」、中宮・皇太子に対する「啓す」である。\n\n## 具体例\n「法皇、御涙を流させたまひて、『あはれ』とぞ仰せられける。」では、「流させたまひ」(尊敬の助動詞+尊敬語)と「仰せられ」(尊敬語+尊敬の助動詞)がいずれも二重敬語で、最高位の人物である法皇への特に高い敬意を表している。また「大臣、酒をまゐる。」のように、本来謙譲語である「まゐる」が飲食の動作と結び付くと「召し上がる」という尊敬語の意味に転じる例も紛らわしい用法の一つである。\n\n## 識別・見分け方のポイント\nまず語の活用の種類・活用形を確認する(「たまふ」の四段・下二段の別など)。次に文脈から動作主・動作の対象・敬意の方向を確認し、最後にその組み合わせが二重敬語や絶対敬語にあたらないかを検討する。絶対敬語は対象となる人物の身分が限定されているため、文脈中の人物の身分を確認することが手がかりになる。\n\n## よくある間違い・注意点\n「二重敬語」と「絶対敬語」を混同しないようにしたい。二重敬語は同種の敬語を重ねるという表現形式についての呼び名であり、絶対敬語は使える対象が限定されるという語の性質についての呼び名で、観点が異なる概念である。また、自敬敬語のように原則(尊敬語は他者に、謙譲語は自分に)から外れる特殊な用法があることも忘れずに押さえておきたい。", "meishi": "## この単元の要点\n名詞(体言)は活用しない自立語で、単独で主語になれる語である。種類としては、事物一般を指す普通名詞、特定の人・場所などを指す固有名詞、数量・順序を表す数詞、そして人や事物を指し示す代名詞がある。代名詞はさらに、人を指す人代名詞(自称・対称・他称・不定称)と、事物・場所・方向を指す指示代名詞(近称・中称・遠称・不定称)に分かれる。現代語と語形も指す範囲も異なることが多いため、それぞれの語がどの分類に属するかを覚えることが大切である。\n\n## 具体例\n竹取物語「かぐや姫、『それは、この国に無き玉なり』とのたまふ」の「それ」は、相手が話題にした物を受ける中称の指示代名詞である。伊勢物語「昔、男ありけり」に続く「その男」の「その」も同様に前出の名詞を受けている。人代名詞では、自称「われ・まろ・わらは・おのれ」、対称「なんぢ・そなた・おまへ」、他称「かれ」、不定称「たれ・いづれ」のように、話し手・聞き手・第三者・不特定のいずれを指すかで語が使い分けられる。\n\n## 識別・見分け方のポイント\nまず、その語が活用するかどうかを確認して名詞かどうかを判断する。次に代名詞の場合は、誰(何)を指しているかを文脈から具体的に特定し、話し手自身か、相手か、第三者か、不特定かで自称・対称・他称・不定称を判別する。指示代名詞は、話し手からの心理的・物理的な距離(近い・やや離れている・遠い・不明)によって近称・中称・遠称・不定称に分類する。\n\n## よくある間違い・注意点\n「おのれ」のように文脈次第で自称にも対称にもなる語や、「かれ」のように人代名詞(他称)と指示代名詞(遠称)の両方の用法を持つ語があるため、語形だけで機械的に分類せず、必ず文脈の中でその語が何(誰)を指しているかを確認する必要がある。また、現代語の「あなた」が古文では場所を指す遠称の指示代名詞であるなど、現代語との意味のずれにも注意したい。", "fukushi": "## この単元の要点\n副詞は活用しない自立語で、主に用言(動詞・形容詞・形容動詞)を修飾する。働きの上から状態の副詞(動作・作用の様子を表す)、程度の副詞(性質・状態の程度を表す)、呼応の副詞(陳述の副詞、下に決まった言い方を要求する)の三種に分けられる。連体詞は体言のみを修飾する活用しない自立語、感動詞は感動・呼びかけ・応答を表す独立語、接続詞は語句や文をつなぐ自立語であり、これらもあわせて品詞識別の対象となる。\n\n## 具体例\n「え言はず」「つゆ知らず」「さらに悲しとも思はず」はいずれも呼応の副詞と打消の助動詞「ず」が組み合わさり「まったく(全く)~ない・~できない」という意味を作る。「よも来じ」は打消推量の助動詞「じ」と呼応して「まさか~ないだろう」、「な泣きそ」は連用形を挟んで「~するな」という禁止を表す。「たとひ雨降るとも」は仮定の逆接、「いかで見ばや」は願望を強める呼応表現である。「あな、うれし」の「あな」は感動詞、「さる者」の「さる」は体言を修飾する連体詞である。\n\n## 識別・見分け方のポイント\n呼応の副詞は、文末にどのような語(打消の「ず」、推量の「じ」「む」、禁止の「な~そ」、仮定の「とも」「ば」など)が来ているかをセットで覚えることが最も確実な見分け方である。状態の副詞か程度の副詞かは、動作の様子を表しているか、性質・程度の強さを表しているかで判断する。また、体言を修飾していれば連体詞、独立して感動・呼びかけを表していれば感動詞、文と文をつないでいれば接続詞と判断する。\n\n## よくある間違い・注意点\n現代語の「さらに(その上に、加えて)」と古文の「さらに(全く~ない)」のように、同じ語形でも意味・用法が大きく異なる呼応の副詞があるため、現代語の語感で訳さないよう注意する。また「つとめて(早朝、名詞)」と「つと(急に、状態の副詞)」のように語形の似た語を混同しないこと、呼応の副詞は必ず文末の表現とセットで確認することが大切である。", "waka-1": "## この単元の要点\n枕詞は特定の語を導くために置かれる決まった修飾語で、多くは五音からなり、意味の上では現代語訳しないのが原則である。序詞は枕詞と同様にある語を導く働きを持つが、語形やかかる語が固定されておらず、作者が自由に長さも内容も工夫して創作できる点が異なる。縁語は、歌の中心となる語と意味的に関連の深い語を意図的に散りばめる技法で、歌に統一感と余情を与える。\n\n## 具体例\n「あしひきの」は「山」、「たらちねの」は「母」、「ひさかたの」は「光・天・月」、「あらたまの」は「年・月・日」、「しろたへの」は「衣・雪・雲」、「くさまくら」は「旅」、「ちはやぶる」は「神」を導く代表的な枕詞である。柿本人麻呂「あしひきの山鳥の尾のしだり尾のながながし夜をひとりかも寝む」では、「あしひきの」が枕詞、「山鳥の尾のしだり尾の」全体が「ながながし」を導く序詞になっている。式子内親王「玉の緒よ絶えなば絶えねながらへば」では、「玉の緒」から「絶え」「ながらへ」へと縁語が連鎖している。\n\n## 識別・見分け方のポイント\n五音前後で、かかる語がほぼ固定していて訳す必要がなければ枕詞と判断する。七音以上の長さがあり、比喩や情景描写を通して次の語句を導いていれば序詞と判断する。特定の語(例えば「糸」「玉」など)から連想される複数の語が歌の各所に散らばっていれば縁語と判断する。\n\n## よくある間違い・注意点\n枕詞と序詞は「ある語を導く」という共通点があるため混同しやすいが、語形・音数が固定的か自由かという点で区別する。また、序詞や縁語は掛詞と組み合わさって使われることが多く、一つの語が複数の技法にまたがって働くことがあるため、一つの技法名だけにとらわれず歌全体の構造を丁寧に読み取ることが大切である。", "waka-2": "## この単元の要点\n掛詞は、一つの語の音に意味の異なる二つ以上の語の意味を重ねる技法で、限られた三十一音の中に多層的な意味を持たせる。本歌取りは、有名な古歌(本歌)の語句や発想を意図的に取り入れて新しい歌を詠む技法で、新古今和歌集の時代に特に発達した。体言止めは、歌の末尾を名詞(体言)で結ぶことで、言い切らずに余情・余韻を残す技法である。\n\n## 具体例\n小野小町「花の色は移りにけりないたづらにわが身世にふるながめせしまに」では、「ふる」に「(雨が)降る」と「(年月を)経る」、「ながめ」に「眺め」と「長雨」の意が掛けられている。崇徳院「瀬をはやみ岩にせかるる滝川のわれても末にあはむとぞ思ふ」の「われても」は、川が「割れても」と恋人と「別れても」の意を掛ける。藤原定家「見わたせば花も紅葉もなかりけり浦の苫屋の秋の夕暮」は、結句「秋の夕暮」が体言止めで結ばれ、静かな余情を残している。\n\n## 識別・見分け方のポイント\n掛詞は、平仮名書きの語に文脈上二通り以上の意味が成り立たないかを確認して見つける。本歌取りは、歌の一部に有名な古歌と共通する語句・発想がないかを確認し、本歌の情景と新しい歌の趣向がどのように重なり合っているかを読み取る。体言止めは、歌の結句が名詞で終わっているか、それとも用言や助動詞で終わっているかを確認して判断する。\n\n## よくある間違い・注意点\n「ふるさと」のように一見掛詞に見えても実際には一語の名詞にすぎない語もあるため、機械的にすべての同音語を掛詞と判断しないよう注意する。また、係り結びなどにより文末が連体形の用言で終わっている場合、体言止めと誤認しやすいので、結句の品詞を丁寧に確認することが必要である。", "magirawashii-go": "## この単元の要点\n「なり」「なむ」「ぬ」「る」「に」「ね」などは、それぞれ複数の文法的な働き(助動詞・助詞・動詞の活用語尾など)を持つため、文脈の中でどの働きをしているかを一つ一つ判断する必要がある。識別の基本は、その語の直前に来ている語の活用形(未然形・連用形・終止形・連体形・已然形)と、下に続く語を確認することである。\n\n## 具体例\n「なり」は、体言・連体形に接続すれば断定の助動詞(「薬なり」)、終止形(ラ変型は連体形)に接続すれば伝聞推定の助動詞(「声すなり」)、それ自体が動詞なら「鳴る」などの活用語尾となる。「なむ」は、未然形に接続すれば願望の終助詞(「明けなむ」)、連用形に接続すれば完了「ぬ」+推量「む」(「来なむ」)、文中で係り結びを作れば強意の係助詞となる。「ぬ」「ね」は未然形接続なら打消の助動詞「ず」(連体形「ぬ」・已然形「ね」)、連用形接続なら完了の助動詞「ぬ」(終止形「ぬ」・命令形「ね」)である。「る」は未然形接続なら受身・尊敬・自発・可能の助動詞、已然形(エ段)接続なら存続・完了の助動詞「り」、動詞そのものの語尾であることもある(「散る」)。「に」は体言接続で下に「あり」を伴えば断定の助動詞、連用形接続で下に「けり」を伴えば完了の助動詞、体言に直接付いて場所などを示せば格助詞、連体形に付き文をつなげば接続助詞である。\n\n## 識別・見分け方のポイント\nまず、その語一語だけで動詞や副詞の一部になっていないか(「鳴る」「げに」など)を確認する。次に直前の語の活用形を確認し、未然形か連用形か、終止形か連体形かによって候補を絞り込む。最後に下に続く語(「けり」「あり」など)も手がかりにして、最も文脈に合う意味を選ぶ。\n\n## よくある間違い・注意点\n語形だけを見て機械的に一つの用法に決めつけてしまう誤りが最も多い。特に「ぬ」と「ね」は打消(未然形接続)と完了(連用形接続)のどちらであるかを、接続を確認せずに現代語の感覚で判断してしまいがちなので注意する。また、ナ変動詞(死ぬ・往ぬ)の未然形・連用形の活用語尾がたまたま「な」「に」となるため、助動詞と紛らわしい点にも気をつけたい。"};

い。", "modernTranslation": ""}, {"question": "傍線部「おごれる人も久しからず、唯春の夜の夢のごとし。」の現代語訳として最も適切なものはどれか。", "choices": ["思い上がった人も長くは続かない、まるで春の夜の夢のようにはかない。", "思い上がった人ほど長生きするもので、春の夜の夢のように幸福だ。", "謙虚な人は長く栄えるが、それは春の夜の夢のように短い。", "思い上がった人は、春の夜に必ず夢を見るものである。"], "correctIndex": 0, "explanation": "「おごれる人」は「思い上がった(権勢を誇る)人」、「久しからず」は「長くは続かない」、「春の夜の夢のごとし」は「春の夜に見る夢のようにはかない」の意。全体で、権勢を誇る者の栄華も長続きせず、はかなく消えてしまうことを述べている。「長生きする」「幸福」「必ず夢を見る」はいずれも本文の趣旨と異なる。", "modernTranslation": "思い上がった人も長くは続かない、まるで春の夜の夢のようにはかない。"}, {"question": "傍線部「たけき者も遂にはほろびぬ、偏に風の前の塵に同じ。」の現代語訳として最も適切なものはどれか。", "choices": ["勢いの盛んな者も最後には必ず滅んでしまう、それはまるで風の前の塵と同じだ。", "勢いの盛んな者は、風が吹いても塵のように飛ばされることはない。", "勢いの盛んな者ほど、風を利用して塵を遠くまで飛ばすことができる。", "勢いの盛んな者は滅びることがなく、風の前の塵のように軽やかだ。"], "correctIndex": 0, "explanation": "「遂には」は「最後には・とうとう」、「偏に」は「まったく・ひとえに」の意で、勢いの盛んな者もどんなに強くても最後には必ず滅び、それは風の前で舞い散る塵とまったく同じだと述べている。他の選択肢はいずれも「滅びない」「飛ばされない」など反対の内容になっている。", "modernTranslation": "勢いの盛んな者も最後には必ず滅んでしまう、それはまるで風の前の塵と同じだ。"}, {"question": "この冒頭の文章全体が説いている中心的な思想として最も適切なものはどれか。", "choices": ["武士は文人よりも優れているという思想", "この世のあらゆる栄華は永遠には続かず、必ず衰え滅びるという無常観", "仏に祈れば、いかなる望みもかなうという思想", "自然の風景は人間の力ではどうにもならないという思想"], "correctIndex": 1, "explanation": "「諸行無常」「盛者必衰」という語や、「おごれる人も久しからず」「たけき者も遂にはほろびぬ」という叙述からわかるように、この冒頭は、権勢を誇った者も必ず衰え滅びるという仏教的な無常観を、平家物語全体の主題として掲げている。武士と文人の優劣や祈願成就、自然の力についての思想ではない。", "modernTranslation": ""}, {"question": "「近く本朝をうかがふに」以降で名前が挙げられている将門・純友・義親・信頼は、どのような例として挙げられているか。", "choices": ["仏道修行に励み、悟りを開いた高僧の例", "かつて権勢や勢いを誇りながらも、結局は滅びていった者たちの例", "現在も繁栄を続けている家柄の例", "詩歌に優れた才能を発揮した文化人の例"], "correctIndex": 1, "explanation": "本文は「これらおごれる心も猛き事も、皆とりどりにこそありしかども」と述べ、将門・純友・義親・信頼をいずれも権勢や勢いを誇ったものの、最終的には滅んでいった人物として並べている。これは「盛者必衰」の理を日本国内の具体例で示す部分であり、高僧・繁栄する家柄・文化人としての例ではない。", "modernTranslation": ""}, {"question": "傍線部「これら」が指す内容として最も適切なものはどれか。", "choices": ["祇園精舎や沙羅双樹などの仏教にゆかりのある事物", "承平の将門・天慶の純友・康和の義親・平治の信頼の四人", "六波羅の平清盛とその一族", "本文には具体的に指す内容がない"], "correctIndex": 1, "explanation": "「これら」は直前に列挙された「承平の将門、天慶の純友、康和の義親、平治の信頼」の四人を指し、「これらおごれる心も猛き事も、皆とりどりにこそありしかども」と続けて、それぞれに権勢や勢いの誇り方は異なっていたと述べている。祇園精舎や沙羅双樹、平清盛を指すのではない。", "modernTranslation": ""}, {"question": "傍線部「六波羅の入道前太政大臣平朝臣清盛公と申しし人」が指す人物は誰か。", "choices": ["平将門", "藤原純友", "源義親", "平清盛"], "correctIndex": 3, "explanation": "「六波羅の入道前太政大臣平朝臣清盛公」は、六波羅に邸を構え、太政大臣を辞した後に出家した平清盛を指す呼び方である。将門・純友・義親は、その直前に挙げられた別の例であり、清盛はこれらに続けて「間近くは」(=もっと近い時代の例では)として特に取り上げられている人物である。", "modernTranslation": ""}]}, {"source": "平家物語(扇の的)", "passage": "与一、目をふさいで、『南無八幡大菩薩、我が国の神明、日光の権現、宇都宮、那須の湯泉大明神、願はくは、あの扇の真ん中射させてたばせたまへ。これを射損ずるものならば、弓切り折り自害して、人に再び面を向かふべからず』と心のうちに祈念して、目を見開いたれば、風少し吹き弱り、扇も射よげにぞなつたりける。与一、鏑を取つてつがひ、よつぴいて、ひやうど放つ。小兵といふぢやう、十二束三伏、弓は強し、鏑は浦響くほど長鳴りして、あやまたず扇の要際一寸ばかりおいて、ひいふつとぞ射切つたる。", "questions": [{"question": "傍線部「よつぴいて」の意味として最も適切なものはどれか。", "choices": ["弓を静かに構えて", "弓を十分に引き絞って", "弓を放り投げて", "弓を修理して"], "correctIndex": 1, "explanation": "「よつぴく」は「弓を十分に引き絞る」という意味の動詞で、「よく引く」が変化した語形である。与一が矢を放つ直前に力いっぱい弓を引き絞る動作を表しており、「静かに構える」「放り投げる」「修理する」はいずれも誤り。", "modernTranslation": "弓を十分に引き絞って"}, {"question": "傍線部「あやまたず」の意味として最も適切なものはどれか。", "choices": ["急いで", "力を込めて", "的をはずさずに", "音を立てずに"], "correctIndex": 2, "explanation": "「あやまたず」は動詞「あやまつ(誤る・的をはずす)」の未然形に打消の助動詞「ず」がついた形で、「的をはずさずに・狙いを誤らずに」の意味を表す。与一の矢が寸分違わず命中したことを示す語であり、「急いで」「力を込めて」「音を立てずに」は文脈上の意味として不適切。", "modernTranslation": "的をはずさずに"}, {"question": "傍線部「願はくは、あの扇の真ん中射させてたばせたまへ」の「たまへ」について、正しい説明はどれか。", "choices": ["「与ふ」の謙譲語で、与一自身をへりくだって言う語である", "尊敬の補助動詞で、神仏に対する与一の敬意を表している", "丁寧の補助動詞で、聞き手である味方の武士への敬意を表している", "特に敬意を含まない、命令形だけの動詞である"], "correctIndex": 1, "explanation": "「たまへ」は尊敬の補助動詞「たまふ」の命令形で、与一が心の中で神仏(八幡大菩薩や日光権現など)に「(扇を)射させてください」と祈っていることから、祈願の対象である神仏への敬意を表している。謙譲語や丁寧語ではなく、また敬意を欠く語でもない。", "modernTranslation": ""}, {"question": "傍線部「扇も射よげにぞなつたりける」の文法的な特徴として正しいものはどれか。", "choices": ["係助詞「ぞ」による係り結びで、文末の「ける」が連体形になっている", "係助詞「こそ」による係り結びで、文末が已然形になっている", "終助詞「ぞ」が禁止の意味を添えている", "「ぞ」は感動詞で、文法的な係り結びとは関係がない"], "correctIndex": 0, "explanation": "係助詞「ぞ」は文末を連体形で結ぶ係り結びの法則を持つ。ここでは過去の助動詞「けり」が連体形「ける」になって文を結んでおり、「扇が射やすい状態になったのだなあ」という詠嘆・強調の意味合いを添えている。「こそ」による已然形の結びではなく、「ぞ」は係助詞であって終助詞や感動詞ではない。", "modernTranslation": ""}, {"question": らば」で「この、扇を射る一事に失敗したならば」という意味になる。馬・弓矢・平家の船そのものを指すのではない。", "modernTranslation": ""}, {"question": "傍線部「鏑は浦響くほど長鳴りして」の「浦」が指す場所として最も適切なものはどれか。", "choices": ["与一の故郷である那須の山里", "与一たちがいた、この場面の舞台となっている海岸一帯", "平家の都があった場所", "与一が的を外した場合に自害しようとした山"], "correctIndex": 1, "explanation": "「浦」は入り江・海岸を意味する語で、ここでは与一が馬を海に乗り入れ、沖に浮かぶ扇の的をねらっているこの場面の舞台となっている海岸一帯を指す。鏑矢の音がその浦一帯に響き渡るほど長く尾を引いたことを表しており、故郷の那須や平家の都、自害の場所を指すのではない。", "modernTranslation": ""}]}, {"source": "平家物語(敦盛の最期)", "passage": "熊谷、「あれは大将軍とこそ見奉れ。卑怯にも敵に後ろを見せさせ給ふものかな。返させ給へ」と扇をあげて招きければ、招かれて取つて返す。汀に打ち上がらんとする所に、熊谷、押し並べてむずと組んでどうど落ち、取つて押さへて首をかかんと、甲を押しあふのけて見ければ、年十六、七ばかりなるが、薄化粧して、かねぐろなり。我が子の小次郎がよはひほどにて、容顔まことに美麗なりければ、いづくに刀を立つべしともおぼえず。", "questions": [{"question": "「卑怯にも敵に後ろを見せさせ給ふものかな」の「卑怯なり」の意味として最も適切なものはどれか。", "choices": ["勇敢である", "臆病で恥知らずである", "身分が低い", "動作が素早い"], "correctIndex": 1, "explanation": "「卑怯なり」は現代語の「卑怯」とほぼ同じ意味で、戦う相手に背を見せて逃げるような、勇気がなく恥ずべき態度を指す。ここでは敵に背を向けて逃げようとした敦盛を、熊谷が非難する言葉として使われている。「勇敢である」「身分が低い」「動作が素早い」はいずれも「卑怯」の語義とは異なる。", "modernTranslation": ""}, {"question": "「容顔まことに美麗なりければ」の「容顔」の意味は何か。", "choices": ["顔立ち・容貌", "声の調子", "身にまとう鎧", "立ち居振る舞い"], "correctIndex": 0, "explanation": "「容顔」は顔かたち、容貌を意味する語。ここでは首を討とうと甲を押しあふのけて見た敦盛の顔立ちが、実に美しかったことを述べている。「声の調子」「鎧」「振る舞い」はいずれも顔そのものを表す語ではない。", "modernTranslation": ""}, {"question": "「敵に後ろを見せさせ給ふものかな」の「させ給ふ」に用いられている敬語の説明として正しいものはどれか。", "choices": ["謙譲の助動詞「さす」と丁寧の補助動詞「給ふ」の組み合わせ", "使役の助動詞「さす」と尊敬の補助動詞「給ふ」を重ねた二重敬語で、動作主(敦盛)への敬意を表す", "「さす」も「給ふ」もともに謙譲語で、熊谷自身をへりくだる表現", "完了の助動詞「さす」に尊敬の「給ふ」が続いた形"], "correctIndex": 1, "explanation": "ここでの「さす」は使役ではなく尊敬の意味を添える用法で、「給ふ」も尊敬の補助動詞であり、両者を重ねることで敦盛に対する高い敬意(二重敬語)を表している。謙譲や丁寧、完了の説明は誤り。", "modernTranslation": ""}, {"question": "「いづくに刀を立つべしともおぼえず」の「べし」の意味・用法として最も適切なものはどれか。", "choices": ["過去の推量", "可能(~できる)", "禁止(~してはならない)", "適当・当然(~するのがよい、~べきだ)"], "correctIndex": 3, "explanation": "この「べし」は、「どこに刀を突き立てるのがよいか」という、判断・適当の意味で使われている。熊谷が涙をこらえて敦盛の首を討とうとしながらも、あまりの美しさにどこに刀をあてるべきか分からず、ためらう様子を表す。過去の推量や禁止、単純な可能の意味ではない。", "modernTranslation": ""}, {"question": "傍線部「卑怯にも敵に後ろを見せさせ給ふものかな」の現代語訳として最も適切なものはどれか。", "choices": ["卑怯にも敵に背中を見せてお逃げになるとは、情けないことよ", "勇ましくも敵に立ち向かわれるとは、あっぱれなことよ", "卑怯にも味方を見捨てて逃げるとは、許しがたいことよ", "敵に後ろ姿を見せることこそ、武士の誉れである"], "correctIndex": 0, "explanation": "「卑怯にも」はそのまま「卑怯にも」、「敵に後ろを見せさせ給ふ」は「敵に背を向けてお逃げになる」、「ものかな」は詠嘆で「~ことよ、~なあ」の意。全体で、逃げようとする敦盛を熊谷が呼び止め、非難する言葉になっている。他の選択肢は文意と逆であったり、原文にない内容を含む。", "modernTranslation": "卑怯にも敵に背を向けてお逃げになるとは、情けないことですよ。"}, {"question": "傍線部「いづくに刀を立つべしともおぼえず」の現代語訳として最も適切なものはどれか。", "choices": ["どこに刀を立てればよいのか、少しも覚えていない", "どこに刀を突き立てたらよいのか、見当もつかない", "刀をどこに置いたのか、思い出せない", "刀を立てる場所は、すでに決まっていた"], "correctIndex": 1, "explanation": "「いづくに」は「どこに」、「刀を立つべしとも」は「刀を突き立てるのがよいかも」、「おぼえず」は「わからない・見当がつかない」の意。熊谷が、あまりに若く美しい敦盛の姿を見て、首を討つ決心がつかずためらう心情を表す。「思い出せない」は「おぼえず」の意味を取り違えている。", "modernTranslation": "どこに刀を突き立てたらよいのか、まったく見当がつかない。"}, {"question": "熊谷が扇をあげて敦盛を呼び戻した理由として最も適切なものはどれか。", "choices": ["敦盛と和睦するため", "敦盛に道を尋ねるため", "敵の大将軍と見て、正々堂々と勝負するため", "敦盛を助けて逃がすため"], "correctIndex": 2, "explanation": "熊谷は逃げようとする武者を「大将軍」と見て、卑怯にも背を見せて逃げることを非難し、正面から勝負するよう呼び戻している。当時の武士の名誉を重んじる価値観に基づく行動であり、和睦や道案内、逃がすためではない。", "modernTranslation": ""}, {"question": "熊谷が敦盛の首を討とうとしてためらった理由として最も適切なものはどれか。", "choices": ["敦盛が既に息絶えていたから", "敦盛の顔立ちが我が子の小次郎と同年輩で、美しかったから", "敦盛が助命を懇願したから", "味方の兵が近くにいて邪魔だったから"], "correctIndex": 1, "explanation": "甲を押しあふのけて敦盛の顔を見ると、我が子小次郎と同じ年頃で、たいそう美しい顔立ちであったため、熊谷はどこに刀を立てるべきか分からなくなるほど心が乱れた。他の選択肢は本文に根拠がない。", "modernTranslation": ""}, {"question": "「あれは大将軍とこそ見奉れ」の「あれ」が指しているものは何か。", "choices": ["源義経", "熊谷直実自身", "海上に浮かぶ舟", "波打ち際で逃げようとしている平敦盛"], "correctIndex": 3, "explanation": "「あれ」は、渚から沖の舟へ逃げようとしていた武者、すなわち後に熊谷が組み伏せる平敦盛を指す。熊谷はその後ろ姿を見て「大将軍であろう」と判断し、呼び戻している。", "modernTranslation": ""}, {"question": "「招かれて取つて返す」とあるが、招かれて引き返したのは誰か。", "choices": ["熊谷直実", "源義経", "平敦盛", "名もなき雑兵"], "correctIndex": 2, "explanation": "熊谷が扇をあげて招いたのに応じて、舟に向かう途中の馬を引き返したのは、招かれた側である平敦盛である。招いた側の熊谷ではない点に注意する。", "modernTranslation": ""}]}, {"source": "徒然草(家の作りやうは)", "passage": "家の作りやうは、夏をむねとすべし。冬はいかなる所にも住まる。暑き比わろき住居は、堪へ難き事なり。深き水は、涼しげなし。浅くて流れたる、遥かに涼し。細かなる物を見るに、遣戸は蔀の間よりも明し。天井の高きは、冬寒く、燈暗し。造作は、用なき所を作りたる、見るも面白く、万の用にも立ちてよしとぞ、人の定め合ひ侍りし。", "questions": [{"question": "「夏をむねとすべし」の「むね」の意味として最も適切なものはどれか。", "choices": ["屋根の棟木", "第一に重んじるべき中心", "胸のうち、心中", "建物の骨組み"], "correctIndex": 1, "explanation": "「むねとす」は「主とする、中心にする」という意味の慣用表現で、ここでは「家を作るにあたっては夏を第一に考えるべきだ」という意味になる。「棟木」や「骨組み」は建築部材を表す語であり文脈に合わない。「胸のうち」も語義として誤り。", "modernTranslation": ""}, {"question": "「堪へ難き事なり」の「堪ふ」の意味として最も適切なものはどれか。", "choices": ["我慢する、耐える", "喜ぶ", "住み替える", "涼をとる"], "correctIndex": 0, "explanation": "「堪ふ」は「耐える、我慢する」の意。「堪へ難き」は「我慢しにくい、耐えがたい」という意味になり、夏の暑い盛りに住みにくい家について述べている。", "modernTranslation": ""}, {"question": "「冬はいかなる所にも住まる」の「住まる」の「る」の文法的説明として正しいものはどれか。", "choices": ["受身の助動詞「る」", "尊敬の助動詞「る」", "可能の意味を表す助動詞「る」", "完了の助動詞「り」の連体形"], "correctIndex": 2, "explanation": "ここでの「る」は四段動詞「住む」の未然形「住ま」に付いた助動詞で、「~することができる」という可能の意味を表す。冬はどんな家でも住むことができる、という文意になる。受身・尊敬・完了ではこの文脈に合わない。", "modernTranslation": ""}, {"question": "「夏をむねとすべし」の「べし」の意味・用法として最も適切なものはどれか。", "choices": ["推定", "当然・適当(~するのがよい)", "可能", "打消推量"], "correctIndex": 1, "explanation": "この「べし」は「~するのがよい、~すべきだ」という当然・適当の意味を表す。家を作る際には夏を中心に考えるのがよい、という兼好法師の主張を述べる箇所である。", "modernTranslation": ""}, {"question": "傍線部「暑き比わろき住居は、堪へ難き事なり」の現代語訳として最も適切なものはどれか。", "choices": ["暑い季節に住み心地の悪い住居は、我慢できないものである", "暑い季節でも住み心地のよい家は、長持ちしないものである", "寒い季節に住みにくい家は、住む価値がないものである", "暑い季節には、どんな家でも住みにくく感じるものである"], "correctIndex": 0, "explanation": "「暑き比(頃)」は「暑い季節」、「わろき住居」は「住み心地の悪い住まい」、「堪へ難き事なり」は「我慢しにくいことである」の意。全体で、夏に住みにくい家は耐えがたいという主張になる。他の選択肢は主語や季節を取り違えている。", "modernTranslation": "暑い季節に住み心地の悪い住まいは、我慢できないものである。"}, {"question": "傍線部「遣戸は蔀の間よりも明し」の現代語訳として最も適切なものはどれか。", "choices": ["引き戸は、蔀戸(の隙間から入る光)よりも明るい", "引き戸は、蔀戸よりも作るのが難しい", "蔀戸は、引き戸よりも風通しがよい", "引き戸も蔀戸も、明るさに差はない"], "correctIndex": 0, "explanation": "「遣戸」は横に引いて開閉する戸、「蔀」は上下に開閉する格子状の戸で、「間」はその隙間を指す。細かい物を見るときには、引き戸の方が蔀戸の隙間から入る光よりも明るい、と述べている。", "modernTranslation": "引き戸は、蔀戸(の隙間から入る光)よりも明るい。"}, {"question": "兼好法師がこの文章で最も強く主張していることは何か。", "choices": ["家は夏の暑さをしのげるように作るべきだということ", "家は冬の寒さをしのげるように作るべきだということ", "天井は高く作るべきだということ", "水は深く湛えるべきだということ"], "correctIndex": 0, "explanation": "冒頭の「家の作りやうは、夏をむねとすべし」に主張が明示されており、以降の記述(冬はどんな家でも住める、暑い時期の住みにくさは耐えがたい等)もこの主張を補強する内容になっている。天井や水についての記述は具体例であり主張そのものではない。", "modernTranslation": ""}, {"question": "「深き水は、涼しげなし。浅くて流れたる、遥かに涼し」から読み取れる兼好法師の考え方として最も適切なものはどれか。", "choices": ["水は深ければ深いほど涼しく感じられる", "見た目の印象よりも実際の水温が重要である", "静かに深く湛えた水よりも、浅く流れる水の方が涼しさを感じさせる", "水は住居には必要ないものである"], "correctIndex": 2, "explanation": "兼好法師は、深く静かにたたえられた水よりも、浅くさらさらと流れる水の方が涼しげに感じられると述べており、実際の涼しさよりも「涼しげに見える」という感覚的な効果を重視していることがわかる。", "modernTranslation": ""}, {"question": "「万の用にも立ちてよしとぞ、人の定め合ひ侍りし」とあるが、ここで人々が評価し合った対象は何を指すか。", "choices": ["天井を高く作ること", "深い水を湛えること", "一見無駄に見える造作(用のない部分を作ること)", "冬の住まい方"], "correctIndex": 2, "explanation": "直前の「造作は、用なき所を作りたる、見るも面白く」を受けて、「そのような一見無駄な造作が、見た目にも面白く、実際にも様々な用途に役立ってよい」と人々が評価し合った、という文脈である。「万の用にも立ちてよし」の主語は、直前で述べられた「造作(用なき所を作ったもの)」を指す。", "modernTranslation": ""}, {"question": "「人の定め合ひ侍りし」の「し」の文法的意味として正しいものはどれか。", "choices": ["過去の助動詞「き」の連体形", "使役の助動詞「す」の連用形", "過去推量の助動詞「けむ」の一部", "サ変動詞「す」の連用形"], "correctIndex": 0, "explanation": "文末の「し」は過去の助動詞「き」の連体形で、「(以前に)人々が定め合った」という過去の出来事を回想的に述べている。「侍り」は丁寧の補助動詞で、「~ございました」に近いニュアンスを添えている。", "modernTranslation": ""}]}, {"source": "古今和歌集 仮名序", "passage": "やまとうたは、人の心を種として、万の言の葉とぞなれりける。世の中にある人、ことわざ繁きものなれば、心に思ふことを、見るもの聞くものにつけて、言ひ出せるなり。花に鳴く鶯、水に住む蛙の声を聞けば、生きとし生けるもの、いづれか歌をよまざりける。力をも入れずして天地を動かし、目に見えぬ鬼神をもあはれと思はせ、男女の仲をも和らげ、猛き武士の心をも慰むるは歌なり。", "questions": [{"question": "「やまとうた」の意味として正しいものはどれか。", "choices": ["漢詩", "和歌", "物語", "随筆"], "correctIndex": 1, "explanation": "「やまとうた」は「大和歌」、すなわち和歌を指す語で、漢詩(からうた)に対して日本古来の歌を表す。物語や随筆はジャンルが異なる。", "modernTranslation": ""}, {"question": "「言の葉」の意味として最も適切なものはどれか。", "choices": ["木の葉", "言葉、特に歌に詠まれた言葉", "手紙", "噂話"], "correctIndex": 1, "explanation": "「言の葉」は「言葉」を美化した表現で、特に和歌の言葉を指すことが多い。ここでは、人の心が種となって様々な言葉(歌)として現れ出る、という意味で使われている。", "modernTranslation": ""}, {"question": "「万の言の葉とぞなれりける」の文法的説明として正しいものはどれか。", "choices": ["係助詞「ぞ」の係り結びにより、文末の「ける」が連体形になっている", "「ぞ」は逆接の意味を表す接続助詞である", "「なれりける」の「り」は打消の助動詞である", "文末の「ける」は命令形である"], "correctIndex": 0, "explanation": "係助詞「ぞ」があるため、係り結びの法則により文末は本来の終止形「けり」ではなく連体形「ける」になっている。「り」は完了・存続の助動詞で、「~になったことだ」という意味を表す。", "modernTranslation": ""}, {"question": "「目に見えぬ鬼神をもあはれと思はせ」の「思はせ」の「せ」の文法的意味として正しいものはどれか。", "choices": ["尊敬", "使役", "受身", "過去"], "correctIndex": 1, "explanation": "この「せ」は使役の助動詞「す」の連用形で、「(歌が)目に見えない鬼神にさえ、しみじみとした情趣を感じさせる」という意味になる。歌の力によって鬼神の心を動かす、という内容である。", "modernTranslation": ""}, {"question": "傍線部「力をも入れずして天地を動かし」の現代語訳として最も適切なものはどれか。", "choices": ["力を入れないで、天と地をひっくり返し", "特別な力を入れなくても、天地の神々の心を動かし", "力士でさえも、天地の重さには敵わず", "力を尽くして、ようやく天地を動かし"], "correctIndex": 1, "explanation": "「力をも入れずして」は「特に力を入れることもなく」、「天地を動かし」は歌が天地の神々の心を感動させる、という比喩的表現。歌の持つ大きな力を誇張して述べた一節である。", "modernTranslation": "特別な力を入れなくても、天地の神々の心を動かし、"}, {"question": "傍線部「生きとし生けるもの、いづれか歌をよまざりける」の現代語訳として最も適切なものはどれか。", "choices": ["生きているものは皆、歌など詠むはずがない", "生きているものの中には、歌を詠むものと詠まないものがある", "生きているものはすべて、歌を詠まないものがあろうか、いや、みな歌を詠むのだ", "生きているものは、歌の詠み方を知らない"], "correctIndex": 2, "explanation": "「いづれか~ざりける」は反語表現で、「どれが~しないだろうか、いや、すべて~する」という意味になる。生きとし生けるものはすべて歌を詠む、という和歌の普遍性を強調した表現である。", "modernTranslation": "生きているものはすべて、歌を詠まないものがあろうか、いや、みな歌を詠むのである。"}, {"question": "この文章で紀貫之が述べている和歌の起源についての考えとして最も適切なものはどれか。", "choices": ["和歌は天皇の命令によって初めて作られた", "和歌は人の心が種となり、様々な言葉となって表れ出たものである", "和歌は中国の漢詩を真似て作られた", "和歌は特別な訓練を受けた者だけが詠めるものである"], "correctIndex": 1, "explanation": "冒頭「やまとうたは、人の心を種として、万の言の葉とぞなれりける」に、和歌は人の心を種として様々な言葉として生まれ出たものだ、という和歌観が示されている。", "modernTranslation": ""}, {"question": "「花に鳴く鶯、水に住む蛙の声を聞けば」という部分を挙げている目的として最も適切なものはどれか。", "choices": ["季節の移り変わりを説明するため", "人間だけでなく、生きるものすべてが歌を詠むことを示す例とするため", "鶯と蛙の鳴き声の違いを比較するため", "当時の自然観察の正確さを示すため"], "correctIndex": 1, "explanation": "鶯や蛙の声を例に挙げることで、直後の「生きとし生けるもの、いづれか歌をよまざりける」につなげ、人間に限らずあらゆる生き物が歌(声)を発することを述べ、和歌の普遍性を印象づけている。", "modernTranslation": ""}, {"question": "「猛き武士の心をも慰むるは歌なり」から読み取れる、歌の効用についての考え方として最も適切なものはどれか。", "choices": ["歌は勇猛な武士には効果がない", "歌は勇猛な武士の心さえも和らげ、慰める力を持つ", "歌は武士だけのものである", "歌は戦いの技術を教えるものである"], "correctIndex": 1, "explanation": "「猛き武士の心をも慰むる」は「荒々しい武士の心すら和ませ慰める」の意で、歌の持つ力の大き   var READING_GUIDE = "## 古文読解の基本的な進め方\n古文を読むときは、いきなり一語一語を訳そうとせず、まず文章全体を場面ごとに区切って「いつ・どこで・誰が」何をしているのかを大づかみに捉えることから始めるとよい。地の文(語り手による説明)と「」でくくられた会話文を区別し、会話文であれば誰の発言なのかを常に意識しながら読む。傍線部の設問では、傍線部だけを見て訳そうとせず、必ず前後の文脈まで読み、省略されている主語・目的語・助詞を補って考えることが正確な現代語訳につながる。わからない語句があっても、そこで立ち止まらず先まで読んでから戻ると、文脈から意味を推測できることが多い。\n\n## 主語・動作主を見失わないためのポイント\n古文では主語が頻繁に省略され、同じ一文の中でも主語が交代することがある。最大の手がかりは敬語である。尊敬語(「たまふ」「おはす」「せたまふ」など)が使われていれば動作主は身分の高い人物、謙譲語(「はべり」「たてまつる」など)が使われていれば動作の受け手が身分の高い人物であることが多い。また、「〜て」「〜つつ」「〜ば」などの接続助詞で動作が連続しているときは主語が変わらず続くことが多いが、格助詞「を」「に」を挟んで別の人物の動作に移る場合もあるため、動詞が変わるたびに「これは誰の動作か」を確認する習慣をつけたい。\n\n## 助動詞・敬語から読み取れる手がかり\n助動詞は文全体の意味を左右する重要な要素である。「けり」は過去のほか、昔から語り伝えられた事柄を語り出す伝聞過去の意味を持つことがあり、「べし」は文脈に応じて推量・意志・当然・可能など複数の意味になりうる。「り」「たり」「つ」「ぬ」は完了・存続を表し、動作が実際に完了しているか、その状態が続いているかを判断する手がかりになる。敬語は単なる丁寧さの表現ではなく、誰が誰に敬意を払っているかという人物関係そのものを示す情報であり、地の文中の敬語は多くの場合、語り手(作者)から登場人物へ向けられた敬意である。\n\n## 内容理解の問題でよくあるひっかけ\n選択肢問題では、本文に書かれていない情報を勝手に付け加えた選択肢、原因と結果を入れ替えた選択肢、程度や心情を誇張・矮小化した選択肢がよく紛れ込む。どの選択肢も一見もっともらしく見えるが、必ず「本文中のどの語句が根拠になるか」を確認し、根拠が見つからない選択肢は選ばないようにする。指示語(「それ」「かく」「かかる」「さ」など)を含む設問では、指示語を含む一文をそのまま訳さず、指す内容を具体的な語句に置き換えてから文全体を読み直すと、誤答の選択肢に気づきやすくなる。";

  var els = {};
  ["unit-groups","selected-unit-box","selected-unit-label",
   "btn-make-quiz","btn-view-guide",
   "error-banner","error-text","error-close",
   "view-setup","view-quiz","view-result","view-guide",
   "quiz-count","quiz-score","quiz-unit","quiz-passage","quiz-passage-text","quiz-dots","quiz-question","quiz-choices",
   "quiz-feedback","feedback-verdict","feedback-explanation","feedback-translation","feedback-translation-text",
   "btn-next-question",
   "result-frac","result-message","btn-retry-quiz","btn-new-quiz","btn-guide-from-result","btn-change-unit",
   "guide-content","btn-guide-back"
  ].forEach(function(id){ els[id.replace(/-([a-z])/g, function(_,c){return c.toUpperCase();})] = document.getElementById(id); });

  var quizData = [];
  var quizPassage = "";
  var currentIndex = 0;
  var score = 0;
  var results = []; // 'correct' | 'wrong' per question
  var selectedUnit = null;
  var lastReadingIndex = null;

  function switchView(name){
    ["setup","quiz","result","guide"].forEach(function(v){
      els["view"+v[0].toUpperCase()+v.slice(1)].hidden = (v !== name);
    });
  }

  function showError(msg){
    els.errorText.textContent = msg;
    els.errorBanner.hidden = false;
  }
  function clearError(){ els.errorBanner.hidden = true; }
  els.errorClose.addEventListener("click", clearError);

  // ---- Unit picker ----
  function renderUnitGroups(){
    els.unitGroups.innerHTML = "";
    UNITS.forEach(function(group){
      var wrap = document.createElement("div");
      wrap.className = "unit-group";
      var h3 = document.createElement("h3");
      h3.textContent = group.chapter;
      wrap.appendChild(h3);
      var chips = document.createElement("div");
      chips.className = "chips";
      group.items.forEach(function(item){
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = item.label;
        btn.dataset.unitId = item.id;
        btn.addEventListener("click", function(){ selectUnit(item); });
        chips.appendChild(btn);
      });
      wrap.appendChild(chips);
      els.unitGroups.appendChild(wrap);
    });
  }
  renderUnitGroups();

  function selectUnit(item){
    selectedUnit = item;
    lastReadingIndex = null;
    Array.prototype.forEach.call(els.unitGroups.querySelectorAll(".chip"), function(chip){
      chip.classList.toggle("active", chip.dataset.unitId === item.id);
    });
    els.selectedUnitLabel.textContent = item.label;
    els.selectedUnitBox.hidden = false;
    els.btnMakeQuiz.disabled = false;
    els.btnViewGuide.disabled = false;
    clearError();
  }

  // ---- Local question-pool based quiz generation (no account / no network needed) ----
  function shuffleArray(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function shuffleChoices(q){
    var order = shuffleArray([0,1,2,3]);
    return {
      question: q.question,
      choices: order.map(function(i){ return q.choices[i]; }),
      correctIndex: order.indexOf(q.correctIndex),
      explanation: q.explanation || "",
      modernTranslation: q.modernTranslation || ""
    };
  }

  function pickQuizForUnit(unit){
    if(unit.isReading){
      if(!READING_SETS.length) return null;
      var candidates = READING_SETS.map(function(_, i){ return i; });
      if(READING_SETS.length > 1 && lastReadingIndex !== null){
        candidates = candidates.filter(function(i){ return i !== lastReadingIndex; });
      }
      var idx = candidates[Math.floor(Math.random()*candidates.length)];
      lastReadingIndex = idx;
      var set = READING_SETS[idx];
      return {
        passage: set.passage,
        source: set.source || "",
        questions: shuffleArray(set.questions).map(shuffleChoices)
      };
    }
    var pool = QUESTION_POOLS[unit.id];
    if(!pool || !pool.length) return null;
    var picked = shuffleArray(pool).slice(0, 10).map(shuffleChoices);
    return { passage: "", source: "", questions: picked };
  }

  function startQuiz(){
    clearError();
    if(!selectedUnit) return;
    var result = pickQuizForUnit(selectedUnit);
    if(!result){
      showError("「" + selectedUnit.label + "」の問題は準備中です。別の単元をお試しください。");
      return;
    }
    quizData = result.questions;
    quizPassage = result.passage;
    currentIndex = 0;
    score = 0;
    results = [];
    renderQuizDots();
    els.quizUnit.textContent = "単元: " + selectedUnit.label + (result.source ? "(" + result.source + ")" : "");
    if(quizPassage){
      els.quizPassageText.textContent = quizPassage;
      els.quizPassage.hidden = false;
    } else {
      els.quizPassage.hidden = true;
    }
    renderQuestion();
    switchView("quiz");
  }

  function renderQuizDots(){
    els.quizDots.innerHTML = "";
    quizData.forEach(function(_, i){
      var span = document.createElement("span");
      span.dataset.index = i;
      els.quizDots.appendChild(span);
    });
    updateDots();
  }

  function updateDots(){
    var dots = els.quizDots.children;
    for(var i=0;i<dots.length;i++){
      dots[i].className = "";
      if(results[i] === "correct") dots[i].classList.add("done-correct");
      else if(results[i] === "wrong") dots[i].classList.add("done-wrong");
      else if(i === currentIndex) dots[i].classList.add("current");
    }
  }

  function renderQuestion(){
    var total = quizData.length;
    var q = quizData[currentIndex];
    els.quizCount.textContent = "問 " + (currentIndex+1) + " / " + total;
    els.quizScore.textContent = "正解 " + score;
    els.quizQuestion.textContent = q.question;
    els.quizFeedback.hidden = true;
    els.btnNextQuestion.hidden = true;
    updateDots();

    els.quizChoices.innerHTML = "";
    var letters = ["A","B","C","D"];
    q.choices.forEach(function(choiceText, idx){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      btn.innerHTML = '<span class="badge">' + letters[idx] + '</span><span></span>';
      btn.querySelector("span:last-child").textContent = choiceText;
      btn.addEventListener("click", function(){ onChoose(idx); });
      els.quizChoices.appendChild(btn);
    });
  }

  function onChoose(idx){
    var q = quizData[currentIndex];
    var buttons = els.quizChoices.querySelectorAll(".choice");
    buttons.forEach(function(b){ b.disabled = true; });

    var isCorrect = (idx === q.correctIndex);
    buttons[idx].classList.add(isCorrect ? "correct" : "incorrect");
    if(!isCorrect) buttons[q.correctIndex].classList.add("correct");

    if(isCorrect) score++;
    results[currentIndex] = isCorrect ? "correct" : "wrong";
    updateDots();
    els.quizScore.textContent = "正解 " + score;

    els.feedbackVerdict.textContent = isCorrect ? "○ 正解！" : "× 残念、不正解";
    els.feedbackVerdict.className = "verdict " + (isCorrect ? "correct" : "incorrect");
    els.feedbackExplanation.textContent = q.explanation || "";
    if(q.modernTranslation){
      els.feedbackTranslationText.textContent = q.modernTranslation;
      els.feedbackTranslation.hidden = false;
    } else {
      els.feedbackTranslation.hidden = true;
    }
    els.quizFeedback.hidden = false;
    els.btnNextQuestion.hidden = false;
    els.btnNextQuestion.textContent = (currentIndex === quizData.length-1) ? "結果を見る" : "次の問題へ";
  }

  els.btnNextQuestion.addEventListener("click", function(){
    if(currentIndex < quizData.length-1){
      currentIndex++;
      renderQuestion();
    } else {
      showResult();
    }
  });

  function showResult(){
    var total = quizData.length;
    els.resultFrac.textContent = score + "/" + total;
    var ratio = score/total;
    var msg;
    if(score === total) msg = "満点です！お見事な出来栄え。もう一つ別の単元にも挑戦してみましょう。";
    else if(ratio >= 0.7) msg = "よくできました。間違えた問題の解説を読み返して、仕上げていきましょう。";
    else if(ratio >= 0.4) msg = "もう少しです。解説を読み直して、同じ単元にもう一度挑戦してみましょう。";
    else msg = "まずは基礎から。学習ガイドで要点を確認してから、もう一度挑戦してみましょう。";
    els.resultMessage.textContent = msg;
    switchView("result");
  }

  els.btnRetryQuiz.addEventListener("click", function(){
    currentIndex = 0; score = 0; results = [];
    renderQuizDots();
    renderQuestion();
    switchView("quiz");
  });
  els.btnNewQuiz.addEventListener("click", function(){ startQuiz(); });
  els.btnChangeUnit.addEventListener("click", function(){ clearError(); switchView("setup"); });
  els.btnGuideFromResult.addEventListener("click", function(){ showGuide(); });
  els.btnGuideBack.addEventListener("click", function(){ clearError(); switchView("setup"); });

  function renderMarkdown(text){
    try{
      if(window.marked && typeof window.marked.parse === "function"){
        return window.marked.parse(text);
      }
    }catch(e){}
    var div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, "<br>");
  }

  function showGuide(){
    clearError();
    if(!selectedUnit) return;
    var md = selectedUnit.isReading ? READING_GUIDE : STUDY_GUIDES[selectedUnit.id];
    switchView("guide");
    if(!md){
      els.guideContent.innerHTML = "<p>「" + selectedUnit.label + "」の学習ガイドは準備中です。</p>";
      return;
    }
    els.guideContent.innerHTML = renderMarkdown(md);
  }

  els.btnMakeQuiz.addEventListener("click", function(){ startQuiz(); });
  els.btnViewGuide.addEventListener("click", function(){ showGuide(); });

})();
</script>
